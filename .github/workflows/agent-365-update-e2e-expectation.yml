name: Issue 365 supersession journey expectation

on:
  push:
    branches:
      - agent/365-tcr-supersession-browser

permissions:
  contents: write

jobs:
  patch:
    if: ${{ contains(github.event.head_commit.message, '[agent-365-e2e-expectation]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Update journey labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('product/client/tests/test-change-request-supersession.spec.ts')
          text = path.read_text(encoding='utf-8')
          old_summary = 'Show 1 superseded TCR revision'
          old_link = '`${predecessor!.displayNumber} · Superseded`'
          if text.count(old_summary) != 2:
              raise RuntimeError(f'expected two old summary references, found {text.count(old_summary)}')
          if text.count(old_link) != 1:
              raise RuntimeError(f'expected one old predecessor label, found {text.count(old_link)}')
          text = text.replace(old_summary, 'Show 1 superseded history item')
          text = text.replace(old_link, '`${predecessor!.displayNumber} · Superseded TCR`')
          path.write_text(text, encoding='utf-8')
          PY
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: product/client/package-lock.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v5.2.0
        with:
          dotnet-version: 10.0.x
      - name: Validate focused lifecycle journey
        working-directory: product/client
        run: |
          npm ci
          npx playwright install chromium
          npx playwright test tests/test-change-request-supersession.spec.ts --workers=1
      - name: Publish updated journey
        shell: bash
        run: |
          git diff --check
          git config user.name "seanmccarthyns"
          git config user.email "seanmccarthyns@gmail.com"
          git add product/client/tests/test-change-request-supersession.spec.ts
          git commit -m "Align supersession journey with assessment-aware history labels"
          git push origin "HEAD:${GITHUB_REF_NAME}"
