name: TEMP 566 client-backed theory inventory fix

on:
  push:
    branches:
      - chatgpt/tmp-566-inventory-fix

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chatgpt/566-fix-client-theory-inventory
          fetch-depth: 0

      - name: Fix intent ordering and add regression contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Replace-ExactlyOnce([string]$Path, [string]$Old, [string]$New) {
            $text = [IO.File]::ReadAllText($Path)
            $usesCrLf = $text.Contains("`r`n")
            $normalized = $text.Replace("`r`n", "`n")
            $oldNormalized = $Old.Replace("`r`n", "`n")
            $newNormalized = $New.Replace("`r`n", "`n")
            $count = [regex]::Matches($normalized, [regex]::Escape($oldNormalized)).Count
            if ($count -ne 1) { throw "Expected exactly one anchor in $Path; found $count." }
            $normalized = $normalized.Replace($oldNormalized, $newNormalized)
            if ($usesCrLf) { $normalized = $normalized.Replace("`n", "`r`n") }
            [IO.File]::WriteAllText($Path, $normalized, [Text.UTF8Encoding]::new($false))
          }

          $lib = 'product/test-contracts/lib/test-intent.mjs'
          $old = @'
          export function classifyIntent(test) {
            const intent = INTENTS.find((candidate) => candidate.test(test.body, test))
            if (intent) return intent
            return CLIENT.test(test.body)
              ? INTENTS.find((item) => item.key === 'http-boundary')
              : FALLBACK
          }
          '@.Trim()
          $new = @'
          export function classifyIntent(test) {
            const directIntent = INTENTS.find((candidate) => candidate.key !== 'rule-matrix' && candidate.test(test.body, test))
            if (directIntent) return directIntent
            if (CLIENT.test(test.body)) return INTENTS.find((item) => item.key === 'http-boundary')
            const matrix = INTENTS.find((item) => item.key === 'rule-matrix')
            if (matrix.test(test.body, test)) return matrix
            return FALLBACK
          }
          '@.Trim()
          Replace-ExactlyOnce $lib $old $new

          $tests = 'product/test-contracts/tests/inventory.test.mjs'
          $anchor = @'
          test('combined xUnit attributes count InlineData arguments containing closing brackets', () => {
          '@.Trim()
          $insert = @'
          test('client-backed helper theories stay HTTP-boundary instead of becoming rule-matrix candidates', () => {
            const source = `
          public sealed class RegisterTests
          {
              [Theory]
              [InlineData("search=Current")]
              [InlineData("search=SRCR-00050")]
              public async Task Search_uses_the_register_http_helper(string query)
              {
                  using var factory = new AeroLinkApiFactory();
                  using var client = factory.CreateClient();
                  var body = await RegisterAsync(client, query);
                  Assert.NotNull(body);
              }

              private static Task<object> RegisterAsync(HttpClient client, string query) =>
                  client.GetFromJsonAsync<object>($"/api/history/test-change-requests?{query}");
          }`
            const [row] = classifyFile(source, 'RegisterTests')
            assert.equal(row.cases, 2)
            assert.equal(row.hosted, 'hosted')
            assert.equal(row.intent, 'http-boundary')
          })

          test('combined xUnit attributes count InlineData arguments containing closing brackets', () => {
          '@.Trim()
          Replace-ExactlyOnce $tests $anchor $insert

      - name: Regenerate exact inventories
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node product/test-contracts/tools/generate-test-intent.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Intent inventory generation failed.' }
          node product/test-contracts/tools/generate-host-classification.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Host classification generation failed.' }

      - name: Validate inventory contracts and bounded diff
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --test product/test-contracts/tests/inventory.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Inventory contract suite failed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }
          $changed = @(git diff --name-only)
          $allowed = @(
            'product/test-contracts/api-host-classification.json',
            'product/test-contracts/api-test-intent.json',
            'product/test-contracts/lib/test-intent.mjs',
            'product/test-contracts/tests/inventory.test.mjs'
          )
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) { throw "Unexpected changed files: $($unexpected -join ', ')" }
          if ('product/test-contracts/lib/test-intent.mjs' -notin $changed -or 'product/test-contracts/tests/inventory.test.mjs' -notin $changed -or 'product/test-contracts/api-test-intent.json' -notin $changed) { throw 'Required inventory fix files were not changed.' }

      - name: Commit validated target
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'seanmccarthyns'
          git config user.email 'seanmccarthyns@users.noreply.github.com'
          git add -- product/test-contracts/api-host-classification.json product/test-contracts/api-test-intent.json product/test-contracts/lib/test-intent.mjs product/test-contracts/tests/inventory.test.mjs
          git commit -m 'Classify client-backed theories as HTTP boundaries'
          git push origin HEAD:chatgpt/566-fix-client-theory-inventory
