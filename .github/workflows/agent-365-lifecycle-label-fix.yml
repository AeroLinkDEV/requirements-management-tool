name: Agent 365 lifecycle label correction

on:
  push:
    branches:
      - agent/365-tcr-supersession-browser

permissions:
  contents: write

jobs:
  patch:
    if: ${{ contains(github.event.head_commit.message, '[agent-365-lifecycle-label]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Align full lifecycle assertions with exact history type
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('product/client/tests/test-change-request-supersession.spec.ts')
          text = path.read_text(encoding='utf-8')
          old_summary = "Show 1 superseded TCR revision"
          if text.count(old_summary) != 3:
              raise RuntimeError(f'expected three old history summaries, found {text.count(old_summary)}')
          text = text.replace(old_summary, "Show 1 superseded history item")
          old_link = "`${predecessor!.displayNumber} · Superseded`"
          if text.count(old_link) != 1:
              raise RuntimeError(f'expected one old predecessor link, found {text.count(old_link)}')
          text = text.replace(old_link, "`${predecessor!.displayNumber} · Superseded TCR`")
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: product/client/package-lock.json

      - name: Validate client and supersession regressions
        working-directory: product/client
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build
          npx playwright test tests/test-change-request-supersession-presentation.spec.ts tests/test-change-request-supersession.spec.ts --workers=1

      - name: Publish corrected regression
        shell: bash
        run: |
          git diff --check
          git config user.name "seanmccarthyns"
          git config user.email "seanmccarthyns@gmail.com"
          git add product/client/tests/test-change-request-supersession.spec.ts
          git commit -m "Align supersession lifecycle test with typed history labels"
          git push origin "HEAD:${GITHUB_REF_NAME}"
