name: Request full merge validation

on:
  pull_request_target:
    types: [labeled]

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  # A refresh may arrive before the readiness event and wait for its Product run. It must not hold the
  # dispatcher's concurrency slot while waiting. Both lanes still serialize their own same-head events.
  group: full-ci-request-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.event.label.name == 'ready-for-full-ci' && 'dispatch' || 'refresh' }}
  cancel-in-progress: false

jobs:
  dispatch-and-bind:
    # This job is the trusted PR-associated branch-protection binding for final Full evidence. The
    # latest label-event suite must retain the required check, including after a maintenance label. Reuse
    # and revalidate existing evidence for an already-ready PR; only the readiness label can dispatch Full.
    # This runs from the default branch, never checks out PR code, and still authenticates live readiness.
    name: Report what this run validated
    if: contains(github.event.pull_request.labels.*.name, 'ready-for-full-ci') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment:
      name: merge-authority
    env:
      GITHUB_TOKEN: ${{ github.token }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REQUEST_LABEL: ${{ github.event.label.name }}
    steps:
      - name: Install Node.js for the trusted readiness-target guard
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Authenticate live ready PR, dispatch once, and bind exact Product success
        shell: bash
        run: |
          set -euo pipefail
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          headers=(
            --header "Authorization: Bearer $GITHUB_TOKEN"
            --header "Accept: application/vnd.github+json"
            --header "X-GitHub-Api-Version: 2022-11-28"
          )
          SELF_RUN_ID="${{ github.run_id }}"
          SELF_RUN_ATTEMPT="${{ github.run_attempt }}"
          BOUNDARY_ID=0
          PINNED_ID=""
          PINNED_ATTEMPT=""

          # This protected-runner helper never comes from candidate code. Readiness and queue binding use
          # the same required App context, so a queue commit must never be approved through PR readiness.
          cat > "$RUNNER_TEMP/verify-readiness-target.mjs" <<'NODE_READINESS_TARGET'
          import { pathToFileURL } from 'node:url'

          export function verifyReadinessTarget(headSha, queue) {
            if (typeof headSha !== 'string' || !/^[0-9a-f]{40}$/.test(headSha)) throw new Error('Invalid readiness SHA.')
            const entries = queue?.data?.repository?.mergeQueue?.entries
            if ((queue?.errors && (!Array.isArray(queue.errors) || queue.errors.length > 0)) ||
                entries?.pageInfo?.hasNextPage !== false || !Array.isArray(entries?.nodes)) {
              throw new Error('Queue response is incomplete.')
            }
            for (const entry of entries.nodes) {
              const candidate = entry?.headCommit?.oid
              if (typeof candidate !== 'string' || !/^[0-9a-f]{40}$/.test(candidate)) throw new Error('Queue candidate identity is unresolved.')
              if (candidate === headSha) throw new Error('Readiness SHA is a current queue candidate.')
            }
          }

          async function main() {
            const [owner, name] = process.env.GITHUB_REPOSITORY.split('/')
            const response = await fetch(`${process.env.GITHUB_API_URL}/graphql`, {
              method: 'POST', signal: AbortSignal.timeout(30_000),
              headers: { Authorization: `Bearer ${process.env.GITHUB_TOKEN}`, Accept: 'application/vnd.github+json',
                'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28' },
              body: JSON.stringify({ variables: { owner, name },
                query: 'query($owner:String!,$name:String!){repository(owner:$owner,name:$name){mergeQueue{entries(first:100){nodes{headCommit{oid}} pageInfo{hasNextPage}}}}}' }),
            })
            if (!response.ok) throw new Error('Queue API read failed.')
            verifyReadinessTarget(process.env.HEAD_SHA, await response.json())
          }

          if (process.argv[1] && import.meta.url === pathToFileURL(process.argv[1]).href) {
            main().catch(() => {
              // Never print API bodies, inherited credentials or candidate-controlled exception text.
              console.error('PR readiness refused: target is a queue commit or its distinct identity is unverified.')
              process.exitCode = 1
            })
          }
          NODE_READINESS_TARGET

          verify_live_pr() {
            curl --fail-with-body --silent --show-error "${headers[@]}" \
              "$api/pulls/$PR_NUMBER" --output "$RUNNER_TEMP/live-pr.json"
            python - "$RUNNER_TEMP/live-pr.json" "$HEAD_SHA" "$HEAD_REF" "$GITHUB_REPOSITORY" <<'PY'
          import json
          import sys

          path, head_sha, head_ref, repository = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              pr = json.load(handle)
          labels = {label.get("name") for label in pr.get("labels", [])}
          failures = []
          if pr.get("state") != "open": failures.append("pull request is not open")
          if pr.get("head", {}).get("sha") != head_sha: failures.append("head SHA moved")
          # Readiness belongs to the immutable PR head. The captured base is the comparison input for that
          # Product run; main may advance while it runs, and the queue validates the eventual composition.
          if pr.get("head", {}).get("ref") != head_ref: failures.append("head ref moved")
          if pr.get("head", {}).get("repo", {}).get("full_name") != repository: failures.append("head repository changed")
          if "ready-for-full-ci" not in labels: failures.append("ready-for-full-ci is no longer present")
          if failures:
              raise SystemExit("Exact Full request is stale: " + "; ".join(failures))
          PY
          }

          # Bounded pagination walk: fetch up to three pages and require the walk to complete.
          # A still-present rel="next" refuses rather than reasoning over a truncated history.
          # Arguments: <output prefix> <base URL> — the separator between the base URL and
          # the pagination parameters comes from the base URL's own query string ("?" only
          # when the base has none), so existing query parameters are preserved verbatim.
          collect_pages() {
            local prefix="$1" base_url="$2" page complete=0 separator
            rm -f "$prefix.page."* "$prefix.headers."* 2>/dev/null || true
            case "$base_url" in
              *"?"*) separator="&" ;;
              *) separator="?" ;;
            esac
            for page in 1 2 3; do
              curl --fail-with-body --silent --show-error "${headers[@]}" \
                --dump-header "$prefix.headers.$page" \
                "$base_url${separator}page=$page&per_page=100" --output "$prefix.page.$page"
              if ! grep -qi '^link:.*rel="next"' "$prefix.headers.$page"; then
                complete=1
                break
              fi
            done
            if [ "$complete" != "1" ]; then
              echo "::error::History pagination did not complete within the bounded walk: $prefix"
              exit 1
            fi
          }

          # The single common gate before EVERY dispatch POST (NONE included): strict
          # authorization validation, mandatory requester identity, first-attempt-only
          # requesters, self-postdating, and spend-once consumption. REFUSED, errors and
          # unexpected output all terminate the dispatch path before any POST.
          authorize_dispatch() {
            collect_pages "$RUNNER_TEMP/events" "$api/issues/$PR_NUMBER/events"
            collect_pages "$RUNNER_TEMP/requester" "$api/actions/workflows/request-full-ci.yml/runs?head_sha=$HEAD_SHA&event=pull_request_target"
            local verdict
            verdict="$(python - "$RUNNER_TEMP" "$HEAD_SHA" "$HEAD_REF" "$PR_NUMBER" "$SELF_RUN_ID" "$SELF_RUN_ATTEMPT" <<'PY'
          import glob
          import json
          import sys
          from datetime import datetime

          prefix, head_sha, head_ref, pr_number, self_run_id, self_run_attempt = sys.argv[1:7]
          pr_number = int(pr_number)
          self_run_id = int(self_run_id)
          self_run_attempt = int(self_run_attempt)
          BOT = "github-actions[bot]"

          def instant(text):
              if not text:
                  return None
              try:
                  return datetime.fromisoformat(str(text).replace("Z", "+00:00"))
              except ValueError:
                  return None

          def refuse(reason):
              print("REFUSED " + reason)
              raise SystemExit(0)

          def load_list_pages(name):
              # List endpoints (issue events) answer with a bare JSON array.
              rows = []
              for path in sorted(glob.glob(prefix + "/" + name + ".page.*"),
                                 key=lambda p: int(p.rsplit(".", 1)[-1])):
                  with open(path, encoding="utf-8") as handle:
                      data = json.load(handle)
                  if not isinstance(data, list):
                      refuse("unexpected %s history response shape" % name)
                  rows.extend(data)
              return rows

          def load_wrapped_pages(name, wrapper):
              # Run-list endpoints answer with an object wrapping the run array.
              rows = []
              for path in sorted(glob.glob(prefix + "/" + name + ".page.*"),
                                 key=lambda p: int(p.rsplit(".", 1)[-1])):
                  with open(path, encoding="utf-8") as handle:
                      data = json.load(handle)
                  if not isinstance(data, dict) or not isinstance(data.get(wrapper), list):
                      refuse("unexpected %s history response shape" % name)
                  rows.extend(data[wrapper])
              return rows

          def trusted(run):
              return (run.get("head_sha") == head_sha and run.get("head_branch") == head_ref
                      and run.get("event") == "workflow_dispatch"
                      and (run.get("actor") or {}).get("login") == BOT
                      and (run.get("triggering_actor") or {}).get("login") == BOT
                      and pr_number in {item.get("number") for item in run.get("pull_requests", [])
                                        if isinstance(item, dict)})

          events = load_list_pages("events")
          requester = load_wrapped_pages("requester", "workflow_runs")
          try:
              with open(prefix + "/product-runs.json", encoding="utf-8") as handle:
                  product_payload = json.load(handle)
          except (ValueError, OSError):
              refuse("unreadable Product run transcript")
          if not isinstance(product_payload, dict) or not isinstance(product_payload.get("workflow_runs"), list):
              refuse("unexpected Product run transcript shape")
          runs = product_payload["workflow_runs"]

          boundary = None
          for run in runs:
              if (run.get("status") == "completed" and run.get("conclusion") != "success"
                      and trusted(run)):
                  moment = instant(run.get("updated_at"))
                  if moment is None:
                      refuse("unestablishable failure boundary on Product run %s" % run.get("id"))
                  boundary = moment if boundary is None or moment > boundary else boundary

          labels = [e for e in events
                    if e.get("event") == "labeled"
                    and (e.get("label") or {}).get("name") == "ready-for-full-ci"]
          if not labels:
              refuse("no readiness label event in the complete history")
          latest = None
          for e in labels:
              moment = instant(e.get("created_at"))
              if moment is None:
                  refuse("unestablishable readiness label timestamp (event %s)" % e.get("id"))
              latest = moment if latest is None or moment > latest else latest

          if self_run_attempt != 1:
              refuse("requester rerun (attempt %s); reruns reconcile or refuse, never dispatch"
                     % self_run_attempt)
          own = None
          for run in requester:
              if run.get("id") == self_run_id:
                  own = run
                  break
          # Identity validation happens BEFORE the own timestamp is used or the record is
          # excluded from consumption: a record with this id but a different head or event
          # is not this requester.
          if (own is None or own.get("event") != "pull_request_target"
                  or own.get("head_sha") != head_sha):
              refuse("current requester identity is missing from the history or mismatches this head")
          own_created = instant(own.get("created_at"))
          if own_created is None:
              refuse("unestablishable requester timestamp (run %s)" % own.get("id"))
          if not own_created > latest:
              refuse("requester predates the authorization and cannot act under it")
          for run in requester:
              if run.get("head_sha") != head_sha or run.get("event") != "pull_request_target":
                  continue
              created = instant(run.get("created_at"))
              if created is None:
                  refuse("unestablishable requester timestamp (run %s)" % run.get("id"))
              if run.get("id") == self_run_id and run.get("run_attempt") == self_run_attempt:
                  continue
              if created >= latest:
                  refuse("authorization already consumed by requester run %s" % run.get("id"))

          if boundary is not None and not latest > boundary:
              refuse("authorization predates the newest failed Product attempt (stale)")
          print("ALLOWED " + latest.isoformat())
          PY
          )"
          case "$verdict" in
            ALLOWED*) : ;;
            REFUSED*)
              echo "::error::Dispatch refused: ${verdict#REFUSED }"
              exit 1
              ;;
            *)
              echo "::error::Unexpected authorization gate output: $verdict"
              exit 1
              ;;
          esac
          }

          find_product_run() {
            curl --fail-with-body --silent --show-error "${headers[@]}" \
              "$api/actions/workflows/ci.yml/runs?head_sha=$HEAD_SHA&event=workflow_dispatch&per_page=100" \
              --output "$RUNNER_TEMP/product-runs.json"
            BOUNDARY_ID="$BOUNDARY_ID" python - "$RUNNER_TEMP/product-runs.json" "$HEAD_SHA" "$PR_NUMBER" "$HEAD_REF" <<'PY'
          import json
          import os
          import sys

          path, head_sha, pr_number, head_ref = sys.argv[1:5]
          pr_number = int(pr_number)
          boundary_id = int(os.environ.get("BOUNDARY_ID") or 0)
          with open(path, encoding="utf-8") as handle:
              runs = json.load(handle).get("workflow_runs", [])
          matches = []
          for run in runs:
              prs = {item.get("number") for item in run.get("pull_requests", [])}
              if (
                  run.get("head_sha") == head_sha
                  and run.get("head_branch") == head_ref
                  and run.get("event") == "workflow_dispatch"
                  and run.get("actor", {}).get("login") == "github-actions[bot]"
                  and run.get("triggering_actor", {}).get("login") == "github-actions[bot]"
                  and pr_number in prs
                  # Post-dispatch discovery considers only attempts newer than the
                  # pre-dispatch boundary: pre-boundary history can neither bind nor
                  # shadow the newly dispatched run.
                  and int(run.get("id", 0)) > boundary_id
              ):
                  matches.append(run)
          # Every run reaching here is already trusted: exact head SHA, exact branch, dispatched by the bot on
          # behalf of this PR. So a second one is not an ambiguity to refuse, it is another attempt at the same
          # question. Refusing outright made a SHA permanently unbindable once a first attempt timed out and a
          # retry dispatched a second, with a fresh commit the only escape.
          successful = [
              run for run in matches
              if run.get("status") == "completed" and run.get("conclusion") == "success"
          ]
          if successful:
              # A success at this exact SHA is authoritative however many attempts it took. Lowest id keeps the
              # choice deterministic across polls.
              run = min(successful, key=lambda item: item["id"])
              print(f"FOUND {run['id']} completed success")
          elif matches and all(run.get("status") == "completed" for run in matches):
              # All attempts finished and none passed. Report the newest attempt so the caller
              # fails on the real conclusion rather than on a timeout that names nothing.
              run = max(matches, key=lambda item: item["id"])
              print(f"EXHAUSTED {run['id']} {run.get('conclusion')} {run.get('updated_at')}")
          elif matches:
              # An attempt is still running. Attach to the newest UNFINISHED attempt: a
              # completed failure among the matches must never be selected as the run we
              # wait on (it is already accounted for by the EXHAUSTED reporting above).
              running = [run for run in matches if run.get("status") != "completed"]
              run = max(running, key=lambda item: item["id"])
              print(f"PENDING {run['id']}")
          else:
              print("NONE")
          PY
          }

          # Shared identity/trust check for a candidate Product run record, with two modes:
          # "pin" validates a candidate and reports its attempt (a completed failure is
          # never pin-worthy — the matcher reports those as EXHAUSTED); "poll" re-derives
          # the terminal state of an already-pinned run and refuses attempt changes.
          # Outputs: pin -> "ATTEMPT <n>" or "REFUSED <reason>"; poll -> "RUNNING",
          # "SUCCEEDED", "FAILED <conclusion>" or "REFUSED <reason>" (nonzero exit).
          cat > "$RUNNER_TEMP/check-product-run.py" <<'PY'
          import json
          import sys

          mode = sys.argv[1]
          path, head_sha, head_ref, pr_number = sys.argv[2:6]
          expected_attempt = sys.argv[6] if mode == "poll" else ""
          pr_number = int(pr_number)
          BOT = "github-actions[bot]"

          def login(value):
              return value.get("login") if isinstance(value, dict) else None

          def refuse(reason):
              print("REFUSED " + reason)
              raise SystemExit(1)

          with open(path, encoding="utf-8") as handle:
              run = json.load(handle)
          if run.get("head_sha") != head_sha:
              refuse("pinned run head SHA mismatch")
          if run.get("head_branch") != head_ref:
              refuse("pinned run head ref mismatch")
          if run.get("event") != "workflow_dispatch":
              refuse("pinned run is not a workflow_dispatch run")
          if login(run.get("actor")) != BOT or login(run.get("triggering_actor")) != BOT:
              refuse("pinned run trust identity changed")
          if pr_number not in {item.get("number") for item in run.get("pull_requests", [])
                               if isinstance(item, dict)}:
              refuse("pinned run is not associated with this pull request")
          attempt = run.get("run_attempt")
          if mode == "pin":
              if run.get("status") == "completed" and run.get("conclusion") != "success":
                  refuse("refusing to pin a completed failure (run %s)" % run.get("id"))
              print("ATTEMPT " + str(attempt))
          else:
              if str(expected_attempt) and str(attempt) != str(expected_attempt):
                  refuse("pinned run attempt changed (%s -> %s)" % (expected_attempt, attempt))
              if run.get("status") != "completed":
                  print("RUNNING")
              elif run.get("conclusion") == "success":
                  print("SUCCEEDED")
              else:
                  print("FAILED " + str(run.get("conclusion")))
          PY

          # Validate a candidate record through the exact identity checks and pin it
          # (id + attempt). Any identity problem, or a completed failure, refuses.
          # The check verdict travels through a file so its text stays visible even
          # when the caller's command substitution must not swallow it.
          fetch_and_pin_run() {
            curl --fail-with-body --silent --show-error "${headers[@]}" \
              "$api/actions/runs/$1" --output "$RUNNER_TEMP/pin-$1.json"
            python "$RUNNER_TEMP/check-product-run.py" pin "$RUNNER_TEMP/pin-$1.json" \
              "$HEAD_SHA" "$HEAD_REF" "$PR_NUMBER" > "$RUNNER_TEMP/pin-check" || true
            local check
            check="$(cat "$RUNNER_TEMP/pin-check")"
            case "$check" in
              REFUSED*)
                echo "::error::$check"
                exit 1
                ;;
              ATTEMPT*)
                PINNED_ID="$1"
                PINNED_ATTEMPT="${check#ATTEMPT }"
                ;;
              *)
                echo "::error::Unexpected pinned-run check output: $check"
                exit 1
                ;;
            esac
          }

          # Direct poll of the pinned identity only. The verdict is written to a file
          # (never swallowed by command substitution); a refusal exits nonzero after
          # the reason has been surfaced on stdout.
          poll_pinned() {
            curl --fail-with-body --silent --show-error "${headers[@]}" \
              "$api/actions/runs/$PINNED_ID" --output "$RUNNER_TEMP/pinned-$PINNED_ID.json"
            python "$RUNNER_TEMP/check-product-run.py" poll "$RUNNER_TEMP/pinned-$PINNED_ID.json" \
              "$HEAD_SHA" "$HEAD_REF" "$PR_NUMBER" "$PINNED_ATTEMPT" > "$RUNNER_TEMP/poll-check" || true
          }

          # The uncertain-outcome-safe dispatch: the common gate has already allowed this
          # caller and terminates the path on refusal. Exactly ONE POST is sent. A 2xx
          # response carries the run identity, which is validated and pinned; any transport
          # error, non-2xx status, or missing identity is an UNCERTAIN outcome — discovery
          # only (spend-once makes any new trusted attempt this requester's own), bounded
          # wait, refusal. The request is never retransmitted.
          dispatch_full_run() {
            verify_live_pr
            authorize_dispatch
            python - <<'PY' > "$RUNNER_TEMP/full-ci-dispatch.json"
          import json
          import os
          print(json.dumps({
              "ref": os.environ["HEAD_REF"],
              "inputs": {
                  "pull_request_number": os.environ["PR_NUMBER"],
                  "pull_request_base_sha": os.environ["BASE_SHA"],
                  "pull_request_head_sha": os.environ["HEAD_SHA"],
                  "full_diagnostics": "false",
              },
              "return_run_details": True,
          }))
          PY
            local curl_status=0
            curl --silent --show-error \
              --request POST "${headers[@]}" \
              --header "Content-Type: application/json" \
              --data-binary "@$RUNNER_TEMP/full-ci-dispatch.json" \
              --output "$RUNNER_TEMP/dispatch-response.json" \
              --write-out '%{http_code}' \
              "$api/actions/workflows/ci.yml/dispatches" \
              > "$RUNNER_TEMP/dispatch-code" 2> "$RUNNER_TEMP/dispatch-stderr" || curl_status=$?
            if [ "$curl_status" -ne 0 ] || ! grep -Eq '^2[0-9][0-9]$' "$RUNNER_TEMP/dispatch-code"; then
              echo "::warning::Dispatch outcome uncertain (curl exit $curl_status, status $(cat "$RUNNER_TEMP/dispatch-code" 2>/dev/null || echo unknown)); entering bounded discovery without retransmission."
              return 0
            fi
            local response_id
            response_id="$(python - "$RUNNER_TEMP/dispatch-response.json" <<'PY'
          import json
          import sys
          try:
              with open(sys.argv[1], encoding="utf-8") as handle:
                  body = json.load(handle)
              print(body.get("workflow_run_id") or "")
          except (ValueError, OSError):
              print("")
          PY
          )"
            if [ -n "$response_id" ]; then
              fetch_and_pin_run "$response_id"
            fi
            # A 2xx without a usable identity is equally uncertain: boundary-filtered
            # discovery below may only pin newer attempts.
          }

          verify_live_pr
          node "$RUNNER_TEMP/verify-readiness-target.mjs"
          match="$(find_product_run)"
          case "$match" in
            ERROR*) echo "::error::$match"; exit 1 ;;
            FOUND*)
              read -r _ run_id _ _ <<< "$match"
              fetch_and_pin_run "$run_id"
              ;;
            PENDING*)
              read -r _ run_id <<< "$match"
              fetch_and_pin_run "$run_id"
              ;;
            EXHAUSTED*)
              read -r _ boundary_id _ _ <<< "$match"
              BOUNDARY_ID="$boundary_id"
              # All matching trusted attempts finished unsuccessfully. Only a fresh
              # readiness request whose requester qualifies under the common gate may
              # dispatch one new attempt; refreshes report the real conclusion.
              if [ "$REQUEST_LABEL" != "ready-for-full-ci" ]; then
                echo "::error::Exact-head Product run $boundary_id completed unsuccessfully; a refresh cannot dispatch Full."
                exit 1
              fi
              dispatch_full_run
              ;;
            NONE)
              # The readiness event can be delayed behind an unrelated label event. Refreshes use the
              # existing bounded polling loop while the separate dispatcher lane creates the trusted run.
              # They never dispatch Full themselves, and missing proof still times out as failure.
              if [ "$REQUEST_LABEL" = "ready-for-full-ci" ]; then
                dispatch_full_run
              fi
              ;;
            *) echo "::error::Unexpected Product-run matcher output: $match"; exit 1 ;;
          esac

          authoritative="false"
          run_id=""
          # 420 polls at 10s is 70 minutes, and timeout-minutes above must stay ahead of it.
          #
          # 210 was 35 minutes, which sat below the Product gate's own median. Sixteen successful gate runs
          # measured 15.1m min, 36.9m median, 54.3m p90, 54.4m max — bimodal, because a change that touches the
          # client runs the browser journey shards and one that does not skips them. So more than half of
          # genuinely passing gates could not be bound, and every miss cost a full re-run of a suite that had
          # already gone green. Seventy clears the observed maximum with room for dispatch queueing; the only
          # cost of the headroom is that a truly hung gate takes longer to be declared dead.
          for attempt in $(seq 1 420); do
            verify_live_pr
            if [ -n "$PINNED_ID" ]; then
              poll_status=0
              poll_pinned || poll_status=$?
              state="$(cat "$RUNNER_TEMP/poll-check")"
              case "$state" in
                RUNNING)
                  [ "$poll_status" = "0" ] || { echo "::error::Pinned-run poll failed unexpectedly."; exit 1; }
                  sleep 10
                  continue
                  ;;
                SUCCEEDED)
                  [ "$poll_status" = "0" ] || { echo "::error::Pinned-run poll failed unexpectedly."; exit 1; }
                  authoritative="true"
                  run_id="$PINNED_ID"
                  break
                  ;;
                FAILED*|REFUSED*)
                  echo "::error::Pinned Product run $PINNED_ID (attempt $PINNED_ATTEMPT): $state."
                  exit 1
                  ;;
                *)
                  echo "::error::Unexpected pinned-run state: $state"
                  exit 1
                  ;;
              esac
            fi
            match="$(find_product_run)"
            case "$match" in
              ERROR*) echo "::error::$match"; exit 1 ;;
              NONE) sleep 10; continue ;;
              PENDING*)
                read -r _ run_id <<< "$match"
                fetch_and_pin_run "$run_id"
                continue
                ;;
              FOUND*)
                read -r _ run_id _ _ <<< "$match"
                fetch_and_pin_run "$run_id"
                continue
                ;;
              EXHAUSTED*)
                read -r _ finished_id _ _ <<< "$match"
                echo "::error::The dispatched Product run $finished_id completed unsuccessfully."
                exit 1
                ;;
              *)
                echo "::error::Unexpected Product-run matcher output: $match"
                exit 1
                ;;
            esac
          done

          if [ "$authoritative" != "true" ] || [ -z "$run_id" ] || [ -z "$PINNED_ATTEMPT" ]; then
            echo "::error::No successful trusted Product workflow_dispatch completed for exact head $HEAD_SHA before timeout."
            exit 1
          fi

          # Qualification evidence comes from the pinned run's pinned attempt: a latest-jobs
          # filter alone cannot bind evidence to the selected attempt.
          curl --fail-with-body --silent --show-error "${headers[@]}" \
            "$api/actions/runs/$run_id/attempts/$PINNED_ATTEMPT/jobs?per_page=100" \
            --output "$RUNNER_TEMP/product-jobs.json"
          python - "$RUNNER_TEMP/product-jobs.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              jobs = json.load(handle).get("jobs", [])

          classifiers = [job for job in jobs if job.get("name") == "Classify changed product areas"]
          if len(classifiers) != 1:
              raise SystemExit(f"expected exactly one Product classifier job, found {len(classifiers)}")
          authentication_steps = [
              step
              for step in classifiers[0].get("steps", [])
              if step.get("name") == "Authenticate label-dispatched pull-request context"
          ]
          if len(authentication_steps) != 1:
              raise SystemExit(
                  "expected exactly one Product label-dispatch authentication step, "
                  f"found {len(authentication_steps)}"
              )
          authentication = authentication_steps[0]
          if authentication.get("status") != "completed" or authentication.get("conclusion") != "success":
              raise SystemExit(
                  "Product label-dispatch authentication is not authoritative success: "
                  f"status={authentication.get('status')} conclusion={authentication.get('conclusion')}"
              )
          print("Product label-dispatch authentication completed successfully.")

          accepted_names = {"Report what this run validated", "Full Product evidence aggregate"}
          gates = [job for job in jobs if job.get("name") in accepted_names]
          if len(gates) != 1:
              raise SystemExit(f"expected exactly one Product aggregate job, found {len(gates)}")
          gate = gates[0]
          if gate.get("status") != "completed" or gate.get("conclusion") != "success":
              raise SystemExit(
                  f"Product aggregate is not authoritative success: name={gate.get('name')} "
                  f"status={gate.get('status')} conclusion={gate.get('conclusion')}"
              )
          print(f"Product aggregate {gate.get('name')} ({gate.get('id')}) completed successfully.")
          PY

          verify_live_pr
          echo "Bound exact Product Full run $run_id (attempt $PINNED_ATTEMPT) to PR #$PR_NUMBER head $HEAD_SHA using comparison base $BASE_SHA." >> "$GITHUB_STEP_SUMMARY"
      - name: Mint the repository-scoped Merge Authority token
        id: authority-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.MERGE_AUTHORITY_APP_CLIENT_ID }}
          private-key: ${{ secrets.MERGE_AUTHORITY_APP_PRIVATE_KEY }}
          permission-checks: write
          permission-contents: read
      - name: Publish trusted pull-request readiness
        shell: bash
        env:
          MERGE_AUTHORITY_TOKEN: ${{ steps.authority-token.outputs.token }}
        run: |
          set -euo pipefail
          # A queue alias can appear while Full CI runs. Recheck after that wait, before App publication.
          node "$RUNNER_TEMP/verify-readiness-target.mjs"
          python - <<'PY' > "$RUNNER_TEMP/merge-authority-pr-check.json"
          import json
          import os

          repository = os.environ["GITHUB_REPOSITORY"]
          head_sha = os.environ["HEAD_SHA"]
          run_id = os.environ["GITHUB_RUN_ID"]
          print(json.dumps({
              "name": "Trusted merge-queue binding",
              "head_sha": head_sha,
              "status": "completed",
              "conclusion": "success",
              "details_url": f"https://github.com/{repository}/actions/runs/{run_id}",
              "external_id": f"aerolink-merge-authority:pull-request:{head_sha}",
              "output": {
                  "title": "Trusted pull-request evidence bound",
                  "summary": "Default-branch verification bound the exact successful Product gate to this pull-request head, so it may enter the merge queue.",
              },
          }))
          PY
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $MERGE_AUTHORITY_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/merge-authority-pr-check.json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/check-runs"

  pr-product-aggregate:
    # GitHub associates a check with a pull request only when the check is a real job in that PR event's
    # check suite. An API-created check on the same commit is not sufficient for merge-queue admission.
    # `always()` makes a failed or skipped dependency reach the explicit refusal below instead of turning
    # this required check into a skipped success.
    # Never skip this required check or change its name for a later label event. Without an authenticated
    # successful prerequisite it must fail, including when readiness is absent or the head is foreign.
    name: Full Product evidence aggregate
    if: always()
    needs: dispatch-and-bind
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require trusted exact-Product verification
        shell: bash
        env:
          TRUSTED_REQUEST_RESULT: ${{ needs.dispatch-and-bind.result }}
        run: |
          set -euo pipefail
          if [ "$TRUSTED_REQUEST_RESULT" != "success" ]; then
            echo "::error::Trusted exact-Product verification concluded $TRUSTED_REQUEST_RESULT; refusing PR Product authority."
            exit 1
          fi
          echo "The trusted default-branch requester verified exact Product success for this pull-request head." >> "$GITHUB_STEP_SUMMARY"
