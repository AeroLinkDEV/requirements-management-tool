name: PR 439 independent review fixes

on:
  push:
    branches:
      - agent/421-424-exact-procedure-history

permissions:
  contents: write

jobs:
  patch:
    if: ${{ contains(github.event.head_commit.message, '[agent-439-review-fixes]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply exact-revision and provenance corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8-sig')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one match, found {count}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          # A procedure revision owns an immutable snapshot of every exact source CR represented by its
          # producing TCR revision. Claims may move to a later TCR revision; this snapshot must not.
          domain = 'product/src/AeroLink.Domain/Verification/VerificationRecords.cs'
          replace_once(domain,
          '''        string? selectedApproverId = null, Guid? sourceTestChangeRequestId = null, Guid? effectiveBaselineId = null)
              {''',
          '''        string? selectedApproverId = null, Guid? sourceTestChangeRequestId = null,
                  Guid? effectiveBaselineId = null, string sourceChangeRequestsJson = "[]")
              {''')
          replace_once(domain,
          '''        SourceTestChangeRequestId = sourceTestChangeRequestId; EffectiveBaselineId = effectiveBaselineId;
              }''',
          '''        SourceTestChangeRequestId = sourceTestChangeRequestId; EffectiveBaselineId = effectiveBaselineId;
                  var sourceSnapshot = string.IsNullOrWhiteSpace(sourceChangeRequestsJson)
                      ? "[]"
                      : sourceChangeRequestsJson.Trim();
                  try { using var parsed = System.Text.Json.JsonDocument.Parse(sourceSnapshot); }
                  catch (System.Text.Json.JsonException)
                  { throw new DomainException("Test procedure source-change provenance must be valid JSON."); }
                  SourceChangeRequestsJson = sourceSnapshot;
              }''')
          replace_once(domain,
          '''    /// <summary>The baseline this revision first became effective in. Null for the same legacy reason.</summary>
              public Guid? EffectiveBaselineId { get; private set; }
              public DateTimeOffset CreatedAt { get; private set; }''',
          '''    /// <summary>The baseline this revision first became effective in. Null for the same legacy reason.</summary>
              public Guid? EffectiveBaselineId { get; private set; }
              /// <summary>
              /// Immutable exact source-CR identities captured from the producing TCR revision when this procedure
              /// revision was materialized. Claims may move to a successor TCR; this evidence does not.
              /// </summary>
              public string SourceChangeRequestsJson { get; private set; } = "[]";
              public DateTimeOffset CreatedAt { get; private set; }''')

          dbcontext = 'product/src/AeroLink.Infrastructure/Persistence/AeroLinkDbContext.cs'
          replace_once(dbcontext,
          '''            b.Property(x => x.AuthorId).HasMaxLength(100).IsRequired(); b.Property(x => x.SelectedApproverId).HasMaxLength(100); b.HasIndex(x => new { x.ProcedureId, x.Revision }).IsUnique();
                  b.HasIndex(x => x.SourceTestChangeRequestId);''',
          '''            b.Property(x => x.AuthorId).HasMaxLength(100).IsRequired(); b.Property(x => x.SelectedApproverId).HasMaxLength(100); b.HasIndex(x => new { x.ProcedureId, x.Revision }).IsUnique();
                  b.Property(x => x.SourceChangeRequestsJson).IsRequired().HasDefaultValue("[]");
                  b.HasIndex(x => x.SourceTestChangeRequestId);''')

          materializer = 'product/src/AeroLink.Infrastructure/Persistence/TestProcedureBaselineMaterializer.cs'
          replace_once(materializer,
          '''public sealed class TestProcedureBaselineMaterializer(AeroLinkDbContext db)
          {''',
          '''public sealed class TestProcedureBaselineMaterializer(AeroLinkDbContext db)
          {
              private sealed record ProcedureSourceSnapshot(
                  Guid ChangeRequestId, string ChangeRequestNumber, bool Originating);''')
          replace_once(materializer,
          '''        var tcrs = await db.TestChangeReviews.AsNoTracking().Where(x => tcrIds.Contains(x.Id))
                  .Include(x => x.ProcedureChanges).ToListAsync(ct);''',
          '''        var tcrs = await db.TestChangeReviews.AsNoTracking().Where(x => tcrIds.Contains(x.Id))
                  .Include(x => x.ProcedureChanges).Include(x => x.AdditionalSources).ToListAsync(ct);''')
          replace_once(materializer,
          '''    private static TestProcedureRevision CreateRevision(Guid procedureId, TestProcedureChange change,
                  TestChangeReview tcr, Guid baselineId, DateTimeOffset now, TestProcedureState state) =>
                  new(procedureId, change.Revision, change.Objective, change.Preconditions, change.Steps,
                      change.ExpectedResult, state, tcr.SubmittedBy ?? tcr.DecidedBy ?? "aerolink.lifecycle", now,
                      null, tcr.Id, baselineId);

              private static IReadOnlyList<Guid> DrivingRequirements''',
          '''    private static TestProcedureRevision CreateRevision(Guid procedureId, TestProcedureChange change,
                  TestChangeReview tcr, Guid baselineId, DateTimeOffset now, TestProcedureState state) =>
                  new(procedureId, change.Revision, change.Objective, change.Preconditions, change.Steps,
                      change.ExpectedResult, state, tcr.SubmittedBy ?? tcr.DecidedBy ?? "aerolink.lifecycle", now,
                      null, tcr.Id, baselineId, SourceSnapshotJson(tcr));

              private static string SourceSnapshotJson(TestChangeReview tcr)
              {
                  var sources = new[]
                      {
                          new ProcedureSourceSnapshot(
                              tcr.ChangeRequestId, tcr.SourceChangeRequestNumber, true),
                      }
                      .Concat(tcr.AdditionalSources.Select(x => new ProcedureSourceSnapshot(
                          x.ChangeRequestId, x.ChangeRequestNumber, false)))
                      .DistinctBy(x => x.ChangeRequestId)
                      .OrderBy(x => x.ChangeRequestId)
                      .ToList();
                  return JsonSerializer.Serialize(sources);
              }

              private static IReadOnlyList<Guid> DrivingRequirements''')

          provenance = 'product/src/AeroLink.Infrastructure/Persistence/TestProcedureProvenanceProjection.cs'
          Path(provenance).write_text(textwrap.dedent(r'''
              using System.Text.Json;
              using AeroLink.Domain.Verification;
              using Microsoft.EntityFrameworkCore;

              namespace AeroLink.Infrastructure.Persistence;

              /// <summary>
              /// One exact reason a controlled procedure revision exists.
              ///
              /// Package is the producing TCR revision, ChangeRequest is the source engineering change represented by this
              /// row, and Subject/Action are the impact detail when one exists. Manual TCRs legitimately have package/source
              /// provenance without an impact item, in which case Subject is empty and Action is PackageSource.
              /// </summary>
              public sealed record TestProcedureProvenanceDriver(
                  Guid ProcedureRevisionId,
                  Guid? SourceTestChangeRequestId,
                  string Package,
                  string ChangeRequest,
                  string SubjectDisplayNumber,
                  string Action,
                  bool IsLegacy);

              public sealed record TestProcedureRevisionProvenance(
                  Guid ProcedureRevisionId,
                  Guid? SourceTestChangeRequestId,
                  string? Package,
                  bool IsLegacy,
                  string? Note,
                  IReadOnlyList<TestProcedureProvenanceDriver> Drivers);

              /// <summary>
              /// Shared authority for Test Procedure Trace and History provenance.
              ///
              /// The immutable TestProcedureRevision.SourceTestChangeRequestId is the primary producing-package link. Impact
              /// items add exact source-CR/subject/action context, using each item's own ChangeRequestId so folded work keeps
              /// its identity. A materialized revision also carries the exact package-source snapshot that existed on that
              /// producing TCR revision, so later TCR revisioning cannot move its history away. Legacy revisions never acquire
              /// an invented TCR.
              /// </summary>
              public static class TestProcedureProvenanceProjection
              {
                  private sealed record ProcedureSourceSnapshot(
                      Guid ChangeRequestId, string ChangeRequestNumber, bool Originating);

                  public static async Task<IReadOnlyDictionary<Guid, TestProcedureRevisionProvenance>> ForRevisionsAsync(
                      AeroLinkDbContext db,
                      IReadOnlyCollection<Guid> procedureRevisionIds,
                      CancellationToken ct)
                  {
                      var ids = procedureRevisionIds.Where(x => x != Guid.Empty).Distinct().ToList();
                      if (ids.Count == 0) return new Dictionary<Guid, TestProcedureRevisionProvenance>();

                      var revisions = await db.TestProcedureRevisions.AsNoTracking()
                          .Where(x => ids.Contains(x.Id))
                          .Select(x => new { x.Id, x.SourceTestChangeRequestId, x.SourceChangeRequestsJson })
                          .ToListAsync(ct);
                      var sourceSnapshots = revisions.ToDictionary(
                          x => x.Id, x => ParseSources(x.SourceChangeRequestsJson));
                      var impacts = await db.VerificationImpactItems.AsNoTracking()
                          .Where(x => x.ResolvedProcedureRevisionId != null
                              && ids.Contains(x.ResolvedProcedureRevisionId.Value))
                          .Select(x => new
                          {
                              RevisionId = x.ResolvedProcedureRevisionId!.Value,
                              x.TestChangeReviewId,
                              x.ChangeRequestId,
                              x.SubjectDisplayNumber,
                              x.ProcedureChangeAction,
                          }).ToListAsync(ct);

                      // A legacy revision has no primary producing-package link, but an impact decision may still be an
                      // exact related record. Load those packages too so the relationship can be shown as additional
                      // context without pretending it produced the revision.
                      var reviewIds = revisions.Where(x => x.SourceTestChangeRequestId is not null)
                          .Select(x => x.SourceTestChangeRequestId!.Value)
                          .Concat(impacts.Select(x => x.TestChangeReviewId))
                          .Distinct().ToList();
                      var reviews = await db.TestChangeReviews.AsNoTracking()
                          .Where(x => reviewIds.Contains(x.Id))
                          .Select(x => new
                          {
                              x.Id,
                              x.BaseNumber,
                              x.Revision,
                              x.SourceChangeRequestNumber,
                              x.ChangeRequestId,
                          }).ToListAsync(ct);
                      var reviewById = reviews.ToDictionary(x => x.Id);

                      // Compatibility only for revisions created before immutable package-source snapshots existed.
                      // New controlled revisions never consult these movable rows for their provenance.
                      var claims = await db.TestChangeRequestClaims.AsNoTracking()
                          .Where(x => reviewIds.Contains(x.TestChangeReviewId))
                          .Select(x => new
                          {
                              x.TestChangeReviewId,
                              x.ChangeRequestId,
                              x.ChangeRequestNumber,
                          }).ToListAsync(ct);

                      var changeIds = impacts.Select(x => x.ChangeRequestId)
                          .Concat(reviews.Select(x => x.ChangeRequestId))
                          .Concat(claims.Select(x => x.ChangeRequestId))
                          .Concat(sourceSnapshots.Values.SelectMany(x => x).Select(x => x.ChangeRequestId))
                          .Distinct().ToList();
                      var changes = await db.SystemChangeRequests.AsNoTracking()
                          .Where(x => changeIds.Contains(x.Id))
                          .Select(x => new { x.Id, x.BaseNumber, x.Revision })
                          .ToListAsync(ct);
                      var changeNumbers = changes.ToDictionary(x => x.Id,
                          x => $"{x.BaseNumber}.{x.Revision:D2}");

                      var result = new Dictionary<Guid, TestProcedureRevisionProvenance>();
                      foreach (var revision in revisions)
                      {
                          var sourceReviewId = revision.SourceTestChangeRequestId;
                          var sourceReview = sourceReviewId is Guid reviewId && reviewById.TryGetValue(reviewId, out var found)
                              ? found
                              : null;
                          var hasReview = sourceReview is not null;
                          var package = sourceReview is not null
                              ? Display(sourceReview.BaseNumber, sourceReview.Revision, sourceReview.SourceChangeRequestNumber)
                              : sourceReviewId is null ? null : $"Unresolved TCR {sourceReviewId}";
                          var legacy = sourceReviewId is null;
                          var rows = new List<TestProcedureProvenanceDriver>();

                          foreach (var impact in impacts.Where(x => x.RevisionId == revision.Id
                                       && (sourceReviewId is null || x.TestChangeReviewId == sourceReviewId)))
                          {
                              var impactReview = reviewById.GetValueOrDefault(impact.TestChangeReviewId);
                              var impactPackage = sourceReviewId is not null
                                  ? package!
                                  : impactReview is null
                                      ? $"Unresolved TCR {impact.TestChangeReviewId}"
                                      : Display(impactReview.BaseNumber, impactReview.Revision,
                                          impactReview.SourceChangeRequestNumber);
                              rows.Add(new(
                                  revision.Id,
                                  sourceReviewId,
                                  impactPackage,
                                  ChangeNumber(impact.ChangeRequestId, changeNumbers),
                                  impact.SubjectDisplayNumber,
                                  impact.ProcedureChangeAction?.ToString() ?? "ImpactDecision",
                                  legacy));
                          }

                          var usedCompatibilitySources = false;
                          // Manual first-class TCRs can produce a revision without any resolving impact item. Use the
                          // immutable source snapshot captured on this exact procedure revision. Only history created
                          // before that field existed may fall back to the package's still-live claims.
                          if (rows.Count == 0 && sourceReview is not null)
                          {
                              var snapshot = sourceSnapshots[revision.Id];
                              IReadOnlyList<ProcedureSourceSnapshot> sources;
                              if (snapshot.Count > 0)
                              {
                                  sources = snapshot;
                              }
                              else
                              {
                                  usedCompatibilitySources = true;
                                  sources = new[]
                                      {
                                          new ProcedureSourceSnapshot(
                                              sourceReview.ChangeRequestId, sourceReview.SourceChangeRequestNumber, true),
                                      }
                                      .Concat(claims.Where(x => x.TestChangeReviewId == sourceReview.Id)
                                          .Select(x => new ProcedureSourceSnapshot(
                                              x.ChangeRequestId, x.ChangeRequestNumber, false)))
                                      .DistinctBy(x => x.ChangeRequestId)
                                      .ToList();
                              }

                              foreach (var source in sources)
                              {
                                  rows.Add(new(
                                      revision.Id,
                                      sourceReviewId,
                                      package!,
                                      changeNumbers.TryGetValue(source.ChangeRequestId, out var exact)
                                          ? exact
                                          : source.ChangeRequestNumber,
                                      "",
                                      "PackageSource",
                                      false));
                              }
                          }

                          rows = rows.Distinct().OrderBy(x => x.Package).ThenBy(x => x.ChangeRequest)
                              .ThenBy(x => x.SubjectDisplayNumber).ToList();
                          var note = legacy
                              ? "Legacy revision — the producing test change request was not recorded."
                              : !hasReview
                                  ? $"The recorded producing test change request {sourceReviewId} could not be resolved."
                                  : usedCompatibilitySources
                                      ? "This procedure revision predates immutable package-source snapshots; surviving package claims are shown as compatibility context."
                                      : null;
                          result[revision.Id] = new(
                              revision.Id,
                              sourceReviewId,
                              package,
                              legacy,
                              note,
                              rows);
                      }

                      return result;
                  }

                  private static IReadOnlyList<ProcedureSourceSnapshot> ParseSources(string json)
                  {
                      if (string.IsNullOrWhiteSpace(json) || json.Trim() == "[]") return [];
                      try
                      {
                          return (JsonSerializer.Deserialize<List<ProcedureSourceSnapshot>>(json,
                                      new JsonSerializerOptions { PropertyNameCaseInsensitive = true }) ?? [])
                              .Where(x => x.ChangeRequestId != Guid.Empty
                                  && !string.IsNullOrWhiteSpace(x.ChangeRequestNumber))
                              .DistinctBy(x => x.ChangeRequestId)
                              .OrderBy(x => x.ChangeRequestId)
                              .ToList();
                      }
                      catch (JsonException)
                      {
                          return [];
                      }
                  }

                  private static string Display(string baseNumber, int revision, string legacyNumber) =>
                      string.IsNullOrWhiteSpace(baseNumber) ? legacyNumber : $"{baseNumber}.{revision:D2}";

                  private static string ChangeNumber(Guid id, IReadOnlyDictionary<Guid, string> numbers) =>
                      numbers.TryGetValue(id, out var number) ? number : $"Unresolved change request {id}";
              }
          ''').lstrip(), encoding='utf-8')

          # A retirement cannot rename what it withdraws, even if a forged client supplies a title.
          title_projection = 'product/src/AeroLink.Infrastructure/Persistence/TestProcedureRevisionTitleProjection.cs'
          replace_once(title_projection,
          '''                    if (!string.IsNullOrWhiteSpace(change.Title))
                              {
                                  snapshot = new(revision.Id, change.Title.Trim(), true, false, null);
                              }
                              else if (change.Kind == TestProcedureChangeKind.Retire && predecessor is not null)
                              {
                                  snapshot = new(revision.Id, predecessor.Title,
                                      predecessor.IsExact, predecessor.IsLegacy,
                                      predecessor.IsExact
                                          ? "Retirement revision — title preserved from the exact predecessor being retired."
                                          : "Retirement revision — the predecessor's deterministic compatibility label is preserved because no exact historical title exists.");
                              }
                              else
                              {
                                  snapshot = new(revision.Id,
                                      UnavailableTitle(revision.BaseNumber, revision.Revision, legacy: false),
                                      false, false,
                                      "The producing TCR is recorded, but its revision-title snapshot is unavailable; a deterministic revision label is shown.");
                              }''',
          '''                    if (change.Kind == TestProcedureChangeKind.Retire)
                              {
                                  snapshot = predecessor is not null
                                      ? new(revision.Id, predecessor.Title,
                                          predecessor.IsExact, predecessor.IsLegacy,
                                          predecessor.IsExact
                                              ? "Retirement revision — title preserved from the exact predecessor being retired."
                                              : "Retirement revision — the predecessor's deterministic compatibility label is preserved because no exact historical title exists.")
                                      : new(revision.Id,
                                          UnavailableTitle(revision.BaseNumber, revision.Revision, legacy: false),
                                          false, false,
                                          "The producing TCR records a retirement, but no predecessor title can be resolved; supplied retirement text is not treated as an exact title.");
                              }
                              else if (!string.IsNullOrWhiteSpace(change.Title))
                              {
                                  snapshot = new(revision.Id, change.Title.Trim(), true, false, null);
                              }
                              else
                              {
                                  snapshot = new(revision.Id,
                                      UnavailableTitle(revision.BaseNumber, revision.Revision, legacy: false),
                                      false, false,
                                      "The producing TCR is recorded, but its revision-title snapshot is unavailable; a deterministic revision label is shown.");
                              }''')

          # Artifact detail now resolves the exact procedure revision effective in the release carried by the URL.
          endpoints = 'product/src/AeroLink.Api/WorkspaceEndpoints.cs'
          replace_once(endpoints,
              '        app.MapGet("/api/artifacts/{kind}/{id:guid}",async(string kind,Guid id,HttpContext http,AeroLinkDbContext db,CancellationToken ct)=>',
              '        app.MapGet("/api/artifacts/{kind}/{id:guid}",async(string kind,Guid id,Guid? releaseId,HttpContext http,AeroLinkDbContext db,CancellationToken ct)=>')
          file = Path(endpoints)
          text = file.read_text(encoding='utf-8')
          start = text.index('            if(normalized=="test-procedure")')
          end = text.index('            if(normalized=="release-campaign")', start)
          replacement = textwrap.dedent('''
                          if(normalized=="test-procedure")
                          {
                              var item=await db.TestProcedures.AsNoTracking().SingleOrDefaultAsync(x=>x.Id==id,ct);
                              if(item is null)return Results.NotFound();
                              if(!await http.HasProjectAccessAsync(db,item.ProjectId,ct))return Results.Forbid();
                              var revisions=await db.TestProcedureRevisions.AsNoTracking().Where(x=>x.ProcedureId==id)
                                  .OrderByDescending(x=>x.Revision).ToListAsync(ct);
                              TestProcedureRevision? selected;
                              if(releaseId is Guid scopedReleaseId)
                              {
                                  if(!await db.Releases.AsNoTracking().AnyAsync(
                                         x=>x.Id==scopedReleaseId&&x.ProjectId==item.ProjectId,ct))
                                      return Results.NotFound();
                                  var effectivity=await TestProcedureEffectivity.ForReleaseAsync(
                                      db,item.ProjectId,scopedReleaseId,ct);
                                  if(effectivity is null
                                     || !effectivity.RevisionByProcedure.TryGetValue(item.Id,out var selectedRevisionId))
                                      return Results.NotFound();
                                  selected=revisions.SingleOrDefault(x=>x.Id==selectedRevisionId);
                                  if(selected is null)return Results.NotFound();
                              }
                              else selected=revisions.FirstOrDefault();
                              var coverage=selected is null?0:await db.TestCoverage.CountAsync(
                                  x=>x.ProcedureRevisionId==selected.Id,ct);
                              var projectedTitle=selected is null?item.Title:
                                  (await TestProcedureRevisionTitleProjection.ForRevisionsAsync(
                                      db,[selected.Id],ct))[selected.Id].Title;
                              return Results.Ok(new
                              {
                                  kind=normalized,item.Id,
                                  identifier=selected is null?item.BaseNumber:$"{item.BaseNumber}.{selected.Revision:D2}",
                                  title=projectedTitle,state=selected?.State.ToString()??"Draft",
                                  subtitle=$"{item.Level} verification procedure",
                                  updatedAt=selected?.CreatedAt??item.CreatedAt,
                                  details=Details(("owner",item.OwnerId),("revisionCount",revisions.Count),
                                      ("revisionId",selected?.Id),("effectiveReleaseId",releaseId),
                                      ("coveredRequirements",coverage),("objective",selected?.Objective),
                                      ("expectedResult",selected?.ExpectedResult)),
                                  related=Array.Empty<RelatedArtifactDto>()
                              });
                          }
          ''').rstrip() + '\n'
          file.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          artifact_page = 'product/client/src/ArtifactRecordPage.tsx'
          replace_once(artifact_page,
          '''export default function ArtifactRecordPage({api,kind,id,onBack,onOpen}:{api:string;kind:string;id:string;onBack:()=>void;onOpen:(kind:string,id:string)=>void}){
           const [artifact,setArtifact]=useState<Artifact>(),[status,setStatus]=useState<'loading'|'ready'|'missing'|'forbidden'|'error'>('loading'),[copied,setCopied]=useState(false)
           useEffect(()=>{setStatus('loading');fetch(`${api}/api/artifacts/${encodeURIComponent(kind)}/${id}`).then(async response=>{if(response.status===404){setStatus('missing');return}if(response.status===403){setStatus('forbidden');return}if(!response.ok){setStatus('error');return}const item:Artifact=await response.json();item.related=item.related.filter(related=>related.kind!=='problem-report'&&related.kind!=='baseline'&&related.kind!=='build');setArtifact(item);setStatus('ready')}).catch(()=>setStatus('error'))},[api,id,kind])''',
          '''export default function ArtifactRecordPage({api,kind,id,releaseId,onBack,onOpen}:{api:string;kind:string;id:string;releaseId?:string;onBack:()=>void;onOpen:(kind:string,id:string)=>void}){
           const [artifact,setArtifact]=useState<Artifact>(),[status,setStatus]=useState<'loading'|'ready'|'missing'|'forbidden'|'error'>('loading'),[copied,setCopied]=useState(false)
           useEffect(()=>{setStatus('loading');const scope=releaseId?`?releaseId=${encodeURIComponent(releaseId)}`:'';fetch(`${api}/api/artifacts/${encodeURIComponent(kind)}/${id}${scope}`).then(async response=>{if(response.status===404){setStatus('missing');return}if(response.status===403){setStatus('forbidden');return}if(!response.ok){setStatus('error');return}const item:Artifact=await response.json();item.related=item.related.filter(related=>related.kind!=='problem-report'&&related.kind!=='baseline'&&related.kind!=='build');setArtifact(item);setStatus('ready')}).catch(()=>setStatus('error'))},[api,id,kind,releaseId])''')

          app = 'product/client/src/App.tsx'
          replace_once(app,
          '''  if(view==="artifact"&&selectedArtifactId&&selectedArtifactKind)return inShell(<ArtifactRecordPage api={API} kind={selectedArtifactKind} id={selectedArtifactId} onBack={()=>navigate("dashboard")} onOpen={(kind,id)=>{if(kind==="change-request")navigate("scr","system",id);else if(kind==="requirement")navigate("requirements","system",id);else navigate("artifact","system",id,kind)}}/>);''',
          '''  if(view==="artifact"&&selectedArtifactId&&selectedArtifactKind)return inShell(<ArtifactRecordPage api={API} kind={selectedArtifactKind} id={selectedArtifactId} releaseId={release?.id??""} onBack={()=>navigate("dashboard")} onOpen={(kind,id)=>{if(kind==="change-request")navigate("scr","system",id);else if(kind==="requirement")navigate("requirements","system",id);else navigate("artifact","system",id,kind)}}/>);''')

          # Regression: a forged Retire title never becomes controlled history.
          title_tests = 'product/tests/AeroLink.Infrastructure.Tests/TestProcedureRevisionTitleProjectionTests.cs'
          replace_once(title_tests,
          '''        var retire = Review(project.Id, release.Id, change.Id, change.DisplayNumber,
                  "SYSTCR-04210", 2, TestProcedureChangeKind.Retire, "", now.AddMinutes(2));''',
          '''        var retire = Review(project.Id, release.Id, change.Id, change.DisplayNumber,
                  "SYSTCR-04210", 2, TestProcedureChangeKind.Retire,
                  "Forged retirement rename", now.AddMinutes(2));''')

          # Regression: normal materialization records its producing package's primary source snapshot.
          materializer_tests = 'product/tests/AeroLink.Infrastructure.Tests/TestProcedureMaterializationTests.cs'
          replace_once(materializer_tests,
          '''            Assert.Equal(64, reloaded.TestProceduresHash!.Length);
                      Assert.NotNull(reloaded.TestProceduresMaterializedAt);''',
          '''            Assert.Equal(64, reloaded.TestProceduresHash!.Length);
                      Assert.NotNull(reloaded.TestProceduresMaterializedAt);
                      var sourceSnapshot = JsonSerializer.Deserialize<JsonElement>(revision.SourceChangeRequestsJson);
                      var source = Assert.Single(sourceSnapshot.EnumerateArray());
                      Assert.Equal(tcr.ChangeRequestId, source.GetProperty("ChangeRequestId").GetGuid());
                      Assert.Equal(tcr.SourceChangeRequestNumber,
                          source.GetProperty("ChangeRequestNumber").GetString());
                      Assert.True(source.GetProperty("Originating").GetBoolean());''')

          provenance_tests = 'product/tests/AeroLink.Infrastructure.Tests/TestProcedureProvenanceProjectionTests.cs'
          replace_once(provenance_tests,
              'using AeroLink.Domain.ChangeControl;\n',
              'using System.Text.Json;\nusing AeroLink.Domain.ChangeControl;\n')
          marker = '''    [Fact]
              public async Task Legacy_revision_remains_readable_without_an_invented_package()'''
          addition = r'''    [Fact]
              public async Task Materialized_manual_package_sources_survive_claims_moving_to_a_successor_tcr_revision()
              {
                  await using var fixture = await Fixture.CreateAsync();
                  var now = fixture.Now;
                  var primary = ChangeRequest("SRCR-04255", fixture.Project.Id, fixture.Release.Id,
                      "Revisioned manual primary", now);
                  var folded = ChangeRequest("SRCR-04256", fixture.Project.Id, fixture.Release.Id,
                      "Revisioned manual folded", now);
                  var tcr = new TestChangeReview(fixture.Project.Id, fixture.Release.Id, primary.Id,
                      TestChangeReviewDiscipline.System, primary.DisplayNumber, now,
                      baseNumber: "SYSTCR-04255", revision: 0, caseContractVersion: 0);
                  tcr.RecordTestChangeRequired("verification.engineer", now);
                  tcr.IncludeChangeRequest("verification.engineer", folded.Id, folded.DisplayNumber, now);
                  tcr.Submit("verification.engineer", "test.lead", true, now.AddMinutes(1));
                  tcr.Approve("test.lead", "Approved exact manual package.", now.AddMinutes(2));
                  var procedure = new TestProcedure(fixture.Project.Id, "SYSTP-04255",
                      "Revisioned manual package procedure", "verification.engineer", now,
                      TestProcedureLevel.System);
                  var sourceSnapshot = JsonSerializer.Serialize(new[]
                  {
                      new { ChangeRequestId = primary.Id, ChangeRequestNumber = primary.DisplayNumber,
                          Originating = true },
                      new { ChangeRequestId = folded.Id, ChangeRequestNumber = folded.DisplayNumber,
                          Originating = false },
                  });
                  var revision = new TestProcedureRevision(procedure.Id, 0,
                      "Verify exact provenance.", "The build is available.",
                      "1. Exercise the controlled behavior.", "The expected behavior is observed.",
                      TestProcedureState.Approved, "verification.engineer", now,
                      sourceTestChangeRequestId: tcr.Id, sourceChangeRequestsJson: sourceSnapshot);
                  fixture.Db.AddRange(primary, folded, tcr, procedure, revision);
                  await fixture.Db.SaveChangesAsync();

                  var successor = tcr.StartNextRevision("verification.engineer", now.AddMinutes(3), false);
                  tcr.Supersede(successor.Id, "Procedure package revision opened.", now.AddMinutes(3));
                  fixture.Db.Add(successor);
                  await fixture.Db.SaveChangesAsync();
                  Assert.Empty(await fixture.Db.TestChangeRequestClaims.AsNoTracking()
                      .Where(x => x.TestChangeReviewId == tcr.Id).ToListAsync());

                  var result = await TestProcedureProvenanceProjection.ForRevisionsAsync(
                      fixture.Db, [revision.Id], CancellationToken.None);
                  var provenance = result[revision.Id];

                  Assert.Equal("SYSTCR-04255.00", provenance.Package);
                  Assert.Null(provenance.Note);
                  Assert.Equal(new[] { primary.DisplayNumber, folded.DisplayNumber },
                      provenance.Drivers.Select(x => x.ChangeRequest).OrderBy(x => x).ToArray());
                  Assert.All(provenance.Drivers,
                      row => Assert.Equal("PackageSource", row.Action));
              }

