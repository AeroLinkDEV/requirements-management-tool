name: Temporary #563 PR 612 paired measurement v5

on:
  push:
    branches:
      - chatgpt/563-measure-pr612-v5

permissions:
  contents: read

concurrency:
  group: aerolink-563-pr612-measurement-v5
  cancel-in-progress: false

jobs:
  paired-windows-measurement:
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      BASELINE_SHA: 08682c11e1d62f3eb5f38c2a467376216ef7052e
      TREATMENT_SHA: df5dc1b6cc34e11933e73413749a2984018bb7ea
      HARNESS_SHA: 82aa0accc58028e4ef8da980c6ae2c98d147a3c8
      SEEDS: 563001,563002,563003,563004,563005,563006,563007,563008,563009,563010
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - name: Check out measurement orchestrator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Prepare exact clean condition worktrees and patch observer only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config --global core.longpaths true

          $harness = Join-Path $env:RUNNER_TEMP 'aerolink-563-harness-v5'
          $baseline = Join-Path $env:RUNNER_TEMP 'aerolink-563-baseline-v5'
          $treatment = Join-Path $env:RUNNER_TEMP 'aerolink-563-treatment-v5'
          $results = Join-Path $env:RUNNER_TEMP 'aerolink-563-results-v5'
          $wrapper = Join-Path $env:RUNNER_TEMP 'aerolink-563-wrapper-v5'

          foreach ($path in @($harness, $baseline, $treatment, $results, $wrapper)) {
            if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Recurse -Force }
          }

          New-Item -ItemType Directory -Path $wrapper -Force | Out-Null
          git worktree prune
          git worktree add --detach $harness $env:HARNESS_SHA
          git worktree add --detach $baseline $env:BASELINE_SHA
          git worktree add --detach $treatment $env:TREATMENT_SHA

          $expected = @{
            $harness = $env:HARNESS_SHA
            $baseline = $env:BASELINE_SHA
            $treatment = $env:TREATMENT_SHA
          }
          foreach ($entry in $expected.GetEnumerator()) {
            $actual = (git -C $entry.Key rev-parse HEAD).Trim()
            if ($actual -ne $entry.Value) { throw "Worktree SHA mismatch for $($entry.Key): expected $($entry.Value), got $actual." }
            if (git -C $entry.Key status --porcelain) { throw "Worktree is not clean before observer patch: $($entry.Key)" }
          }

          $script = Join-Path $harness 'product/tools/measure-api-host-reuse.ps1'
          $source = [IO.File]::ReadAllText($script)
          $oldCleanup = @'
            try {
                if ($shard.job) {
                    $cleanup = Stop-JobContainedProcess -Launch $shard.job -Terminate:(!$shard.process.HasExited) -TimeoutMilliseconds 5000
'@
          $newCleanup = @'
            $processExitedBeforeCleanup = $false
            try {
                $processExitedBeforeCleanup = $shard.process.HasExited
                if ($processExitedBeforeCleanup) {
                    $shard.process.WaitForExit()
                    $shard.exitCode = [int]$shard.process.ExitCode
                } elseif ($shard.timedOut) {
                    $shard.exitCode = 124
                }
            } catch {
                $shard.exitCode = $null
                $exitCaptureError = "exit-code capture failed before cleanup: $($_.Exception.Message)"
                $shard.waitError = if ($shard.waitError) { "$($shard.waitError); $exitCaptureError" } else { $exitCaptureError }
            }
            try {
                if ($shard.job) {
                    $cleanup = Stop-JobContainedProcess -Launch $shard.job -Terminate:(!$processExitedBeforeCleanup) -TimeoutMilliseconds 5000
'@
          $oldTail = @'
            $shard.endedAt = [DateTimeOffset]::UtcNow
            try { $shard.exitCode = $shard.process.ExitCode } catch { $shard.exitCode = $null }
            $shard.wallMs = ($shard.endedAt - $shard.shardStartedAt).TotalMilliseconds
'@
          $newTail = @'
            $shard.endedAt = [DateTimeOffset]::UtcNow
            $shard.wallMs = ($shard.endedAt - $shard.shardStartedAt).TotalMilliseconds
'@

          if (($source.Split($oldCleanup).Count - 1) -ne 1) { throw 'Expected cleanup anchor exactly once in merged harness.' }
          if (($source.Split($oldTail).Count - 1) -ne 1) { throw 'Expected post-cleanup ExitCode anchor exactly once in merged harness.' }
          $source = $source.Replace($oldCleanup, $newCleanup).Replace($oldTail, $newTail)
          [IO.File]::WriteAllText($script, $source, [Text.UTF8Encoding]::new($false))

          $patched = [IO.File]::ReadAllText($script)
          $capture = $patched.IndexOf('$shard.exitCode = [int]$shard.process.ExitCode', [StringComparison]::Ordinal)
          $cleanup = $patched.IndexOf('Stop-JobContainedProcess -Launch $shard.job -Terminate:(!$processExitedBeforeCleanup)', [StringComparison]::Ordinal)
          if ($capture -lt 0 -or $cleanup -lt 0 -or $capture -ge $cleanup) { throw 'Observer patch did not place exit-code capture before native cleanup.' }
          if ($patched.Contains('try { $shard.exitCode = $shard.process.ExitCode } catch { $shard.exitCode = $null }')) { throw 'Old post-cleanup exit-code capture still exists.' }

          if (git -C $baseline status --porcelain) { throw 'Baseline condition tree became dirty.' }
          if (git -C $treatment status --porcelain) { throw 'Treatment condition tree became dirty.' }
          if ((git -C $baseline rev-parse HEAD).Trim() -ne $env:BASELINE_SHA) { throw 'Baseline SHA moved.' }
          if ((git -C $treatment rev-parse HEAD).Trim() -ne $env:TREATMENT_SHA) { throw 'Treatment SHA moved.' }

          "HARNESS_PATH=$harness" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BASELINE_PATH=$baseline" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TREATMENT_PATH=$treatment" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RESULTS_PATH=$results" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WRAPPER_PATH=$wrapper" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prove patched harness contracts before measurement
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location $env:HARNESS_PATH
          try {
            node --test product/test-contracts/tests/api-host-reuse-measurement.test.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Patched measurement harness contract suite failed.' }
            & ./product/tools/measure-api-host-reuse.ps1 -JobSmoke
            if ($LASTEXITCODE -ne 0) { throw 'Patched measurement harness native Job Object smoke failed.' }
          }
          finally {
            Pop-Location
          }

      - name: Run ten paired authoritative observations
        id: benchmark
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ErrorView = 'DetailedView'
          $transcript = Join-Path $env:WRAPPER_PATH 'measurement-transcript.txt'
          Start-Transcript -LiteralPath $transcript -Force | Out-Null
          try {
            & (Join-Path $env:HARNESS_PATH 'product/tools/measure-api-host-reuse.ps1') `
              -Mode Run `
              -BaselinePath $env:BASELINE_PATH `
              -TreatmentPath $env:TREATMENT_PATH `
              -OutputRoot $env:RESULTS_PATH `
              -Runs 10 `
              -ShardCount 3 `
              -TimeoutMinutes 30 `
              -ProcessTimeoutMinutes 60 `
              -MaxProcessTreeCount 256 `
              -Seeds $env:SEEDS `
              -Warmup
          }
          catch {
            @(
              '=== Exception ===',
              ($_ | Format-List * -Force | Out-String),
              '=== Script stack ===',
              $_.ScriptStackTrace,
              '=== Invocation ===',
              $_.InvocationInfo.PositionMessage
            ) | Out-File -LiteralPath (Join-Path $env:WRAPPER_PATH 'measurement-error.txt') -Encoding utf8
            throw
          }
          finally {
            try { Stop-Transcript | Out-Null } catch {}
          }

      - name: Publish bounded decision summary
        if: always()
        shell: pwsh
        run: |
          $summaryPath = Join-Path $env:RESULTS_PATH 'summary.json'
          @(
            '## #563 PR 612 paired measurement v5',
            '',
            "- Merged harness source: ``$env:HARNESS_SHA`` plus pre-cleanup ExitCode observer patch",
            "- Baseline: ``$env:BASELINE_SHA``",
            "- Treatment: ``$env:TREATMENT_SHA``"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          if (-not (Test-Path -LiteralPath $summaryPath)) {
            '' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            'No final summary was produced; inspect the uploaded transcript and partial evidence.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 0
          }

          $summary = Get-Content -LiteralPath $summaryPath -Raw | ConvertFrom-Json -Depth 100
          $decision = $summary.decision
          @(
            '',
            "- Decision: **$($decision.status)**",
            "- Complete evidence: $($decision.completeEvidence)",
            "- Baseline valid observations: $($summary.baseline.validObservationCount)/$($summary.baseline.requiredRuns)",
            "- Treatment valid observations: $($summary.treatment.validObservationCount)/$($summary.treatment.requiredRuns)",
            "- Baseline median worst-shard wall (ms): $($decision.baselineMedianWorstShardWallMs)",
            "- Treatment median worst-shard wall (ms): $($decision.treatmentMedianWorstShardWallMs)",
            "- Aggregate improvement: $([math]::Round(100 * [double]$decision.aggregateImprovement, 2))%",
            "- Paired-seed median improvement: $([math]::Round(100 * [double]$decision.pairedImprovement.median, 2))%",
            "- Validation errors: $(@($decision.validationErrors).Count)"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload complete or partial measurement evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aerolink-563-pr612-paired-measurement-v5-${{ github.run_id }}
          path: |
            ${{ runner.temp }}\aerolink-563-results-v5
            ${{ runner.temp }}\aerolink-563-wrapper-v5
          if-no-files-found: error
          retention-days: 14
