name: Temporary #568 Fast no-rebuild proof

on:
  push:
    branches:
      - chatgpt/568-fast-no-rebuild-proof

permissions:
  contents: read

jobs:
  fast-proof:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact proof branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v5.2.0
        with:
          dotnet-version: 10.0.x
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Prepare normal warmed developer state outside measured iteration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm --prefix product/client ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed.' }
          Push-Location product/client
          try {
            npx playwright install chromium
            if ($LASTEXITCODE -ne 0) { throw 'Chromium install failed.' }
          }
          finally { Pop-Location }
          dotnet build product/AeroLink.slnx --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Warm solution build failed.' }
      - name: Run representative warmed Fast wrapper without redundant browser build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $transcript = Join-Path $env:RUNNER_TEMP 'aerolink-568-fast-no-rebuild.txt'
          $resultPath = Join-Path $env:RUNNER_TEMP 'aerolink-568-fast-no-rebuild.json'
          $before = if (Test-Path -LiteralPath 'product/.local') {
            Get-ChildItem -LiteralPath 'product/.local' -Force -Recurse -File | Sort-Object FullName | ForEach-Object {
              "$($_.FullName.Substring((Resolve-Path '.').Path.Length))|$($_.Length)|$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash)"
            }
          } else { @('<absent>') }
          $priorSkipBuild = $env:AEROLINK_E2E_SKIP_BUILD
          try {
            $env:AEROLINK_E2E_SKIP_BUILD = 'true'
            $output = & ./product/scripts/Get-AeroLinkTestPlan.ps1 -Paths 'product/src/AeroLink.Domain/Requirements/Requirement.cs' -Mode Fast -Explain 2>&1
            $exit = $LASTEXITCODE
          }
          finally {
            $env:AEROLINK_E2E_SKIP_BUILD = $priorSkipBuild
          }
          $output | Tee-Object -FilePath $transcript | ForEach-Object { Write-Host $_ }
          if ($exit -ne 0) { throw "Fast wrapper exited with code $exit." }
          $line = @($output | ForEach-Object { [string]$_ } | Where-Object { $_ -like 'AEROLINK_TEST_PLAN_RESULT=*' }) | Select-Object -Last 1
          if (-not $line) { throw 'Fast wrapper did not emit AEROLINK_TEST_PLAN_RESULT.' }
          $json = $line.Substring('AEROLINK_TEST_PLAN_RESULT='.Length) | ConvertFrom-Json -Depth 30
          $json | ConvertTo-Json -Depth 30 | Out-File -LiteralPath $resultPath -Encoding utf8
          if ($json.execution.status -ne 'passed') { throw "Fast wrapper status was $($json.execution.status)." }
          if ($json.execution.authoritative -ne $false) { throw 'Fast proof incorrectly claimed merge authority.' }
          if ($json.execution.resources.persistentPostgreSqlTouched -ne $false) { throw 'Fast proof touched persistent PostgreSQL.' }
          if ($json.execution.resources.persistentEvidenceRootTouched -ne $false) { throw 'Fast proof touched persistent evidence.' }
          $after = if (Test-Path -LiteralPath 'product/.local') {
            Get-ChildItem -LiteralPath 'product/.local' -Force -Recurse -File | Sort-Object FullName | ForEach-Object {
              "$($_.FullName.Substring((Resolve-Path '.').Path.Length))|$($_.Length)|$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash)"
            }
          } else { @('<absent>') }
          if (Compare-Object -ReferenceObject @($before) -DifferenceObject @($after)) { throw 'product/.local changed during Fast proof.' }
          @(
            '## #568 warmed Fast no-rebuild proof',
            '',
            "- Wrapper status: **$($json.execution.status)**",
            "- Total wrapper time: **$($json.execution.timing.totalMs) ms**",
            '- Target: <= 240000 ms',
            "- Steps: $((@($json.execution.timing.steps) | ForEach-Object { \"$($_.label)=$($_.elapsedMs)ms\" }) -join '; ')",
            '- Browser smoke reused the already-built API via AEROLINK_E2E_SKIP_BUILD=true',
            '- Persistent PostgreSQL/evidence: untouched',
            '- Result: non-authoritative; GitHub merge evidence unchanged'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ([int64]$json.execution.timing.totalMs -gt 240000) { throw "Fast no-rebuild proof still exceeded 4 minutes: $($json.execution.timing.totalMs) ms." }
      - name: Upload bounded Fast proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aerolink-568-fast-no-rebuild-${{ github.run_id }}
          path: |
            ${{ runner.temp }}\aerolink-568-fast-no-rebuild.txt
            ${{ runner.temp }}\aerolink-568-fast-no-rebuild.json
          if-no-files-found: warn
          retention-days: 14
