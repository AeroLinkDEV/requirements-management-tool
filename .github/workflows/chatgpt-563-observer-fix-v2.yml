name: "Temporary #563 observer patch v3"

on:
  push:
    branches:
      - chatgpt/563-measurement-observer-fix

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Apply observer patch
        shell: pwsh
        run: |
          $encoded = ''
          [IO.File]::WriteAllBytes((Join-Path $env:RUNNER_TEMP 'apply563.py'), [Convert]::FromBase64String($encoded))
          python (Join-Path $env:RUNNER_TEMP 'apply563.py')

      - name: Validate harness
        shell: pwsh
        run: |
          node --test product/test-contracts/tests/api-host-reuse-measurement.test.mjs
          pwsh -NoProfile -File product/tools/measure-api-host-reuse.ps1 -JobSmoke
          git diff --check

      - name: Commit product-only fix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item '.github/workflows/chatgpt-563-observer-fix.yml' -Force
          Remove-Item '.github/workflows/chatgpt-563-observer-fix-v2.yml' -Force
          $allowed = @(
            'product/tools/measure-api-host-reuse.ps1',
            'product/test-contracts/tests/api-host-reuse-measurement.test.mjs',
            'product/docs/API_HOST_REUSE_MEASUREMENT.md'
          )
          $paths = @(git status --short | ForEach-Object { $_.Substring(3) })
          $bad = @($paths | Where-Object { $_ -notin @('.github/workflows/chatgpt-563-observer-fix.yml', '.github/workflows/chatgpt-563-observer-fix-v2.yml') -and $allowed -notcontains $_ })
          if ($bad.Count -gt 0) { throw "Unexpected paths: $($bad -join ', ')" }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $allowed
          git add -u -- '.github/workflows/chatgpt-563-observer-fix.yml' '.github/workflows/chatgpt-563-observer-fix-v2.yml'
          git diff --cached --check
          git commit -m 'Harden #563 measurement observer accounting'
          git push origin HEAD:chatgpt/563-measurement-observer-fix
