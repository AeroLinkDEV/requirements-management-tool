name: Temporary #568 Full closeout proof v3

on:
  push:
    branches:
      - chatgpt/568-full-closeout-proof

permissions:
  contents: read

jobs:
  full-proof:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Check out exact proof branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v5.2.0
        with:
          dotnet-version: 10.0.x
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Prepare client dependencies for selected browser family
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location product/client
          try {
            npm ci
            if ($LASTEXITCODE -ne 0) { throw 'Client dependency install failed.' }
            npx playwright install chromium
            if ($LASTEXITCODE -ne 0) { throw 'Chromium preparation failed.' }
          }
          finally {
            Pop-Location
          }
      - name: Run real Docker-backed Full wrapper noninteractively
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function global:Read-Host { param([string]$Prompt); Write-Host "$Prompt y"; return 'y' }
          $transcript = Join-Path $env:RUNNER_TEMP 'aerolink-568-full-proof.txt'
          $resultPath = Join-Path $env:RUNNER_TEMP 'aerolink-568-full-result.json'
          $before = if (Test-Path -LiteralPath 'product/.local') {
            Get-ChildItem -LiteralPath 'product/.local' -Force -Recurse -File | Sort-Object FullName | ForEach-Object {
              "$($_.FullName.Substring((Resolve-Path '.').Path.Length))|$($_.Length)|$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash)"
            }
          } else { @('<absent>') }
          & ./product/scripts/Get-AeroLinkTestPlan.ps1 -Paths 'product/src/AeroLink.Infrastructure/Persistence/Migrations/20260712115723_AddScaleIndexesAndConcurrency.cs' -Mode Full -Explain *>&1 | Tee-Object -FilePath $transcript | ForEach-Object { Write-Host $_ }
          $exit = $LASTEXITCODE
          $line = Get-Content -LiteralPath $transcript | Where-Object { $_ -like 'AEROLINK_TEST_PLAN_RESULT=*' } | Select-Object -Last 1
          if (-not $line) { throw "Full wrapper emitted no bounded result (native exit=$exit)." }
          $json = $line.Substring('AEROLINK_TEST_PLAN_RESULT='.Length) | ConvertFrom-Json -Depth 30
          $json | ConvertTo-Json -Depth 30 | Out-File -LiteralPath $resultPath -Encoding utf8
          $after = if (Test-Path -LiteralPath 'product/.local') {
            Get-ChildItem -LiteralPath 'product/.local' -Force -Recurse -File | Sort-Object FullName | ForEach-Object {
              "$($_.FullName.Substring((Resolve-Path '.').Path.Length))|$($_.Length)|$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash)"
            }
          } else { @('<absent>') }
          if (Compare-Object -ReferenceObject @($before) -DifferenceObject @($after)) { throw 'product/.local changed during Full proof.' }
          if ($exit -ne 0 -or $json.execution.status -ne 'passed') { throw "Full wrapper was not proven: nativeExit=$exit status=$($json.execution.status) error=$($json.execution.error)" }
          if ($json.execution.authoritative -ne $false) { throw 'Local Full proof incorrectly claimed merge authority.' }
          if ($json.execution.resources.persistentPostgreSqlTouched -ne $false) { throw 'Full proof touched persistent PostgreSQL.' }
          if ($json.execution.resources.persistentEvidenceRootTouched -ne $false) { throw 'Full proof touched persistent evidence.' }
          if ('postgresql-smoke' -notin @($json.execution.executedCiJobs)) { throw 'Full proof did not execute the PostgreSQL CI-equivalent family.' }
          @(
            '## #568 Docker-backed Full closeout proof', '', '- Status: **passed**',
            "- Total wrapper time: $($json.execution.timing.totalMs) ms",
            "- Executed CI-equivalent jobs: $(@($json.execution.executedCiJobs) -join ', ')",
            '- Disposable Docker PostgreSQL executed and cleaned',
            '- Persistent PostgreSQL/evidence unchanged',
            '- Local result remains non-authoritative'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Upload bounded Full proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aerolink-568-full-proof-v3-${{ github.run_id }}
          path: |
            ${{ runner.temp }}\aerolink-568-full-proof.txt
            ${{ runner.temp }}\aerolink-568-full-result.json
          if-no-files-found: warn
          retention-days: 14
