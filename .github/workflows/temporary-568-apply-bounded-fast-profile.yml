name: Temporary apply bounded Fast profile

on:
  push:
    branches:
      - chatgpt/568-bounded-fast-profile

permissions:
  contents: write

jobs:
  apply-and-prove:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out patch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Apply exact source edits
        shell: pwsh
        run: ./product/tools/temporary-apply-568-fast-profile.ps1
      - name: Prove planner contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = @(Get-ChildItem -LiteralPath product/test-planner/tests -Filter '*.test.mjs' -File | Sort-Object Name | ForEach-Object FullName)
          node --test $tests
          if ($LASTEXITCODE -ne 0) { throw 'Planner contract suite failed.' }
          & ./product/scripts/Get-AeroLinkTestPlan.Tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows planner contract suite failed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed after tests.' }
      - name: Commit proven source patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'seanmccarthyns'
          git config user.email 'seanmccarthyns@gmail.com'
          git add product/scripts/Get-AeroLinkTestPlan.ps1 product/scripts/Get-AeroLinkTestPlan.Tests.ps1 product/test-planner/lib/classify.mjs product/test-planner/tests/classify.test.mjs
          git commit -m 'Bound local Fast infrastructure to non-showcase checks [skip ci]'
          git push origin HEAD:chatgpt/568-bounded-fast-profile
