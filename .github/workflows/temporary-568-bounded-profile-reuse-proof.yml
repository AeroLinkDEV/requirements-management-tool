name: Temporary #568 bounded Fast profile plus API reuse proof

on:
  push:
    branches:
      - chatgpt/568-bounded-profile-reuse-proof

permissions:
  contents: read

jobs:
  fast-proof:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Prepare normal warmed developer state outside timing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm --prefix product/client ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed.' }
          Push-Location product/client
          try {
            npx playwright install chromium
            if ($LASTEXITCODE -ne 0) { throw 'Chromium install failed.' }
          } finally { Pop-Location }
          dotnet build product/AeroLink.slnx --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Warm solution build failed.' }
      - name: Measure exact #621 Fast profile with API reuse
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $transcript = Join-Path $env:RUNNER_TEMP 'aerolink-568-bounded-reuse.txt'
          $resultPath = Join-Path $env:RUNNER_TEMP 'aerolink-568-bounded-reuse.json'
          $previous = $env:AEROLINK_E2E_SKIP_BUILD
          try {
            $env:AEROLINK_E2E_SKIP_BUILD = 'true'
            & ./product/scripts/Get-AeroLinkTestPlan.ps1 -Paths 'product/src/AeroLink.Domain/Requirements/Requirement.cs' -Mode Fast -Explain *>&1 | Tee-Object -FilePath $transcript | ForEach-Object { Write-Host $_ }
            $nativeExit = $LASTEXITCODE
          } finally { $env:AEROLINK_E2E_SKIP_BUILD = $previous }
          $line = Get-Content -LiteralPath $transcript | Where-Object { $_ -like 'AEROLINK_TEST_PLAN_RESULT=*' } | Select-Object -Last 1
          if (-not $line) { throw "Fast wrapper emitted no compact result; native=$nativeExit." }
          $json = $line.Substring('AEROLINK_TEST_PLAN_RESULT='.Length) | ConvertFrom-Json -Depth 30
          $json | ConvertTo-Json -Depth 30 | Out-File -LiteralPath $resultPath -Encoding utf8
          if ($nativeExit -ne 0 -or $json.execution.status -ne 'passed') { throw "Bounded+reuse Fast failed; native=$nativeExit status=$($json.execution.status)." }
          if ($json.execution.authoritative -ne $false) { throw 'Fast proof claimed merge authority.' }
          if ($json.execution.resources.persistentPostgreSqlTouched -ne $false -or $json.execution.resources.persistentEvidenceRootTouched -ne $false) { throw 'Persistent resources were touched.' }
          $totalMs = [int64]$json.execution.timing.totalMs
          $steps = (@($json.execution.timing.steps) | ForEach-Object { "$($_.label)=$($_.elapsedMs)ms" }) -join '; '
          @('## #568 bounded Fast + same-run API reuse','',"- Exact #621 head: 510c731c36ca8cbbb3a69b73fa58757f12b7c258","- Total wrapper time: **$totalMs ms**",'- Target: <=240000 ms',"- Steps: $steps",'- Infrastructure local Fast profile retains 349/355 cases; six showcase maintenance cases remain in authoritative Full/CI','- Browser smoke reused the Release API built earlier in this same Fast run','- No concurrent test processes required','- Persistent PostgreSQL/evidence untouched','- Result remained non-authoritative') | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($totalMs -gt 240000) { throw "Bounded+reuse Fast exceeded four minutes: $totalMs ms." }
      - name: Upload bounded proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aerolink-568-bounded-reuse-${{ github.run_id }}
          path: |
            ${{ runner.temp }}\aerolink-568-bounded-reuse.txt
            ${{ runner.temp }}\aerolink-568-bounded-reuse.json
          if-no-files-found: warn
          retention-days: 14
