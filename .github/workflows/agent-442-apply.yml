name: Issue 442 authoritative procedure-title search

on:
  push:
    branches:
      - agent/442-retirement-title-search

permissions:
  contents: write

jobs:
  patch:
    if: ${{ contains(github.event.head_commit.message, '[agent-442-apply]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply shared authoritative-title search
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8-sig')

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one match, found {count}: {old[:100]!r}')
              write(path, text.replace(old, new))

          projection = 'product/src/AeroLink.Infrastructure/Persistence/TestProcedureRevisionTitleProjection.cs'
          marker = '''    private static string UnavailableTitle(string baseNumber, int revision, bool legacy) =>
          '''
          addition = '''    /// <summary>
              /// Finds exact procedure revisions by the same authoritative title projection every reader displays.
              /// Raw TCR proposal text is deliberately not a search authority: retirement text is discarded in
              /// favour of the predecessor title, and legacy compatibility labels remain searchable as displayed.
              /// </summary>
              public static async Task<IReadOnlyList<Guid>> MatchingRevisionIdsAsync(
                  AeroLinkDbContext db,
                  IReadOnlyCollection<Guid> procedureRevisionIds,
                  string query,
                  CancellationToken ct)
              {
                  var requested = procedureRevisionIds.Where(x => x != Guid.Empty).Distinct().ToList();
                  var term = query?.Trim() ?? string.Empty;
                  if (requested.Count == 0 || term.Length == 0) return [];
                  var titles = await ForRevisionsAsync(db, requested, ct);
                  return titles.Where(x => x.Value.Title.Contains(term, StringComparison.OrdinalIgnoreCase))
                      .Select(x => x.Key).OrderBy(x => x).ToList();
              }

          ''' + marker
          replace_once(projection, marker, addition)

          verification = 'product/src/AeroLink.Api/VerificationEndpoints.cs'
          text = read(verification)
          start = text.index('                var titleMatches = await (from change in db.Set<TestProcedureChange>().AsNoTracking()')
          end = text.index('                source = source.Where(x => x.BaseNumber.ToLower().Contains(baseQuery)', start)
          replacement = '''                var titleCandidateRevisionIds = scopedRevisionIds
                      ?? await (from revision in db.TestProcedureRevisions.AsNoTracking()
                                join procedure in source on revision.ProcedureId equals procedure.Id
                                where revision.Revision == db.TestProcedureRevisions
                                    .Where(other => other.ProcedureId == procedure.Id)
                                    .Max(other => other.Revision)
                                select revision.Id).ToListAsync(ct);
                  var titleMatchRevisionIds = await TestProcedureRevisionTitleProjection.MatchingRevisionIdsAsync(
                      db, titleCandidateRevisionIds, q, ct);
                  var titleMatches = await db.TestProcedureRevisions.AsNoTracking()
                      .Where(x => titleMatchRevisionIds.Contains(x.Id))
                      .Select(x => x.ProcedureId).Distinct().ToListAsync(ct);
          '''
          write(verification, text[:start] + replacement + text[end:])

          impact = 'product/src/AeroLink.Api/VerificationImpactEndpoints.cs'
          text = read(impact)
          start = text.index('                var titleRevisionIds = await (from change in db.Set<TestProcedureChange>().AsNoTracking()')
          end = text.index('                query = query.Where(x => x.BaseNumber.ToLower().Contains(q)', start)
          replacement = '''                var titleRevisionIds = await TestProcedureRevisionTitleProjection.MatchingRevisionIdsAsync(
                      db, targetRevisionIds, q, ct);
          '''
          write(impact, text[:start] + replacement + text[end:])

          workspace = 'product/src/AeroLink.Api/WorkspaceEndpoints.cs'
          text = read(workspace)
          start = text.index('            var matchingProcedureTitleRevisionIds=await(from change in db.Set<TestProcedureChange>().AsNoTracking()')
          end = text.index('            var procedureCandidates=', start)
          replacement = '''            var procedureSearchRevisionIds=effectiveProcedureRevisionIds??await(from revision in db.TestProcedureRevisions.AsNoTracking() join procedure in db.TestProcedures.AsNoTracking().Where(x=>x.ProjectId==projectId) on revision.ProcedureId equals procedure.Id where revision.Revision==db.TestProcedureRevisions.Where(other=>other.ProcedureId==procedure.Id).Max(other=>other.Revision) select revision.Id).ToListAsync(ct);
              var matchingProcedureTitleRevisionIds=await TestProcedureRevisionTitleProjection.MatchingRevisionIdsAsync(db,procedureSearchRevisionIds,q,ct);
          '''
          text = text[:start] + replacement + text[end:]
          start = text.index('            var matchingExecutionTitleRevisionIds=await(from change in db.Set<TestProcedureChange>().AsNoTracking()')
          end = text.index('            var executionRows=', start)
          replacement = '''            var executionSearchRevisionIds=await(from revision in db.TestProcedureRevisions.AsNoTracking() join procedure in db.TestProcedures.AsNoTracking().Where(x=>x.ProjectId==projectId) on revision.ProcedureId equals procedure.Id select revision.Id).ToListAsync(ct);
              var matchingExecutionTitleRevisionIds=await TestProcedureRevisionTitleProjection.MatchingRevisionIdsAsync(db,executionSearchRevisionIds,q,ct);
          '''
          write(workspace, text[:start] + replacement + text[end:])

          title_tests = 'product/tests/AeroLink.Infrastructure.Tests/TestProcedureRevisionTitleProjectionTests.cs'
          replace_once(title_tests,
          '''        Assert.Contains("Retirement revision", result[revision02.Id].Note);
              }''',
          '''        Assert.Contains("Retirement revision", result[revision02.Id].Note);

                  var authoritative = await TestProcedureRevisionTitleProjection.MatchingRevisionIdsAsync(db,
                      [revision02.Id], "route sequencing and discontinuities", CancellationToken.None);
                  Assert.Contains(revision02.Id, authoritative);
                  var discarded = await TestProcedureRevisionTitleProjection.MatchingRevisionIdsAsync(db,
                      [revision02.Id], "forged retirement rename", CancellationToken.None);
                  Assert.Empty(discarded);
              }''')

          picker_tests = 'product/tests/AeroLink.Api.Tests/SearchableAuthoringPickerApiTests.cs'
          replace_once(picker_tests,
          '''        Assert.Equal(200, first.GetProperty("items").GetArrayLength());

                  var hydrated = await client.GetFromJsonAsync<JsonElement>(''',
          '''        Assert.Equal(200, first.GetProperty("items").GetArrayLength());

                  var exactDisplayedTitle = await client.GetFromJsonAsync<JsonElement>(
                      $"/api/test-procedures?projectId={fixture.ProjectId}&releaseId={fixture.ReleaseId}" +
                      "&scope=System&state=Approved&search=exact%20historical%20title%20was%20not%20recorded&page=1&pageSize=25");
                  Assert.Equal(520, exactDisplayedTitle.GetProperty("totalCount").GetInt32());
                  var mutableCatalogTitle = await client.GetFromJsonAsync<JsonElement>(
                      $"/api/test-procedures?projectId={fixture.ProjectId}&releaseId={fixture.ReleaseId}" +
                      "&scope=System&state=Approved&search=Picker%20procedure%20500&page=1&pageSize=25");
                  Assert.Equal(0, mutableCatalogTitle.GetProperty("totalCount").GetInt32());

                  var hydrated = await client.GetFromJsonAsync<JsonElement>(''')
          replace_once(picker_tests,
          '''        Assert.Equal(0, target.GetProperty("currentRevision").GetInt32());

                  // Exact hydration also works for the >500 target, by controlled base number and by immutable''',
          '''        Assert.Equal(0, target.GetProperty("currentRevision").GetInt32());

                  var byDisplayedTitle = await client.GetFromJsonAsync<JsonElement>(
                      $"/api/test-change-reviews/{fixture.ReviewId}/procedure-targets" +
                      "?search=exact%20historical%20title%20was%20not%20recorded&page=1&pageSize=25");
                  Assert.Equal(520, byDisplayedTitle.GetProperty("totalCount").GetInt32());
                  var byMutableCatalogTitle = await client.GetFromJsonAsync<JsonElement>(
                      $"/api/test-change-reviews/{fixture.ReviewId}/procedure-targets" +
                      "?search=Picker%20procedure%20520&page=1&pageSize=25");
                  Assert.Equal(0, byMutableCatalogTitle.GetProperty("totalCount").GetInt32());

                  // Exact hydration also works for the >500 target, by controlled base number and by immutable''')

          history_tests = 'product/tests/AeroLink.Api.Tests/TestProcedureRevisionHistoryApiTests.cs'
          replace_once(history_tests,
          '''        Guid ProcedureId, Guid Revision00Id, Guid Revision01Id,
                  string Tcr00, string Tcr01, string Cr00, string Cr01, string FoldedCr01);''',
          '''        Guid ProcedureId, Guid Revision00Id, Guid Revision01Id, Guid Revision02Id,
                  Guid RetirementExecutionId, Guid Review16Id,
                  string Tcr00, string Tcr01, string Cr00, string Cr01, string FoldedCr01);''')
          replace_once(history_tests,
          '''        Assert.Equal(fixture.Revision01Id,
                      newArtifact.GetProperty("details").GetProperty("revisionId").GetGuid());
              }''',
          '''        Assert.Equal(fixture.Revision01Id,
                      newArtifact.GetProperty("details").GetProperty("revisionId").GetGuid());

                  var retiredList = await JsonAsync(client,
                      $"/api/test-procedures?projectId={fixture.ProjectId}&scope=System" +
                      "&search=route%20sequencing%20and%20discontinuities&page=1&pageSize=25");
                  var retiredRow = Assert.Single(retiredList.GetProperty("items").EnumerateArray());
                  Assert.Equal(fixture.Revision02Id, retiredRow.GetProperty("revisionId").GetGuid());
                  Assert.Equal("Verify route sequencing and discontinuities",
                      retiredRow.GetProperty("title").GetString());
                  var discardedList = await JsonAsync(client,
                      $"/api/test-procedures?projectId={fixture.ProjectId}&scope=System" +
                      "&search=forged%20retirement%20rename&page=1&pageSize=25");
                  Assert.Equal(0, discardedList.GetProperty("totalCount").GetInt32());

                  var retiredSearch = await JsonAsync(client,
                      $"/api/search?projectId={fixture.ProjectId}&query=route%20sequencing%20and%20discontinuities");
                  Assert.Contains(retiredSearch.GetProperty("items").EnumerateArray(),
                      x => x.GetProperty("kind").GetString() == "test-procedure"
                           && x.GetProperty("id").GetGuid() == fixture.ProcedureId
                           && x.GetProperty("identifier").GetString() == "SYSTP-42150.02");
                  Assert.Contains(retiredSearch.GetProperty("items").EnumerateArray(),
                      x => x.GetProperty("kind").GetString() == "test-execution"
                           && x.GetProperty("id").GetGuid() == fixture.RetirementExecutionId
                           && x.GetProperty("title").GetString() ==
                              "Verify route sequencing and discontinuities result");
                  var discardedSearch = await JsonAsync(client,
                      $"/api/search?projectId={fixture.ProjectId}&query=forged%20retirement%20rename");
                  Assert.DoesNotContain(discardedSearch.GetProperty("items").EnumerateArray(),
                      x => x.GetProperty("kind").GetString() is "test-procedure" or "test-execution");

                  var targetByAuthoritativeTitle = await JsonAsync(client,
                      $"/api/test-change-reviews/{fixture.Review16Id}/procedure-targets" +
                      "?search=route%20sequencing%20and%20discontinuities&page=1&pageSize=25");
                  Assert.Equal(1, targetByAuthoritativeTitle.GetProperty("totalCount").GetInt32());
                  Assert.Equal("Verify route sequencing and discontinuities",
                      targetByAuthoritativeTitle.GetProperty("items")[0].GetProperty("title").GetString());
              }''')
          replace_once(history_tests,
          '''        var revision01 = Revision(procedure.Id, 1, tcr16.Id, baseline16.Id,
                  "Discontinuity objective", now.AddMinutes(1));
              procedure.UpdateDraft("Catalog title changed after 1.6", procedure.OwnerId, now.AddMinutes(2));''',
          '''        var revision01 = Revision(procedure.Id, 1, tcr16.Id, baseline16.Id,
                  "Discontinuity objective", now.AddMinutes(1));
              var tcrRetire = Review(project.Id, release16.Id, scr16.Id, scr16.DisplayNumber,
                  "SYSTCR-42150", 2, TestProcedureChangeKind.Retire,
                  "Forged retirement rename", requirement16Revision.Id, now.AddMinutes(3), procedureRevision: 2);
              var revision02 = new TestProcedureRevision(procedure.Id, 2, "", "", "", "",
                  TestProcedureState.Retired, "verification.engineer", now.AddMinutes(3),
                  sourceTestChangeRequestId: tcrRetire.Id);
              var retirementExecution = new TestExecution(project.Id, revision02.Id, null, null,
                  TestOutcome.Pass, "history.engineer", "Historical retirement fixture",
                  "The pre-retirement execution passed.", "evidence://retirement-title-search",
                  now.AddMinutes(4), now.AddMinutes(4), release16.Id);
              procedure.UpdateDraft("Catalog title changed after 1.6", procedure.OwnerId, now.AddMinutes(2));''')
          replace_once(history_tests,
          '''            foldedRequirement16Revision, tcr15, tcr16, procedure, revision00, revision01, impact15, impact16,
                  foldedImpact16, coverage15, coverage16, foldedCoverage16,''',
          '''            foldedRequirement16Revision, tcr15, tcr16, tcrRetire, procedure, revision00, revision01,
                  revision02, retirementExecution, impact15, impact16,
                  foldedImpact16, coverage15, coverage16, foldedCoverage16,''')
          replace_once(history_tests,
          '''            procedure.Id, revision00.Id, revision01.Id,
                  tcr15.DisplayNumber, tcr16.DisplayNumber, scr15.DisplayNumber, scr16.DisplayNumber,''',
          '''            procedure.Id, revision00.Id, revision01.Id, revision02.Id,
                  retirementExecution.Id, tcr16.Id,
                  tcr15.DisplayNumber, tcr16.DisplayNumber, scr15.DisplayNumber, scr16.DisplayNumber,''')
          PY

      - name: Install .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Validate complete solution and focused search regressions
        shell: bash
        run: |
          dotnet restore product/AeroLink.slnx
          dotnet build product/AeroLink.slnx --configuration Release --no-restore --verbosity minimal
          dotnet test product/tests/AeroLink.Infrastructure.Tests/AeroLink.Infrastructure.Tests.csproj \
            --configuration Release --no-build \
            --filter "FullyQualifiedName~TestProcedureRevisionTitleProjectionTests" \
            --logger "console;verbosity=normal"
          dotnet test product/tests/AeroLink.Api.Tests/AeroLink.Api.Tests.csproj \
            --configuration Release --no-build \
            --filter "FullyQualifiedName~TestProcedureRevisionHistoryApiTests|FullyQualifiedName~SearchableAuthoringPickerApiTests" \
            --logger "console;verbosity=normal"

      - name: Publish product correction
        shell: bash
        run: |
          git diff --check
          git config user.name "seanmccarthyns"
          git config user.email "seanmccarthyns@gmail.com"
          git add product
          git commit -m "Use authoritative procedure revision titles for search (#442)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
