name: TEMP 568 restore Docker preflight onto Fast fix

on:
  push:
    branches:
      - chatgpt/tmp-568-repair-orchestrator

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-latest
    steps:
      - name: Check out repair target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chatgpt/568-fast-docker-preflight-repair
          fetch-depth: 0

      - name: Restore #620 preflight without disturbing #626 Fast changes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Edit-NormalizedFile([string]$Path, [string]$Old, [string]$New) {
            $text = [IO.File]::ReadAllText($Path)
            $usesCrLf = $text.Contains("`r`n")
            $normalized = $text.Replace("`r`n", "`n")
            $count = [regex]::Matches($normalized, [regex]::Escape($Old)).Count
            if ($count -ne 1) { throw "Expected exactly one repair anchor in $Path; found $count." }
            $normalized = $normalized.Replace($Old, $New)
            if ($usesCrLf) { $normalized = $normalized.Replace("`n", "`r`n") }
            [IO.File]::WriteAllText($Path, $normalized, [Text.UTF8Encoding]::new($false))
          }

          $scriptPath = 'product/scripts/Get-AeroLinkTestPlan.ps1'
          $oldScript = @'
              try { & $dockerCommand.Source version --format '{{.Server.Version}}' *> $null; if ($LASTEXITCODE -ne 0) { throw 'daemon unavailable' } }
              catch { throw 'Docker is unavailable; the daemon could not be queried, so the PostgreSQL gate is not-proven.' }
              return $dockerCommand.Source
          '@.Replace("`r`n", "`n").TrimEnd()
          $newScript = @'
              try { & $dockerCommand.Source version --format '{{.Server.Version}}' *> $null; if ($LASTEXITCODE -ne 0) { throw 'daemon unavailable' } }
              catch { throw 'Docker is unavailable; the daemon could not be queried, so the PostgreSQL gate is not-proven.' }
              try {
                  $serverOsType = ((& $dockerCommand.Source info --format '{{.OSType}}' 2>$null) -join '').Trim()
                  if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($serverOsType)) { throw 'server OS type unavailable' }
              }
              catch { throw 'Docker is unavailable; the daemon OS type could not be verified, so the PostgreSQL gate is not-proven.' }
              if ($serverOsType -cne 'linux') {
                  throw "Docker server OSType '$serverOsType' cannot run the required Linux postgres:17 image; the PostgreSQL gate is not-proven. Switch Docker Desktop to Linux containers before Full mode."
              }
              return $dockerCommand.Source
          '@.Replace("`r`n", "`n").TrimEnd()
          Edit-NormalizedFile $scriptPath $oldScript $newScript

          $testsPath = 'product/scripts/Get-AeroLinkTestPlan.Tests.ps1'
          $oldTests = @'
          $plannerSource = Get-Content -Raw -LiteralPath $scriptPath
          $normalFastJsonRun = Invoke-Plan @('-Paths', 'product\src\AeroLink.Domain\Requirements\Requirement.cs', '-Json', '-DryRun')
          '@.Replace("`r`n", "`n").TrimEnd()
          $newTests = @'
          $plannerSource = Get-Content -Raw -LiteralPath $scriptPath
          Assert-True ($plannerSource.Contains("info --format '{{.OSType}}'")) 'Full PostgreSQL preflight must inspect the Docker server OS type before expensive gates.'
          Assert-True ($plannerSource.Contains("serverOsType -cne 'linux'")) 'Full PostgreSQL preflight must refuse a non-Linux Docker daemon.'
          Assert-True ($plannerSource.Contains('Switch Docker Desktop to Linux containers before Full mode')) 'Docker incompatibility must give the developer an actionable recovery message.'
          $normalFastJsonRun = Invoke-Plan @('-Paths', 'product\src\AeroLink.Domain\Requirements\Requirement.cs', '-Json', '-DryRun')
          '@.Replace("`r`n", "`n").TrimEnd()
          Edit-NormalizedFile $testsPath $oldTests $newTests

          $changed = @(git diff --name-only)
          $expected = @('product/scripts/Get-AeroLinkTestPlan.Tests.ps1', 'product/scripts/Get-AeroLinkTestPlan.ps1')
          if (@(Compare-Object $expected $changed).Count -ne 0) { throw "Unexpected repair diff: $($changed -join ', ')" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }

      - name: Validate combined Fast and Docker contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File product/scripts/Get-AeroLinkTestPlan.Tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows planner contract failed.' }
          & node --test product/test-planner/tests/classify.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Classifier contract failed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }

      - name: Commit repair only after validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'seanmccarthyns'
          git config user.email 'seanmccarthyns@users.noreply.github.com'
          git add -- product/scripts/Get-AeroLinkTestPlan.ps1 product/scripts/Get-AeroLinkTestPlan.Tests.ps1
          $staged = @(git diff --cached --name-only)
          $expected = @('product/scripts/Get-AeroLinkTestPlan.Tests.ps1', 'product/scripts/Get-AeroLinkTestPlan.ps1')
          if (@(Compare-Object $expected $staged).Count -ne 0) { throw "Unexpected staged files: $($staged -join ', ')" }
          git commit -m 'Restore Docker Full preflight alongside Fast optimization'
          git push origin HEAD:chatgpt/568-fast-docker-preflight-repair
