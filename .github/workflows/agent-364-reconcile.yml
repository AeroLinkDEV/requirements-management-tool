name: Agent 364 reconcile overlap

on:
  push:
    branches:
      - agent/364-legacy-procedure-manifest-bootstrap

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ contains(github.event.head_commit.message, '[agent-364-reconcile]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Apply only the overlapping #364 changes through a three-way merge
        shell: bash
        run: |
          set -euo pipefail
          git diff f78c21e6f36204a76a9a492a7a52312d32cdb53d 6dfacf46c7cab02737eefe8a96351c482f25ae7c -- \
            product/client/src/App.tsx \
            product/src/AeroLink.Infrastructure/Persistence/TestProcedureBaselineMaterializer.cs > /tmp/issue364-overlap.patch
          git apply --3way /tmp/issue364-overlap.patch
          git diff --check
          git config user.name "seanmccarthyns"
          git config user.email "seanmccarthyns@gmail.com"
          git add product/client/src/App.tsx product/src/AeroLink.Infrastructure/Persistence/TestProcedureBaselineMaterializer.cs
          git commit -m "Reconcile legacy bootstrap with immutable procedure source snapshots"
          git push origin "HEAD:${GITHUB_REF_NAME}"
