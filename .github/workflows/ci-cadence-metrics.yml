name: CI cadence metrics

# Hourly, not after every Product and Fast run (#1318). Each collection pages through the repository's whole run
# and pull-request history, about 52 API calls, and it fired after every completed run: about 24 times an hour on a
# busy day, most of them cancelled after spending their calls. With the requesters, the rolling collector and PR
# overlap, that exhausted the repository's 5,000-an-hour workflow-token budget on 30 September, and the merge
# binder then refused green candidates. Cadence is measured over days, so an hourly observation loses nothing.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ci-cadence-metrics
  cancel-in-progress: true

jobs:
  cadence-metrics:
    name: Record merge-cadence metrics (non-authoritative)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Collect before/after cadence measurements
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CADENCE_OUTPUT_DIR: ${{ runner.temp }}/aerolink-cadence-metrics
        run: node product/ci-metrics/bin/cadence-collect.mjs

      - name: Upload cadence measurements
        uses: actions/upload-artifact@v7
        with:
          name: ci-cadence-metrics-${{ github.run_id }}
          path: ${{ runner.temp }}/aerolink-cadence-metrics
          retention-days: 30
          if-no-files-found: error
