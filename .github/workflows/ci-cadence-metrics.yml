name: CI cadence metrics

on:
  workflow_run:
    workflows:
      - Product quality gate
      - Fast PR feedback (advisory)
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ci-cadence-metrics
  cancel-in-progress: true

jobs:
  cadence-metrics:
    name: Record merge-cadence metrics (non-authoritative)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect before/after cadence measurements
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CADENCE_OUTPUT_DIR: ${{ runner.temp }}/aerolink-cadence-metrics
        run: node product/ci-metrics/bin/cadence-collect.mjs

      - name: Upload cadence measurements
        uses: actions/upload-artifact@v4
        with:
          name: ci-cadence-metrics-${{ github.run_id }}
          path: ${{ runner.temp }}/aerolink-cadence-metrics
          retention-days: 30
          if-no-files-found: error
