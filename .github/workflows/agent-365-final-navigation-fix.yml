name: Agent 365 final successor navigation correction

on:
  push:
    branches:
      - agent/365-tcr-supersession-browser

permissions:
  contents: write

jobs:
  patch:
    if: ${{ contains(github.event.head_commit.message, '[agent-365-final-navigation]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Preserve exact successor routes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one match, found {count}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          presentation = 'product/client/src/testChangeReviewPresentation.ts'
          marker = '''/**
           * Every exact predecessor that ultimately points to the supplied current review.'''
          helper = '''export type SuccessorReference = { id: string; displayNumber?: string }

          /**
           * The exact superseding review remains navigable even when it belongs to another release and is not
           * present in the release-scoped list. The optional display number is presentation metadata; the ID is
           * the authoritative route.
           */
          export function successorReferenceFor<T extends SupersessionRecord>(
            review: T,
            reviews: readonly T[],
          ): SuccessorReference | undefined {
            const id = review.supersededByTestChangeRequestId
            if (!id) return undefined
            return { id, displayNumber: reviews.find(candidate => candidate.id === id)?.displayNumber }
          }

          /**
           * Every exact predecessor that ultimately points to the supplied current review.'''
          replace_once(presentation, marker, helper)

          workspace = 'product/client/src/TestingCoverageWorkspace.tsx'
          replace_once(
              workspace,
              "import { isControlledTestChangeRequest, reviewsVisibleInCurrentRelease, supersededHistoryFor } from './testChangeReviewPresentation'",
              "import { isControlledTestChangeRequest, reviewsVisibleInCurrentRelease, successorReferenceFor, supersededHistoryFor } from './testChangeReviewPresentation'")
          replace_once(
              workspace,
              '''  const authoringRequest = mine.find(x => x.id === authoring)
                const authoringSuccessor = authoringRequest?.supersededByTestChangeRequestId
                  ? mine.find(x => x.id === authoringRequest.supersededByTestChangeRequestId)
                  : undefined''',
              '''  const authoringRequest = mine.find(x => x.id === authoring)
                const authoringSuccessor = authoringRequest
                  ? successorReferenceFor(authoringRequest, mine)
                  : undefined''')
          replace_once(
              workspace,
              '''                : <p className="drawerEmpty">Nobody has answered this yet.</p>}
                    {request.outcome === 'ChangeRequired' && isControlledTestChangeRequest(request, tcrAcronym(discipline)) && (''',
              '''                : <p className="drawerEmpty">Nobody has answered this yet.</p>}
                    {request.state === 'Superseded' && request.supersededByTestChangeRequestId && (
                      <div className="conclusionBox historicalAssessment">
                        <strong>Superseded assessment</strong>
                        <p>{request.supersededReason ?? 'This assessment was folded into a surviving review.'}</p>
                        <button type="button" className="drawerArtifactLink"
                          onClick={() => setAuthoring(request.supersededByTestChangeRequestId!)}>
                          Open exact successor
                        </button>
                      </div>
                    )}
                    {request.outcome === 'ChangeRequired' && isControlledTestChangeRequest(request, tcrAcronym(discipline)) && (''')

          tcr_workspace = 'product/client/src/TestChangeRequestWorkspace.tsx'
          replace_once(
              tcr_workspace,
              'type SupersededBy={id:string;displayNumber:string;reason?:string}',
              'type SupersededBy={id:string;displayNumber?:string;reason?:string}')
          replace_once(
              tcr_workspace,
              '''          ?<button type="button" className="linkedScr" onClick={()=>onOpenTestChangeRequest(supersededBy.id)}>Open {supersededBy.displayNumber}</button>''',
              '''          ?<button type="button" className="linkedScr" onClick={()=>onOpenTestChangeRequest(supersededBy.id)}>{supersededBy.displayNumber ? `Open ${supersededBy.displayNumber}` : 'Open exact successor'}</button>''')

          tests = 'product/client/tests/test-change-request-supersession-presentation.spec.ts'
          replace_once(
              tests,
              '''  reviewsVisibleInCurrentRelease,
                supersededHistoryFor,''',
              '''  reviewsVisibleInCurrentRelease,
                successorReferenceFor,
                supersededHistoryFor,''')
          replace_once(
              tests,
              '''  expect(reviewsVisibleInCurrentRelease(currentRelease)).toEqual([predecessor])
              })''',
              '''  expect(reviewsVisibleInCurrentRelease(currentRelease)).toEqual([predecessor])
                expect(successorReferenceFor(predecessor, currentRelease)).toEqual({
                  id: 'successor-in-another-release',
                })
              })''')
          replace_once(
              tests,
              '''  expect(reviewsVisibleInCurrentRelease(currentRelease)).toEqual([successor])
                expect(supersededHistoryFor(successor, currentRelease)).toEqual([predecessor])''',
              '''  expect(reviewsVisibleInCurrentRelease(currentRelease)).toEqual([successor])
                expect(successorReferenceFor(predecessor, currentRelease)).toEqual({
                  id: successor.id,
                  displayNumber: successor.displayNumber,
                })
                expect(supersededHistoryFor(successor, currentRelease)).toEqual([predecessor])''')
          PY

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: product/client/package-lock.json

      - name: Validate client and focused supersession regressions
        working-directory: product/client
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build
          npx playwright test tests/test-change-request-supersession-presentation.spec.ts tests/test-change-request-supersession.spec.ts --workers=1

      - name: Publish review corrections
        shell: bash
        run: |
          git diff --check
          git config user.name "seanmccarthyns"
          git config user.email "seanmccarthyns@gmail.com"
          git add product/client/src/TestChangeRequestWorkspace.tsx \
            product/client/src/TestingCoverageWorkspace.tsx \
            product/client/src/testChangeReviewPresentation.ts \
            product/client/tests/test-change-request-supersession-presentation.spec.ts
          git commit -m "Preserve exact successor navigation for all superseded reviews"
          git push origin "HEAD:${GITHUB_REF_NAME}"
