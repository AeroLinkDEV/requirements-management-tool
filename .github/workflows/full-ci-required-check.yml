name: Full CI required-check bridge

on:
  pull_request:
    types: [labeled]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: full-ci-required-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  verify-full:
    # Only the same-repository ready label is allowed to emit the protected check name. Unrelated labels and
    # forks deliberately receive a different skipped check name, so they cannot satisfy branch protection.
    name: ${{ github.event.label.name == 'ready-for-full-ci' && github.event.pull_request.head.repo.full_name == github.repository && 'Report what this run validated' || 'Readiness bridge not applicable' }}
    if: github.event.label.name == 'ready-for-full-ci' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Verify exact-head authoritative Product evidence
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          api = os.environ['GITHUB_API_URL']
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          head_sha = os.environ['HEAD_SHA']
          base_sha = os.environ['BASE_SHA']
          pr_number = os.environ['PR_NUMBER']

          def get(path):
              request = urllib.request.Request(
                  f'{api}/repos/{repo}{path}',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode('utf-8', errors='replace')
                  raise SystemExit(f'GitHub API request failed ({exc.code}) for {path}: {body}') from exc

          run = None
          for _ in range(120):
              payload = get(
                  f'/actions/workflows/ci.yml/runs?head_sha={head_sha}&event=workflow_dispatch&per_page=100'
              )
              runs = payload.get('workflow_runs', [])
              if len(runs) > 1:
                  raise SystemExit(
                      f'expected exactly one Product workflow_dispatch for exact SHA {head_sha}, found {len(runs)}'
                  )
              if len(runs) == 1:
                  run = runs[0]
                  break
              time.sleep(15)

          if run is None:
              raise SystemExit(
                  f'expected exactly one Product workflow_dispatch for exact SHA {head_sha}, but none appeared'
              )

          if run.get('head_sha') != head_sha or run.get('event') != 'workflow_dispatch':
              raise SystemExit('Product run provenance does not match the exact readiness head/event')

          run_id = run['id']
          print(f'Authoritative Product run: {run_id} on {head_sha}')

          for _ in range(120):
              run = get(f'/actions/runs/{run_id}')
              if run.get('status') == 'completed':
                  break
              time.sleep(15)
          else:
              raise SystemExit(f'Product run {run_id} did not complete within the bridge timeout')

          if run.get('conclusion') != 'success':
              raise SystemExit(
                  f'Product run {run_id} did not pass: conclusion={run.get("conclusion")}'
              )

          jobs = get(f'/actions/runs/{run_id}/jobs?filter=latest&per_page=100').get('jobs', [])
          aggregates = [job for job in jobs if job.get('name') == 'Report what this run validated']
          if len(aggregates) != 1:
              raise SystemExit(
                  f'expected exactly one Product aggregate job in run {run_id}, found {len(aggregates)}'
              )
          aggregate = aggregates[0]
          if aggregate.get('status') != 'completed' or aggregate.get('conclusion') != 'success':
              raise SystemExit(
                  'Product aggregate did not pass: '
                  f'status={aggregate.get("status")} conclusion={aggregate.get("conclusion")}'
              )

          pr = get(f'/pulls/{pr_number}')
          if pr.get('state') != 'open':
              raise SystemExit('Pull request closed while Full validation was running')
          if pr.get('head', {}).get('repo', {}).get('full_name') != repo:
              raise SystemExit('Pull request is no longer a same-repository readiness candidate')
          if pr.get('head', {}).get('sha') != head_sha:
              raise SystemExit('Pull request head changed while Full validation was running')
          if pr.get('base', {}).get('sha') != base_sha:
              raise SystemExit('Pull request base changed while Full validation was running')
          labels = {label.get('name') for label in pr.get('labels', [])}
          if 'ready-for-full-ci' not in labels:
              raise SystemExit('ready-for-full-ci is no longer present on the exact validated head')

          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as handle:
                  handle.write('## Exact-head Full CI authority verified\n\n')
                  handle.write(f'- Pull request: #{pr_number}\n')
                  handle.write(f'- Head SHA: `{head_sha}`\n')
                  handle.write(f'- Product run: `{run_id}`\n')
                  handle.write('- Product aggregate: **success**\n')
                  handle.write('- This bridge executed no product or pull-request code.\n')
          PY
