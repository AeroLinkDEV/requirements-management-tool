name: Bind protected Full result to pull request

on:
  pull_request:
    types: [labeled]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: full-ci-protection-bridge-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  bind-exact-full-result:
    # GitHub branch protection does not consume the workflow_dispatch Product job as the PR-required
    # context in this repository. This is deliberately not a placeholder: the required name exists only
    # on the readiness-label event, stays in progress while the real Product run is running, and can
    # succeed only after the exact-head Product aggregate itself has completed successfully.
    name: ${{ github.event.label.name == 'ready-for-full-ci' && github.event.pull_request.head.repo.full_name == github.repository && 'Report what this run validated' || 'Ignore non-readiness PR label for Full CI' }}
    if: github.event.label.name == 'ready-for-full-ci' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Wait for exact Product Full and bind only its successful aggregate
        shell: bash
        run: |
          set -euo pipefail
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          headers=(
            --header "Authorization: Bearer $GITHUB_TOKEN"
            --header "Accept: application/vnd.github+json"
            --header "X-GitHub-Api-Version: 2022-11-28"
          )

          run_id=""
          authoritative="false"
          for attempt in $(seq 1 160); do
            curl --fail-with-body --silent --show-error "${headers[@]}" \
              "$api/actions/workflows/ci.yml/runs?head_sha=$HEAD_SHA&event=workflow_dispatch&per_page=100" \
              --output "$RUNNER_TEMP/product-runs.json"

            python - "$RUNNER_TEMP/product-runs.json" "$HEAD_SHA" "$PR_NUMBER" "$HEAD_REF" > "$RUNNER_TEMP/product-match.txt" <<'PY'
          import json
          import sys

          path, head_sha, pr_number, head_ref = sys.argv[1:]
          pr_number = int(pr_number)
          with open(path, encoding="utf-8") as handle:
              runs = json.load(handle).get("workflow_runs", [])

          matches = []
          for run in runs:
              prs = {item.get("number") for item in run.get("pull_requests", [])}
              if (
                  run.get("head_sha") == head_sha
                  and run.get("head_branch") == head_ref
                  and run.get("event") == "workflow_dispatch"
                  and run.get("actor", {}).get("login") == "github-actions[bot]"
                  and run.get("triggering_actor", {}).get("login") == "github-actions[bot]"
                  and pr_number in prs
              ):
                  matches.append(run)

          if len(matches) > 1:
              print("ERROR multiple trusted Product workflow_dispatch runs exist for this exact PR SHA")
              raise SystemExit(2)
          if not matches:
              print("WAIT")
              raise SystemExit(0)

          run = matches[0]
          print(f"FOUND {run['id']} {run.get('status')} {run.get('conclusion')}")
          PY
            match="$(cat "$RUNNER_TEMP/product-match.txt")"
            case "$match" in
              ERROR*)
                echo "::error::$match"
                exit 1
                ;;
              WAIT)
                sleep 10
                continue
                ;;
              FOUND*)
                read -r _ run_id status conclusion <<< "$match"
                if [ "$status" != "completed" ]; then
                  sleep 10
                  continue
                fi
                if [ "$conclusion" != "success" ]; then
                  echo "::error::Exact-head Product run $run_id completed with conclusion=$conclusion."
                  exit 1
                fi
                authoritative="true"
                break
                ;;
              *)
                echo "::error::Unexpected Product-run matcher output: $match"
                exit 1
                ;;
            esac
          done

          if [ "$authoritative" != "true" ] || [ -z "$run_id" ]; then
            echo "::error::No successful trusted Product workflow_dispatch completed for exact head $HEAD_SHA before timeout."
            exit 1
          fi

          curl --fail-with-body --silent --show-error "${headers[@]}" \
            "$api/actions/runs/$run_id/jobs?filter=latest&per_page=100" \
            --output "$RUNNER_TEMP/product-jobs.json"
          python - "$RUNNER_TEMP/product-jobs.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              jobs = json.load(handle).get("jobs", [])
          gates = [job for job in jobs if job.get("name") == "Report what this run validated"]
          if len(gates) != 1:
              raise SystemExit(f"expected exactly one Product aggregate job, found {len(gates)}")
          gate = gates[0]
          if gate.get("status") != "completed" or gate.get("conclusion") != "success":
              raise SystemExit(
                  f"Product aggregate is not authoritative success: status={gate.get('status')} "
                  f"conclusion={gate.get('conclusion')}"
              )
          print(f"Product aggregate job {gate.get('id')} completed successfully.")
          PY

          # Re-read the live pull request after the expensive evidence finishes. A moved head, moved base,
          # removed readiness label, closed PR, or fork transition invalidates the evidence instead of
          # allowing a stale result to satisfy branch protection.
          curl --fail-with-body --silent --show-error "${headers[@]}" \
            "$api/pulls/$PR_NUMBER" --output "$RUNNER_TEMP/live-pr.json"
          python - "$RUNNER_TEMP/live-pr.json" "$HEAD_SHA" "$BASE_SHA" "$GITHUB_REPOSITORY" <<'PY'
          import json
          import sys

          path, head_sha, base_sha, repository = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              pr = json.load(handle)
          labels = {label.get("name") for label in pr.get("labels", [])}
          failures = []
          if pr.get("state") != "open": failures.append("pull request is no longer open")
          if pr.get("head", {}).get("sha") != head_sha: failures.append("head SHA moved")
          if pr.get("base", {}).get("sha") != base_sha: failures.append("base SHA moved")
          if pr.get("head", {}).get("repo", {}).get("full_name") != repository: failures.append("head repository changed")
          if "ready-for-full-ci" not in labels: failures.append("readiness label is no longer present")
          if failures:
              raise SystemExit("Exact Full evidence became stale: " + "; ".join(failures))
          print(f"Bound exact Product Full evidence for {head_sha} against base {base_sha}.")
          PY
