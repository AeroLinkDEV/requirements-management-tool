name: Temporary ChatGPT #563 Run-path applicator

on:
  push:
    branches:
      - chatgpt/563-disable-persistent-build-servers

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply bounded Run-mode correction
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          script = Path('product/tools/measure-api-host-reuse.ps1')
          data = script.read_bytes()
          newline = b'\r\n' if b'\r\n' in data else b'\n'
          old = b'    $runDirectory = Join-Path $Root (if ($IsWarmup) { "warmup-$Condition-seed-$Seed" } else { "$Condition\\run-$(\'{0:D2}\' -f $RunNumber)-seed-$Seed" })'
          new = newline.join([
              b'    $relativeRunPath = if ($IsWarmup) { "warmup-$Condition-seed-$Seed" } else { "$Condition\\run-$(\'{0:D2}\' -f $RunNumber)-seed-$Seed" }',
              b'    $runDirectory = Join-Path $Root $relativeRunPath',
          ])
          count = data.count(old)
          if count != 1:
              raise SystemExit(f'expected one invalid Run-path expression, found {count}')
          script.write_bytes(data.replace(old, new))

          contract = Path('product/test-contracts/tests/api-host-reuse-measurement.test.mjs')
          data = contract.read_bytes()
          newline = b'\r\n' if b'\r\n' in data else b'\n'
          anchor = b"  assert.match(source, /\\$arguments = @\\('test', \\$project, '--configuration', 'Release', '--no-build', '--disable-build-servers', '--filter'/)" + newline
          insertion = newline.join([
              b"  assert.match(source, /\\$arguments = @\\('test', \\$project, '--configuration', 'Release', '--no-build', '--disable-build-servers', '--filter'/)",
              b"  assert.match(source, /\\$relativeRunPath = if \\(\\$IsWarmup\\)/)",
              b"  assert.doesNotMatch(source, /Join-Path \\$Root \\(if \\(\\$IsWarmup\\)/)",
              b"",
          ])
          if data.count(anchor) != 1:
              raise SystemExit('Run-path contract anchor was not unique')
          contract.write_bytes(data.replace(anchor, insertion))
          '@ | python -

      - name: Run the Windows harness contracts
        shell: pwsh
        env:
          PWSH_EXE: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --check product/test-contracts/tests/api-host-reuse-measurement.test.mjs
          node --test product/test-contracts/tests/api-host-reuse-measurement.test.mjs

      - name: Commit only the focused correction
        shell: pwsh
        env:
          BRANCH: chatgpt/563-disable-persistent-build-servers
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -LiteralPath '.github/workflows/chatgpt-563-run-path-applicator.yml' -Force
          git diff --check
          $allowed = @(
            '.github/workflows/chatgpt-563-run-path-applicator.yml',
            'product/test-contracts/tests/api-host-reuse-measurement.test.mjs',
            'product/tools/measure-api-host-reuse.ps1'
          ) | Sort-Object
          $changed = @(git status --short | ForEach-Object { $_.Substring(3) } | Sort-Object)
          if (Compare-Object $allowed $changed) {
            throw "Unexpected final changed paths:`n$($changed -join "`n")"
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Run-mode observation path construction'
          git push origin "HEAD:$env:BRANCH"
