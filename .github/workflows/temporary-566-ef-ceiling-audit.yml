name: Temporary #566 EF placement audit

on:
  push:
    branches:
      - chatgpt/566-ef-ceiling-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact audit tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Audit EF-translation API methods
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node product/tools/temporary-audit-566-ef.mjs
          if ($LASTEXITCODE -ne 0) { throw 'EF placement audit failed.' }
      - name: Upload audit record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aerolink-566-ef-ceiling-${{ github.run_id }}
          path: ${{ runner.temp }}\aerolink-566-ef-ceiling-audit.json
          if-no-files-found: error
          retention-days: 14
