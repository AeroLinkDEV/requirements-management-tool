name: Temporary #566 domain migration v2

on:
  push:
    branches:
      - chatgpt/566-release-domain-evidence
    paths:
      - .github/workflows/temporary-566-migrate-domain-v2.yml

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: windows-latest
    steps:
      - name: Check out task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Reuse the reviewed exact source transformation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $extractor = @'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/temporary-566-migrate-domain.yml').read_text(encoding='utf-8')
          match = re.search(r"\$script = @'\n(?P<script>.*?)\n\s+'@\n\s+\$script \| python -", workflow, re.S)
          if not match:
              raise SystemExit('Could not locate the reviewed source transformation in v1 workflow')
          script = textwrap.dedent(match.group('script'))
          exec(compile(script, '<temporary-566-v1-source-transform>', 'exec'))
          '@
          $extractor | python -
          if ($LASTEXITCODE -ne 0) { throw 'Source transformation failed.' }

      - name: Update source-derived inventory snapshot expectations
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $patch = @'
          from pathlib import Path

          path = Path('product/test-contracts/tests/inventory.test.mjs')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "hostArtifact.summary['fresh-host'], { classes: 40, tests: 204, knownCases: 229, unknownCaseTests: 0 }": "hostArtifact.summary['fresh-host'], { classes: 40, tests: 201, knownCases: 226, unknownCaseTests: 0 }",
              "hostArtifact.summary['migration-candidate'], { classes: 1, tests: 1, knownCases: 1, unknownCaseTests: 0 }": "hostArtifact.summary['migration-candidate'], { classes: 3, tests: 3, knownCases: 3, unknownCaseTests: 0 }",
              r"reusable-host\s+30\s+186\s+211\s+0\s+42\.0%": r"reusable-host\s+30\s+186\s+211\s+0\s+42\.1%",
              r"fresh-host\s+40\s+204\s+229\s+0\s+46\.0%": r"fresh-host\s+40\s+201\s+226\s+0\s+45\.5%",
              "intentArtifact.totals.tests, 443": "intentArtifact.totals.tests, 442",
              "intentArtifact.totals.cases, 493": "intentArtifact.totals.cases, 492",
              "hostArtifact.totals.knownCases, 493": "hostArtifact.totals.knownCases, 492",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one inventory snapshot occurrence for {old!r}; found {count}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8', newline='')
          '@
          $patch | python -
          if ($LASTEXITCODE -ne 0) { throw 'Inventory snapshot update failed.' }

      - name: Regenerate source-derived test inventories
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node product/test-contracts/tools/generate-test-intent.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Intent inventory generation failed.' }
          node product/test-contracts/tools/generate-host-classification.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Host classification generation failed.' }

      - name: Run inventory contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = @(Get-ChildItem -LiteralPath product/test-contracts/tests -Filter '*.test.mjs' -File | Sort-Object FullName | ForEach-Object { $_.FullName })
          & node --test $tests
          if ($LASTEXITCODE -ne 0) { throw 'Test-contract suite failed.' }

      - name: Run moved domain rule and affected API tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet test product/tests/AeroLink.Domain.Tests/AeroLink.Domain.Tests.csproj --configuration Release --filter "FullyQualifiedName~ReleaseCampaignTests"
          if ($LASTEXITCODE -ne 0) { throw 'ReleaseCampaign domain tests failed.' }
          dotnet test product/tests/AeroLink.Api.Tests/AeroLink.Api.Tests.csproj --configuration Release --filter "FullyQualifiedName~ApiTestTelemetryTests|FullyQualifiedName~ApiTestTelemetryStateTests|FullyQualifiedName~ServerAuthorityContractTests|FullyQualifiedName~ServerAuthorityIdentityShapeTests|FullyQualifiedName~ReleaseCampaignExactIntentApiTests"
          if ($LASTEXITCODE -ne 0) { throw 'Affected API tests failed.' }

      - name: Verify exact move and commit generated result
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Select-String -LiteralPath product/tests/AeroLink.Api.Tests/ReleaseCampaignExactIntentApiTests.cs -Pattern 'Review_can_restart_after_cancellation_with_history_retained' -Quiet) { throw 'Domain rule still exists in API tests.' }
          if (-not (Select-String -LiteralPath product/tests/AeroLink.Domain.Tests/ReleaseCampaignTests.cs -Pattern 'Review_can_restart_after_cancellation_with_history_retained' -Quiet)) { throw 'Domain rule was not moved.' }
          if (Select-String -LiteralPath product/tests/AeroLink.Api.Tests/ApiTestTelemetryTests.cs -Pattern 'Reset_for_test_clears_telemetry_state' -Quiet) { throw 'Telemetry pure fact still exists in hosted class.' }
          if (Select-String -LiteralPath product/tests/AeroLink.Api.Tests/ServerAuthorityContractTests.cs -Pattern 'Authenticated_browser_contracts_expose_no_caller_selectable_identity' -Quiet) { throw 'Identity-shape fact still exists in hosted class.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add product/tests/AeroLink.Api.Tests/ApiTestTelemetryTests.cs product/tests/AeroLink.Api.Tests/ApiTestTelemetryStateTests.cs product/tests/AeroLink.Api.Tests/ServerAuthorityContractTests.cs product/tests/AeroLink.Api.Tests/ServerAuthorityIdentityShapeTests.cs product/tests/AeroLink.Api.Tests/ReleaseCampaignExactIntentApiTests.cs product/tests/AeroLink.Domain.Tests/ReleaseCampaignTests.cs product/test-contracts/api-test-intent.json product/test-contracts/api-host-classification.json product/test-contracts/tests/inventory.test.mjs
          git diff --cached --stat
          git commit -m 'Move pure #566 checks below hosted boundary'
          git push origin HEAD:chatgpt/566-release-domain-evidence
