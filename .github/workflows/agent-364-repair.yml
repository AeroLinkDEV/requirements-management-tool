name: Agent 364 repair patch

on:
  push:
    branches:
      - agent/364-legacy-procedure-manifest-bootstrap

permissions:
  contents: write

jobs:
  patch:
    if: ${{ contains(github.event.head_commit.message, '[agent-364-run-repair]') }}
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Read the original branch-only patch so the retry stays identical except for the corrected marker.
      - name: Apply corrected core patch
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/agent-364-apply.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(workflow) if line.strip() == "@'")
          end = next(i for i in range(start + 1, len(workflow)) if "Set-Content -LiteralPath" in workflow[i])
          source = textwrap.dedent('\n'.join(workflow[start + 1:end]))
          broken = "marker = '''    public void Freeze(string actorId, DateTimeOffset now)\n{'''"
          fixed = 'marker = "    public void Freeze(string actorId, DateTimeOffset now)\\n    {"'
          if broken not in source:
              raise RuntimeError('The expected broken CandidateBaseline marker was not found in the embedded patch.')
          source = source.replace(broken, fixed)
          exec(compile(source, 'agent-364-embedded-patch.py', 'exec'))
          '@ | Set-Content -LiteralPath "$env:RUNNER_TEMP\agent364-repair.py" -Encoding utf8
          python "$env:RUNNER_TEMP\agent364-repair.py"

      - name: Install .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Validate backend contract
        shell: pwsh
        run: |
          dotnet restore product/AeroLink.slnx
          dotnet build product/AeroLink.slnx --configuration Release --no-restore
          dotnet test product/AeroLink.slnx --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Publish core product patch
        shell: pwsh
        run: |
          git diff --check
          git config user.name "seanmccarthyns"
          git config user.email "seanmccarthyns@gmail.com"
          git add product/src/AeroLink.Domain/Baselines/CandidateBaseline.cs `
            product/src/AeroLink.Infrastructure/Persistence/TestProcedureBaselineMaterializer.cs `
            product/src/AeroLink.Infrastructure/DependencyInjection.cs `
            product/src/AeroLink.Api/ApiContracts.cs `
            product/src/AeroLink.Api/BaselineEndpoints.cs
          git commit -m "[agent-364-applied] Add explicit legacy procedure bootstrap boundary"
          git push origin "HEAD:${env:GITHUB_REF_NAME}"
