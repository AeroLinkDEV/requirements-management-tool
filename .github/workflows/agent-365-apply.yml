name: Agent 365 branch patch

on:
  push:
    branches:
      - agent/365-tcr-supersession-browser

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[agent-365-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply focused issue 365 changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one match, found {count}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          workspace_path = 'product/client/src/TestChangeRequestWorkspace.tsx'
          replace_once(
              workspace_path,
              "type Package={id:string;displayNumber:string;baseNumber:string;revision:number;discipline:string;state:string;outcome:string;procedureLevel:string;sourceChangeRequestNumber:string;assignedEngineerId?:string;version:number;caseContractVersion:number;title:string;problem:string;analysis:string;solution:string;problemRich:string;analysisRich:string;solutionRich:string;procedureChanges:ProcedureChange[];capabilities:Capabilities;drivingRequirementChoices:RequirementChoice[];procedureTargets:ProcedureTarget[]}\n",
              "type Package={id:string;displayNumber:string;baseNumber:string;revision:number;discipline:string;state:string;outcome:string;procedureLevel:string;sourceChangeRequestNumber:string;assignedEngineerId?:string;version:number;caseContractVersion:number;title:string;problem:string;analysis:string;solution:string;problemRich:string;analysisRich:string;solutionRich:string;procedureChanges:ProcedureChange[];capabilities:Capabilities;drivingRequirementChoices:RequirementChoice[];procedureTargets:ProcedureTarget[]}\ntype SupersededBy={id:string;displayNumber:string;reason?:string}\n",
          )
          replace_once(
              workspace_path,
              "export default function TestChangeRequestWorkspace({api,projectId,reviewId,canAuthor,onClose,onChanged,onOpenRequirementRevision}:{api:string;projectId:string;reviewId:string;canAuthor:boolean;onClose:()=>void;onChanged:()=>void;onOpenRequirementRevision:(requirement:{id:string;revisionId:string;level:string})=>void}){",
              "export default function TestChangeRequestWorkspace({api,projectId,reviewId,canAuthor,onClose,onChanged,onOpenRequirementRevision,onOpenTestChangeRequest,supersededBy}:{api:string;projectId:string;reviewId:string;canAuthor:boolean;onClose:()=>void;onChanged:()=>void;onOpenRequirementRevision:(requirement:{id:string;revisionId:string;level:string})=>void;onOpenTestChangeRequest:(id:string)=>void;supersededBy?:SupersededBy}){",
          )
          replace_once(
              workspace_path,
              "  const revise=()=>void act(()=>apiRequest(`${api}/api/test-change-reviews/${reviewId}/revise`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}))",
              "  const revise=()=>void (async()=>{\n    setBusy(true);setError('')\n    try{\n      const next=await apiRequest<{id:string;displayNumber:string}>(`${api}/api/test-change-reviews/${reviewId}/revise`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})\n      onChanged()\n      onOpenTestChangeRequest(next.id)\n    }catch(problem){setError(operationError(problem,'The next test change request revision could not be started.'))}\n    finally{setBusy(false)}\n  })()",
          )
          replace_once(
              workspace_path,
              "      {error&&<div className=\"workspaceError\" role=\"alert\">{error}</div>}\n\n      {item&&<>",
              "      {error&&<div className=\"workspaceError\" role=\"alert\">{error}</div>}\n      {item?.state==='Superseded'&&<section className=\"tcrCaseSection\" role=\"status\">\n        <h3>Historical revision</h3>\n        <p>{supersededBy?.reason??`${item.displayNumber} has been replaced by a later controlled revision.`}</p>\n        {supersededBy\n          ?<button type=\"button\" className=\"linkedScr\" onClick={()=>onOpenTestChangeRequest(supersededBy.id)}>Open {supersededBy.displayNumber}</button>\n          :<p className=\"drawerEmpty\">The successor identity is not available in this build context.</p>}\n      </section>}\n\n      {item&&<>",
          )
          replace_once(
              workspace_path,
              "            {canAuthor&&!open&&item.state!=='Approved'&&<p className=\"drawerEmpty\">This test change request is with its approver. Its procedure decisions cannot change until they approve or return it.</p>}",
              "            {canAuthor&&item.state==='InReview'&&<p className=\"drawerEmpty\">This test change request is with its approver. Its procedure decisions cannot change until they approve or return it.</p>}",
          )

          coverage_path = 'product/client/src/TestingCoverageWorkspace.tsx'
          replace_once(
              coverage_path,
              "  state: string\n  version: number",
              "  state: string\n  supersededByTestChangeRequestId?: string\n  supersededReason?: string\n  version: number",
          )
          replace_once(
              coverage_path,
              "  const mine = requests.filter(x => x.discipline === discipline)\n",
              "  const mine = requests.filter(x => x.discipline === discipline)\n  const activeMine = mine.filter(x => x.state !== 'Superseded')\n  const supersededChainFor = (current: TestChangeRequest) => {\n    const history: TestChangeRequest[] = []\n    let successorId = current.id\n    for (;;) {\n      const previous = mine.find(candidate =>\n        candidate.state === 'Superseded' && candidate.supersededByTestChangeRequestId === successorId)\n      if (!previous) return history\n      history.push(previous)\n      successorId = previous.id\n    }\n  }\n  const authoringRequest = mine.find(x => x.id === authoring)\n  const authoringSuccessor = authoringRequest?.supersededByTestChangeRequestId\n    ? mine.find(x => x.id === authoringRequest.supersededByTestChangeRequestId)\n    : undefined\n",
          )
          replace_once(coverage_path, "        {!mine.length && (", "        {!activeMine.length && (")
          replace_once(
              coverage_path,
              "        {mine.map(request => (\n          <article className=\"downstreamAssessment\" data-state={request.state} key={request.id}>",
              "        {activeMine.map(request => {\n          const supersededRevisions = supersededChainFor(request)\n          return (\n          <article className=\"downstreamAssessment\" data-state={request.state} key={request.id}>",
          )
          replace_once(
              coverage_path,
              "              {request.outcome === 'NoChangeRequired' && request.noChangeRationale && <p>{request.noChangeRationale}</p>}",
              "              {supersededRevisions.length > 0 && (\n                <details className=\"decisionHistory tcrRevisionHistory\">\n                  <summary>Show {supersededRevisions.length} superseded TCR revision{supersededRevisions.length === 1 ? '' : 's'}</summary>\n                  {supersededRevisions.map(prior => (\n                    <button type=\"button\" className=\"linkedScr\" key={prior.id} onClick={() => setAuthoring(prior.id)}>\n                      {prior.displayNumber} · Superseded\n                    </button>\n                  ))}\n                </details>\n              )}\n              {request.outcome === 'NoChangeRequired' && request.noChangeRationale && <p>{request.noChangeRationale}</p>}",
          )
          replace_once(
              coverage_path,
              "          </article>\n        ))}",
              "          </article>\n          )\n        })}",
          )
          replace_once(
              coverage_path,
              "          onChanged={() => void load()}\n          onOpenRequirementRevision={onOpenRequirementRevision}",
              "          onChanged={() => void load()}\n          onOpenRequirementRevision={onOpenRequirementRevision}\n          onOpenTestChangeRequest={setAuthoring}\n          supersededBy={authoringSuccessor ? {\n            id: authoringSuccessor.id,\n            displayNumber: authoringSuccessor.displayNumber,\n            reason: authoringRequest?.supersededReason,\n          } : undefined}",
          )
          PY

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: product/client/package-lock.json

      - name: Validate client changes
        working-directory: product/client
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build

      - name: Check and publish patch
        shell: bash
        run: |
          git diff --check
          git config user.name "seanmccarthyns"
          git config user.email "seanmccarthyns@gmail.com"
          git add product/client/src/TestChangeRequestWorkspace.tsx product/client/src/TestingCoverageWorkspace.tsx
          git commit -m "[agent-365-applied] Complete TCR supersession browser history"
          git push origin "HEAD:${GITHUB_REF_NAME}"
