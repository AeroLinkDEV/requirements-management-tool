name: PR39 compile diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Compile API
        id: compile
        shell: bash
        run: |
          set +e
          dotnet build product/src/AeroLink.Api/AeroLink.Api.csproj --no-restore --verbosity diagnostic > build.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload compiler report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr39-compiler-report
          path: build.log
          if-no-files-found: error
          retention-days: 2
      - name: Fail when compile failed
        if: steps.compile.outputs.exit_code != '0'
        shell: bash
        run: exit 1
