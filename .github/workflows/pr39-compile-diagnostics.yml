name: PR39 compile diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Compile API
        shell: bash
        run: dotnet build product/src/AeroLink.Api/AeroLink.Api.csproj --no-restore --verbosity minimal
