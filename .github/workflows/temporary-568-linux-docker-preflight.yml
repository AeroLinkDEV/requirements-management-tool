name: Temporary #568 Linux Docker preflight repair

on:
  push:
    branches:
      - chatgpt/568-linux-docker-preflight

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Apply bounded Docker compatibility preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          p = Path('product/scripts/Get-AeroLinkTestPlan.ps1')
          s = p.read_text(encoding='utf-8')
          old = '''function Get-DisposableDockerCommand {
              $dockerCommand = Get-Command docker.exe -ErrorAction SilentlyContinue
              if (-not $dockerCommand) { $dockerCommand = Get-Command docker -ErrorAction SilentlyContinue }
              if (-not $dockerCommand) { throw 'Docker is unavailable; the PostgreSQL gate is not-proven and Full mode cannot report success.' }
              try { & $dockerCommand.Source version --format '{{.Server.Version}}' *> $null; if ($LASTEXITCODE -ne 0) { throw 'daemon unavailable' } }
              catch { throw 'Docker is unavailable; the daemon could not be queried, so the PostgreSQL gate is not-proven.' }
              return $dockerCommand.Source
          }
          '''
          new = '''function Get-DisposableDockerCommand {
              $dockerCommand = Get-Command docker.exe -ErrorAction SilentlyContinue
              if (-not $dockerCommand) { $dockerCommand = Get-Command docker -ErrorAction SilentlyContinue }
              if (-not $dockerCommand) { throw 'Docker is unavailable; the PostgreSQL gate is not-proven and Full mode cannot report success.' }
              try { & $dockerCommand.Source version --format '{{.Server.Version}}' *> $null; if ($LASTEXITCODE -ne 0) { throw 'daemon unavailable' } }
              catch { throw 'Docker is unavailable; the daemon could not be queried, so the PostgreSQL gate is not-proven.' }
              try {
                  $serverOsType = ((& $dockerCommand.Source info --format '{{.OSType}}' 2>$null) -join '').Trim()
                  if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($serverOsType)) { throw 'server OS type unavailable' }
              }
              catch { throw 'Docker is unavailable; the daemon OS type could not be verified, so the PostgreSQL gate is not-proven.' }
              if ($serverOsType -cne 'linux') {
                  throw "Docker server OSType '$serverOsType' cannot run the required Linux postgres:17 image; the PostgreSQL gate is not-proven. Switch Docker Desktop to Linux containers before Full mode."
              }
              return $dockerCommand.Source
          }
          '''
          if s.count(old) != 1:
              raise SystemExit(f'Docker command function: expected one exact match, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          tpath = Path('product/scripts/Get-AeroLinkTestPlan.Tests.ps1')
          t = tpath.read_text(encoding='utf-8')
          marker = "$plannerSource = Get-Content -Raw -LiteralPath $scriptPath\n"
          if t.count(marker) != 1:
              raise SystemExit(f'plannerSource marker: expected one match, found {t.count(marker)}')
          extra = marker + "Assert-True ($plannerSource -match \"info --format '\\{\\{\\.OSType\\}\\}'\") 'Full PostgreSQL preflight must inspect the Docker server OS type before expensive gates.'\nAssert-True ($plannerSource -match \"serverOsType -cne 'linux'\") 'Full PostgreSQL preflight must refuse a non-Linux Docker daemon.'\nAssert-True ($plannerSource -match 'Switch Docker Desktop to Linux containers before Full mode') 'Docker incompatibility must give the developer an actionable recovery message.'\n"
          tpath.write_text(t.replace(marker, extra, 1), encoding='utf-8')
          '@ | python -
      - name: Validate Windows planner contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./product/scripts/Get-AeroLinkTestPlan.Tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows planner contract failed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }
      - name: Commit validated product-only repair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'seanmccarthyns'
          git config user.email 'seanmccarthyns@gmail.com'
          git add product/scripts/Get-AeroLinkTestPlan.ps1 product/scripts/Get-AeroLinkTestPlan.Tests.ps1
          $staged = @(git diff --cached --name-only)
          if ($staged.Count -ne 2) { throw "Expected two staged paths, got $($staged.Count)." }
          git commit -m 'Fail Full early on non-Linux Docker'
          git push origin HEAD:chatgpt/568-linux-docker-preflight
