name: Agent 364 final product completion repair 5

on:
  push:
    branches:
      - agent/364-legacy-procedure-manifest-bootstrap

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ contains(github.event.head_commit.message, '[agent-364-finalize-repair5]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply completed product patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/agent-364-finalize-repair4.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(workflow) if line.strip() == "python - <<'PY'")
          end = next(i for i in range(start + 1, len(workflow)) if workflow[i].strip() == 'PY')
          source = textwrap.dedent('\n'.join(workflow[start + 1:end]))
          exec(compile(source, 'agent-364-final-patch.py', 'exec'))

          lifecycle = Path('product/tests/AeroLink.Infrastructure.Tests/LegacyProcedureManifestBootstrapLifecycleTests.cs')
          text = lifecycle.read_text(encoding='utf-8')
          text = text.replace(
              'using Microsoft.EntityFrameworkCore;\n',
              'using Microsoft.EntityFrameworkCore;\nusing System.Text.Json;\n',
              1)
          marker = '''                          var tcr = new TestChangeReview(project.Id, release17.Id, source17.Id,
                              TestChangeReviewDiscipline.System, source17.DisplayNumber, now.AddHours(4));'''
          insertion = '''                          var requirementArtifact = new RequirementArtifact(project.Id,
                              "SYSR-09502000", RequirementLevel.System, now.AddHours(4));
                          var requirementRevision = new RequirementRevision(requirementArtifact.Id, 0,
                              "The product shall verify the successor behavior.", "Successor verification input.",
                              "Test", RequirementRevisionState.Active, source17.Id, baseline17.Id, now.AddHours(4));
                          var requirementMember = new BaselineRequirementSelection(baseline17.Id,
                              requirementArtifact.Id, requirementRevision.Id);
                          var tcr = new TestChangeReview(project.Id, release17.Id, source17.Id,
                              TestChangeReviewDiscipline.System, source17.DisplayNumber, now.AddHours(4));'''
          if text.count(marker) != 1:
              raise RuntimeError(f'expected one TCR insertion marker, found {text.count(marker)}')
          text = text.replace(marker, insertion)
          old_introduce = '''                          tcr.AddProcedureChange("verification.engineer", Change("SYSTP-095003", 0,
                              TestProcedureChangeKind.Introduce, "New successor procedure"), now.AddHours(4));'''
          new_introduce = '''                          tcr.AddProcedureChange("verification.engineer", Change("SYSTP-095003", 0,
                              TestProcedureChangeKind.Introduce, "New successor procedure",
                              JsonSerializer.Serialize(new[] { requirementRevision.Id })), now.AddHours(4));'''
          if text.count(old_introduce) != 1:
              raise RuntimeError(f'expected one Introduce fixture, found {text.count(old_introduce)}')
          text = text.replace(old_introduce, new_introduce)
          old_add = '                          db.AddRange(release17, source17, baseline17, tcr);'
          new_add = '''                          db.AddRange(release17, source17, baseline17, requirementArtifact,
                              requirementRevision, requirementMember, tcr);'''
          if text.count(old_add) != 1:
              raise RuntimeError(f'expected one lifecycle AddRange, found {text.count(old_add)}')
          text = text.replace(old_add, new_add)
          old_helper = '''                  private static TestProcedureChangeDraft Change(string number, int revision,
                      TestProcedureChangeKind kind, string title) => new(number, revision,
                      TestProcedureLevel.System, kind, title,
                      kind == TestProcedureChangeKind.Retire ? "" : "Verify the successor behavior.",
                      "Configured product.", kind == TestProcedureChangeKind.Retire ? "" : "1. Exercise the behavior.",
                      kind == TestProcedureChangeKind.Retire ? "" : "Behavior is correct.",
                      "Approved successor procedure disposition.");'''
          new_helper = '''                  private static TestProcedureChangeDraft Change(string number, int revision,
                      TestProcedureChangeKind kind, string title, string drivingRequirementRevisionIdsJson = "[]") =>
                      new(number, revision, TestProcedureLevel.System, kind, title,
                          kind == TestProcedureChangeKind.Retire ? "" : "Verify the successor behavior.",
                          "Configured product.", kind == TestProcedureChangeKind.Retire ? "" : "1. Exercise the behavior.",
                          kind == TestProcedureChangeKind.Retire ? "" : "Behavior is correct.",
                          "Approved successor procedure disposition.", drivingRequirementRevisionIdsJson);'''
          if text.count(old_helper) != 1:
              raise RuntimeError(f'expected one Change helper, found {text.count(old_helper)}')
          lifecycle.write_text(text.replace(old_helper, new_helper), encoding='utf-8')

          browser = Path('product/client/tests/legacy-procedure-bootstrap.spec.ts')
          browser_text = browser.read_text(encoding='utf-8')
          old_group = "await openNavigationGroup(page, 'RELEASE & CONFIGURATION')"
          if browser_text.count(old_group) != 1:
              raise RuntimeError(f'expected one old navigation group, found {browser_text.count(old_group)}')
          browser.write_text(browser_text.replace(old_group, "await openNavigationGroup(page, 'RELEASE')"),
              encoding='utf-8')
          PY

      - name: Install .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: product/client/package-lock.json

      - name: Compile and run focused backend qualification
        shell: bash
        run: |
          dotnet restore product/AeroLink.slnx
          dotnet build product/AeroLink.slnx --configuration Release --no-restore
          dotnet test product/tests/AeroLink.Domain.Tests/AeroLink.Domain.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~LegacyProcedureManifestBootstrap" --logger "console;verbosity=normal"
          dotnet test product/tests/AeroLink.Infrastructure.Tests/AeroLink.Infrastructure.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~LegacyProcedureManifestBootstrap" --logger "console;verbosity=normal"
          dotnet test product/tests/AeroLink.Api.Tests/AeroLink.Api.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~LegacyProcedureManifestBootstrap" --logger "console;verbosity=normal"

      - name: Validate client and real browser journey
        working-directory: product/client
        shell: bash
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build
          npx playwright install chromium
          npx playwright test tests/legacy-procedure-bootstrap.spec.ts --workers=1

      - name: Publish completed product work
        shell: bash
        run: |
          git diff --check
          git config user.name "seanmccarthyns"
          git config user.email "seanmccarthyns@gmail.com"
          git add product/client/src/App.tsx \
            product/client/src/BaselineCenter.tsx \
            product/client/src/LegacyProcedureBootstrapPanel.tsx \
            product/client/src/routing.ts \
            product/client/tests/legacy-procedure-bootstrap.spec.ts \
            product/tests/AeroLink.Api.Tests/LegacyProcedureManifestBootstrapApiTests.cs \
            product/tests/AeroLink.Infrastructure.Tests/LegacyProcedureManifestBootstrapLifecycleTests.cs
          git commit -m "Complete explicit legacy procedure bootstrap workflow"
          git push origin "HEAD:${GITHUB_REF_NAME}"
