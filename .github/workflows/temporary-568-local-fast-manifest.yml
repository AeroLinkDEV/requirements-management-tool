name: Temporary local Fast manifest validation

on:
  push:
    branches:
      - chatgpt/568-local-fast-manifest

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Apply manifest-aligned local Fast patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python product/tools/temporary-568-local-fast-patch.py
          if ($LASTEXITCODE -ne 0) { throw 'Local Fast patch helper failed.' }

      - name: Validate wrapper and manifest contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./product/scripts/Get-AeroLinkTestPlan.Tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows planner contract failed.' }
          node --test product/test-planner/tests/fast-ci-workflow.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Fast manifest contract failed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }

      - name: Prepare warmed developer state outside timing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore product/AeroLink.slnx
          if ($LASTEXITCODE -ne 0) { throw 'Solution restore failed.' }
          dotnet build product/AeroLink.slnx --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Initial build failed.' }
          Push-Location product/client
          try {
            npm ci
            if ($LASTEXITCODE -ne 0) { throw 'Client dependency install failed.' }
          }
          finally { Pop-Location }

      - name: Prove backend local Fast target
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $transcript = Join-Path $env:RUNNER_TEMP 'aerolink-568-local-fast-backend.txt'
          & ./product/scripts/Get-AeroLinkTestPlan.ps1 -Paths 'product/src/AeroLink.Domain/Requirements/Requirement.cs' -Mode Fast -Explain *>&1 | Tee-Object -FilePath $transcript | ForEach-Object { Write-Host $_ }
          $nativeExit = $LASTEXITCODE
          $line = Get-Content -LiteralPath $transcript | Where-Object { $_ -like 'AEROLINK_TEST_PLAN_RESULT=*' } | Select-Object -Last 1
          if (-not $line) { throw 'Backend Fast emitted no bounded result.' }
          $result = $line.Substring('AEROLINK_TEST_PLAN_RESULT='.Length) | ConvertFrom-Json -Depth 30
          if ($nativeExit -ne 0 -or $result.execution.status -ne 'passed') { throw 'Backend local Fast failed.' }
          if ($result.execution.authoritative -ne $false) { throw 'Backend local Fast claimed merge authority.' }
          if (@($result.execution.executedCiJobs).Count -ne 0) { throw 'Backend local Fast claimed complete CI jobs.' }
          if ($result.execution.resources.persistentPostgreSqlTouched -ne $false -or $result.execution.resources.persistentEvidenceRootTouched -ne $false) { throw 'Backend local Fast touched a persistent resource.' }
          $totalMs = [int64]$result.execution.timing.totalMs
          if ($totalMs -gt 240000) { throw "Backend local Fast exceeded target: $totalMs ms." }
          "BACKEND_LOCAL_FAST_MS=$totalMs" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prove client local Fast target
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $transcript = Join-Path $env:RUNNER_TEMP 'aerolink-568-local-fast-client.txt'
          & ./product/scripts/Get-AeroLinkTestPlan.ps1 -Paths 'product/client/src/App.tsx' -Mode Fast -Explain *>&1 | Tee-Object -FilePath $transcript | ForEach-Object { Write-Host $_ }
          $nativeExit = $LASTEXITCODE
          $line = Get-Content -LiteralPath $transcript | Where-Object { $_ -like 'AEROLINK_TEST_PLAN_RESULT=*' } | Select-Object -Last 1
          if (-not $line) { throw 'Client Fast emitted no bounded result.' }
          $result = $line.Substring('AEROLINK_TEST_PLAN_RESULT='.Length) | ConvertFrom-Json -Depth 30
          if ($nativeExit -ne 0 -or $result.execution.status -ne 'passed') { throw 'Client local Fast failed.' }
          if ($result.execution.authoritative -ne $false -or @($result.execution.executedCiJobs).Count -ne 0) { throw 'Client local Fast overstated authority.' }
          if ($result.execution.resources.persistentPostgreSqlTouched -ne $false -or $result.execution.resources.persistentEvidenceRootTouched -ne $false) { throw 'Client local Fast touched a persistent resource.' }
          $totalMs = [int64]$result.execution.timing.totalMs
          if ($totalMs -gt 240000) { throw "Client local Fast exceeded target: $totalMs ms." }
          "CLIENT_LOCAL_FAST_MS=$totalMs" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Commit validated local Fast alignment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'seanmccarthyns'
          git config user.email 'seanmccarthyns@gmail.com'
          git add product/scripts/Get-AeroLinkTestPlan.ps1 product/scripts/Get-AeroLinkTestPlan.Tests.ps1
          $paths = @(git diff --cached --name-only)
          if ($paths.Count -ne 2) { throw "Expected exactly two staged wrapper files, got $($paths.Count)." }
          git commit -m 'Align local Fast validation with shared smoke manifest'
          git push origin HEAD:chatgpt/568-local-fast-manifest

      - name: Publish timing evidence
        if: always()
        shell: pwsh
        run: |
          @(
            '## #568 manifest-aligned local Fast proof',
            '',
            "- backend local Fast: $env:BACKEND_LOCAL_FAST_MS ms",
            "- client local Fast: $env:CLIENT_LOCAL_FAST_MS ms",
            '- target: <=240000 ms each',
            '- persistent PostgreSQL/evidence: forbidden and fingerprint-protected',
            '- merge authority: unchanged protected GitHub Product quality gate'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
