name: Temporary manifest-aligned local Fast validation

on:
  push:
    branches:
      - chatgpt/568-local-fast-manifest

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Align local Fast with the shared Fast manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          $path = 'product/scripts/Get-AeroLinkTestPlan.ps1'
          $text = Get-Content -Raw -LiteralPath $path

          $marker = 'function Invoke-FastStep {'
          if (($text.Split($marker).Count - 1) -ne 1) { throw 'Expected one Invoke-FastStep marker.' }
          $loader = @'
function Get-FastValidationManifest {
    $manifestPath = Join-Path $repositoryRoot 'product\test-planner\fast-ci-manifest.json'
    if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) { throw 'Fast validation manifest is missing.' }
    try { $manifest = Get-Content -Raw -LiteralPath $manifestPath | ConvertFrom-Json -Depth 20 }
    catch { throw 'Fast validation manifest could not be parsed.' }
    if ($manifest.id -ne 'aerolink-fast-ci/v1' -or $manifest.authoritative -ne $false -or [int64]$manifest.targetMs -ne 240000) { throw 'Fast validation manifest identity or authority is invalid.' }
    if ($manifest.safety.persistentPostgreSql -ne 'forbidden' -or $manifest.safety.persistentEvidenceRoot -ne 'forbidden') { throw 'Fast validation manifest persistent-resource safety is invalid.' }
    return $manifest
}

'@
          $text = $text.Replace($marker, ($loader + $marker))

          $oldFunction = @'
function Invoke-FastStep {
    param([Parameter(Mandatory)]$Step)
    if ($Step.fullOnly) {
        Write-Host "  [CI-only in Fast] $($Step.label): $($Step.why)" -ForegroundColor Yellow
        return
    }
    switch ($Step.label) {
        'Build the solution' { Invoke-CheckedProcess 'dotnet' @('build', 'product/AeroLink.slnx', '--configuration', 'Release') }
        'Domain suite' { Invoke-CheckedProcess 'dotnet' @('test', 'product/tests/AeroLink.Domain.Tests', '--configuration', 'Release', '--no-build') }
        'Infrastructure suite' { Invoke-CheckedProcess 'dotnet' @('test', 'product/tests/AeroLink.Infrastructure.Tests', '--configuration', 'Release', '--no-build') }
        'Client lint, type-check and build' { Invoke-CheckedProcess 'npm.cmd' @('--prefix', 'product/client', 'run', 'lint'); Invoke-CheckedProcess 'npm.cmd' @('--prefix', 'product/client', 'run', 'build') }
        'Browser smoke journeys' { Invoke-CheckedProcess 'npm.cmd' @('--prefix', 'product/client', 'run', 'test:smoke') }
        default { Write-Host "  [CI-only] $($Step.label): $($Step.why)" -ForegroundColor Yellow }
    }
}
'@
          $newFunction = @'
function Invoke-FastStep {
    param([Parameter(Mandatory)]$Step)
    if ($Step.fullOnly) {
        Write-Host "  [CI-only in Fast] $($Step.label): $($Step.why)" -ForegroundColor Yellow
        return
    }
    $fastManifest = Get-FastValidationManifest
    switch ($Step.label) {
        'Build the solution' { Invoke-CheckedProcess 'dotnet' @('build', [string]$fastManifest.backend.build, '--configuration', 'Release') }
        'Domain suite' { Invoke-CheckedProcess 'dotnet' @('test', [string]$fastManifest.backend.domainProject, '--configuration', 'Release', '--no-build') }
        'Infrastructure suite' {
            $infraFilter = @($fastManifest.backend.infrastructureClasses | ForEach-Object { "FullyQualifiedName~AeroLink.Infrastructure.Tests.$_" }) -join '|'
            Invoke-CheckedProcess 'dotnet' @('test', [string]$fastManifest.backend.infrastructureProject, '--configuration', 'Release', '--no-build', '--filter', $infraFilter)
            $apiFilter = @($fastManifest.backend.apiClasses | ForEach-Object { "FullyQualifiedName~AeroLink.Api.Tests.$_" }) -join '|'
            Invoke-CheckedProcess 'dotnet' @('test', [string]$fastManifest.backend.apiProject, '--configuration', 'Release', '--no-build', '--filter', $apiFilter)
        }
        'Client lint, type-check and build' {
            Invoke-CheckedProcess 'npm.cmd' @('--prefix', [string]$fastManifest.client.workingDirectory, 'run', 'lint')
            Invoke-CheckedProcess 'npm.cmd' @('--prefix', [string]$fastManifest.client.workingDirectory, 'run', 'typecheck')
        }
        'Browser smoke journeys' { Write-Host '  [Full-only in Fast manifest] Browser smoke journeys remain protected GitHub evidence.' -ForegroundColor Yellow }
        default { Write-Host "  [CI-only] $($Step.label): $($Step.why)" -ForegroundColor Yellow }
    }
}
'@
          if (($text.Split($oldFunction).Count - 1) -ne 1) { throw 'Expected exact original Invoke-FastStep block.' }
          $text = $text.Replace($oldFunction, $newFunction)

          $oldLoop = @'
        if ($Mode -eq 'Fast') {
            foreach ($step in $plan.local) {
                if ($step.label -eq 'Nothing') { continue }
                if (-not $step.fullOnly) {
                    $ciJobs = @(Get-CiJobsForStep $step.label | Where-Object { (Get-StringArray $plan.compact.ci.selected) -contains $_ })
                    Invoke-TimedAction -Label $step.label -CiJobs $ciJobs -Action { Invoke-FastStep -Step $step }
                }
                else { Invoke-FastStep -Step $step }
            }
        }
'@
          $newLoop = @'
        if ($Mode -eq 'Fast') {
            $null = Get-FastValidationManifest
            foreach ($step in $plan.local) {
                if ($step.label -eq 'Nothing') { continue }
                if ($step.label -eq 'Browser smoke journeys') { Invoke-FastStep -Step $step; continue }
                if (-not $step.fullOnly) {
                    # Fast is a deliberately bounded subset. It never claims that a complete CI job has
                    # executed locally; every selected GitHub job remains merge evidence in ciOnlyJobs.
                    Invoke-TimedAction -Label $step.label -CiJobs @() -Action { Invoke-FastStep -Step $step }
                }
                else { Invoke-FastStep -Step $step }
            }
        }
'@
          if (($text.Split($oldLoop).Count - 1) -ne 1) { throw 'Expected exact original Fast execution loop.' }
          $text = $text.Replace($oldLoop, $newLoop)
          [IO.File]::WriteAllText((Resolve-Path $path).Path, $text, $utf8)

          $testPath = 'product/scripts/Get-AeroLinkTestPlan.Tests.ps1'
          $tests = Get-Content -Raw -LiteralPath $testPath
          $testMarker = "Assert-True (Test-Path -LiteralPath (Join-Path `$root 'TEST_AEROLINK_CHANGED.bat') -PathType Leaf) 'Friendly root BAT entry point is missing.'"
          if (($tests.Split($testMarker).Count - 1) -ne 1) { throw 'Expected Windows planner test insertion marker.' }
          $extra = @'
$plannerSource = Get-Content -Raw -LiteralPath $scriptPath
Assert-True ($plannerSource -match 'fast-ci-manifest\.json') 'Local Fast must consume the shared Fast manifest.'
Assert-True ($plannerSource -match 'infrastructureClasses') 'Local Fast must use the reviewed Infrastructure smoke list.'
Assert-True ($plannerSource -match 'apiClasses') 'Local Fast must use the reviewed hosted API smoke list.'
Assert-True ($plannerSource -match "'run', 'typecheck'") 'Local Fast client validation must include type-check.'
Assert-True ($plannerSource -match 'Full-only in Fast manifest') 'Local Fast must explicitly defer browser smoke to Full evidence.'
Assert-True ($plannerSource -match 'Invoke-TimedAction -Label \$step\.label -CiJobs @\(\)') 'Local Fast must not claim complete CI jobs as locally executed.'
'@
          $tests = $tests.Replace($testMarker, ($testMarker + "`n`n" + $extra.TrimEnd("`r", "`n")))
          [IO.File]::WriteAllText((Resolve-Path $testPath).Path, $tests, $utf8)

      - name: Validate wrapper and planner contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./product/scripts/Get-AeroLinkTestPlan.Tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows planner contract failed.' }
          node --test product/test-planner/tests/fast-ci-workflow.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Fast manifest contract failed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }

      - name: Prepare warmed local developer state outside timing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore product/AeroLink.slnx
          if ($LASTEXITCODE -ne 0) { throw 'Solution restore failed.' }
          dotnet build product/AeroLink.slnx --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Initial build failed.' }
          Push-Location product/client
          try {
            npm ci
            if ($LASTEXITCODE -ne 0) { throw 'Client dependency install failed.' }
          }
          finally { Pop-Location }

      - name: Prove backend local Fast target
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $transcript = Join-Path $env:RUNNER_TEMP 'aerolink-568-local-fast-backend.txt'
          & ./product/scripts/Get-AeroLinkTestPlan.ps1 -Paths 'product/src/AeroLink.Domain/Requirements/Requirement.cs' -Mode Fast -Explain *>&1 | Tee-Object -FilePath $transcript | ForEach-Object { Write-Host $_ }
          $nativeExit = $LASTEXITCODE
          $line = Get-Content -LiteralPath $transcript | Where-Object { $_ -like 'AEROLINK_TEST_PLAN_RESULT=*' } | Select-Object -Last 1
          if (-not $line) { throw 'Backend Fast emitted no bounded result.' }
          $result = $line.Substring('AEROLINK_TEST_PLAN_RESULT='.Length) | ConvertFrom-Json -Depth 30
          if ($nativeExit -ne 0 -or $result.execution.status -ne 'passed') { throw 'Backend local Fast failed.' }
          if ($result.execution.authoritative -ne $false) { throw 'Backend local Fast claimed merge authority.' }
          if (@($result.execution.executedCiJobs).Count -ne 0) { throw 'Backend local Fast claimed complete CI jobs.' }
          if ($result.execution.resources.persistentPostgreSqlTouched -ne $false -or $result.execution.resources.persistentEvidenceRootTouched -ne $false) { throw 'Backend local Fast touched a persistent resource.' }
          $totalMs = [int64]$result.execution.timing.totalMs
          if ($totalMs -gt 240000) { throw "Backend local Fast exceeded target: $totalMs ms." }
          "BACKEND_LOCAL_FAST_MS=$totalMs" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prove client local Fast target
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $transcript = Join-Path $env:RUNNER_TEMP 'aerolink-568-local-fast-client.txt'
          & ./product/scripts/Get-AeroLinkTestPlan.ps1 -Paths 'product/client/src/App.tsx' -Mode Fast -Explain *>&1 | Tee-Object -FilePath $transcript | ForEach-Object { Write-Host $_ }
          $nativeExit = $LASTEXITCODE
          $line = Get-Content -LiteralPath $transcript | Where-Object { $_ -like 'AEROLINK_TEST_PLAN_RESULT=*' } | Select-Object -Last 1
          if (-not $line) { throw 'Client Fast emitted no bounded result.' }
          $result = $line.Substring('AEROLINK_TEST_PLAN_RESULT='.Length) | ConvertFrom-Json -Depth 30
          if ($nativeExit -ne 0 -or $result.execution.status -ne 'passed') { throw 'Client local Fast failed.' }
          if ($result.execution.authoritative -ne $false -or @($result.execution.executedCiJobs).Count -ne 0) { throw 'Client local Fast overstated authority.' }
          $totalMs = [int64]$result.execution.timing.totalMs
          if ($totalMs -gt 240000) { throw "Client local Fast exceeded target: $totalMs ms." }
          "CLIENT_LOCAL_FAST_MS=$totalMs" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Commit validated local Fast alignment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'seanmccarthyns'
          git config user.email 'seanmccarthyns@gmail.com'
          git add product/scripts/Get-AeroLinkTestPlan.ps1 product/scripts/Get-AeroLinkTestPlan.Tests.ps1
          $paths = @(git diff --cached --name-only)
          if ($paths.Count -ne 2) { throw "Expected exactly two staged wrapper files, got $($paths.Count)." }
          git commit -m 'Align local Fast validation with shared smoke manifest'
          git push origin HEAD:chatgpt/568-local-fast-manifest

      - name: Publish timing evidence
        if: always()
        shell: pwsh
        run: |
          @(
            '## #568 manifest-aligned local Fast proof',
            '',
            "- backend local Fast: $env:BACKEND_LOCAL_FAST_MS ms",
            "- client local Fast: $env:CLIENT_LOCAL_FAST_MS ms",
            '- target: <=240000 ms each',
            '- persistent PostgreSQL/evidence: forbidden and fingerprint-protected',
            '- merge authority: unchanged protected GitHub Product quality gate'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
