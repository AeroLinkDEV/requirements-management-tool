name: "Temporary #561 cadence patcher"

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-cadence-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare bounded cadence branch
        shell: bash
        env:
          TARGET_BRANCH: chatgpt/561-cadence-switch-v4
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          if git ls-remote --exit-code --heads origin "refs/heads/$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "Target branch already exists; nothing to do."
            exit 0
          fi

          git checkout -b "$TARGET_BRANCH"
          python .github/scripts/prepare-561-cadence.py

          if grep -q '^  pull_request:$' .github/workflows/ci.yml; then
            echo "Automatic pull_request trigger still present after bounded edit." >&2
            exit 1
          fi
          grep -q '^  workflow_dispatch:$' .github/workflows/ci.yml
          grep -Fq "inputs.pull_request_number != ''" .github/workflows/ci.yml
          grep -Fq "inputs.pull_request_number == '' && inputs.full_diagnostics == true" .github/workflows/ci.yml
          grep -Fq 'effective_event=' .github/workflows/ci.yml
          grep -q '^    name: Full Product evidence aggregate$' .github/workflows/ci.yml
          if grep -q '^    name: Report what this run validated$' .github/workflows/ci.yml; then
            echo "Product still exposes the protected context name directly." >&2
            exit 1
          fi
          grep -q '^  pull_request:$' .github/workflows/fast-pr-feedback.yml
          grep -q '^  pull_request_target:$' .github/workflows/reset-full-ci-readiness.yml
          grep -q 'Authenticate label-dispatched pull-request context' .github/workflows/request-full-ci.yml
          grep -q 'ready-for-full-ci' product/docs/MERGING.md
          grep -q 'Merge-ready Full-CI cadence' product/docs/BROWSER_AND_BACKEND_FEEDBACK_TIME.md
          grep -q 'Merge-ready Full CI' product/test-planner/README.md
          node --test product/test-planner/tests/full-ci-readiness-dispatch.test.mjs product/test-planner/tests/workflow-jobs.test.mjs

          git rm .github/workflows/temporary-561-cadence-patcher.yml
          git rm .github/scripts/prepare-561-cadence.py
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml product/docs/MERGING.md product/docs/BROWSER_AND_BACKEND_FEEDBACK_TIME.md product/test-planner/README.md product/test-planner/lib/workflow-jobs.mjs product/test-planner/tests/full-ci-readiness-dispatch.test.mjs product/test-planner/tests/workflow-jobs.test.mjs
          git commit -m "Gate Full CI on explicit merge readiness"
          git push origin "$TARGET_BRANCH"
