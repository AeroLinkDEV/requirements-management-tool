name: Temporary #561 cadence patcher

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  prepare-cadence-branch:
    if: >-
      github.event.issue.number == 561 &&
      github.event.comment.user.login == 'seanmccarthyns' &&
      github.event.comment.body == '/prepare-561-cadence'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Patch the exact Full-CI trigger and remove this helper
        shell: bash
        env:
          TARGET_BRANCH: chatgpt/561-cadence-switch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          if git ls-remote --exit-code --heads origin "refs/heads/$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "Target branch already exists; refusing to overwrite it." >&2
            exit 1
          fi

          git checkout -b "$TARGET_BRANCH"

          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')
          needle = 'on:\n  pull_request:\n'
          if text.count(needle) != 1:
              raise SystemExit(f'expected exactly one automatic PR trigger header, found {text.count(needle)}')
          path.write_text(text.replace(needle, 'on:\n', 1), encoding='utf-8')
          PY

          if grep -q '^  pull_request:$' .github/workflows/ci.yml; then
            echo "Automatic pull_request trigger still present after bounded edit." >&2
            exit 1
          fi

          git rm .github/workflows/temporary-561-cadence-patcher.yml
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git commit -m "Gate Full CI on explicit merge readiness"
          git push origin "$TARGET_BRANCH"
