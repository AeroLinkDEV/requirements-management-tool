name: "Temporary #561 cadence patcher"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-cadence-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare and validate bounded cadence output
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          python .github/scripts/prepare-561-cadence.py

          if grep -q '^  pull_request:$' .github/workflows/ci.yml; then
            echo "Automatic pull_request trigger still present after bounded edit." >&2
            exit 1
          fi
          grep -q '^  workflow_dispatch:$' .github/workflows/ci.yml
          grep -Fq "inputs.pull_request_number != ''" .github/workflows/ci.yml
          grep -Fq "inputs.pull_request_number == '' && inputs.full_diagnostics == true" .github/workflows/ci.yml
          grep -Fq 'effective_event=' .github/workflows/ci.yml
          grep -Fq 'name: Full Product evidence aggregate' .github/workflows/ci.yml
          grep -Fq 'Report what this run validated' .github/workflows/request-full-ci.yml
          grep -Fq 'Full Product evidence aggregate' .github/workflows/request-full-ci.yml
          grep -q '^  pull_request:$' .github/workflows/fast-pr-feedback.yml
          grep -q '^  pull_request_target:$' .github/workflows/reset-full-ci-readiness.yml
          test ! -e .github/workflows/full-ci-required-check.yml
          grep -q 'ready-for-full-ci' product/docs/MERGING.md
          grep -q 'Merge-ready Full-CI cadence' product/docs/BROWSER_AND_BACKEND_FEEDBACK_TIME.md
          grep -q 'Merge-ready Full CI' product/test-planner/README.md
          node --test product/test-planner/tests/full-ci-readiness-dispatch.test.mjs

          git rm .github/workflows/temporary-561-cadence-patcher.yml
          git rm .github/scripts/prepare-561-cadence.py
          git diff --check

          output="$RUNNER_TEMP/aerolink-561-cadence-v4"
          mkdir -p "$output"
          cp .github/workflows/ci.yml "$output/ci.yml"
          cp product/docs/MERGING.md "$output/MERGING.md"
          cp product/docs/BROWSER_AND_BACKEND_FEEDBACK_TIME.md "$output/BROWSER_AND_BACKEND_FEEDBACK_TIME.md"
          cp product/test-planner/README.md "$output/test-planner-README.md"
          cp product/test-planner/lib/workflow-jobs.mjs "$output/workflow-jobs.mjs"
          cp product/test-planner/tests/full-ci-readiness-dispatch.test.mjs "$output/full-ci-readiness-dispatch.test.mjs"
          printf '%s\n' "$GITHUB_SHA" > "$output/base-sha.txt"
          git diff --name-status > "$output/name-status.txt"
          git diff -- .github/workflows/ci.yml product/docs/MERGING.md product/docs/BROWSER_AND_BACKEND_FEEDBACK_TIME.md product/test-planner/README.md product/test-planner/lib/workflow-jobs.mjs product/test-planner/tests/full-ci-readiness-dispatch.test.mjs > "$output/cadence.patch"

      - name: Upload exact-main validated cadence artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aerolink-561-cadence-v4-${{ github.sha }}
          path: ${{ runner.temp }}/aerolink-561-cadence-v4
          if-no-files-found: error
          retention-days: 7
