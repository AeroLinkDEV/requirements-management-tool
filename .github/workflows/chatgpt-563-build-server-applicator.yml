name: Temporary ChatGPT #563 build-server applicator

on:
  push:
    branches:
      - chatgpt/563-disable-persistent-build-servers

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply bounded harness correction
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          root = Path('.')

          script = root / 'product/tools/measure-api-host-reuse.ps1'
          data = script.read_bytes()
          replacements = {
              b"@('test', $project, '--configuration', 'Release', '--no-build', '--list-tests')": b"@('test', $project, '--configuration', 'Release', '--no-build', '--disable-build-servers', '--list-tests')",
              b"$arguments = @('test', $project, '--configuration', 'Release', '--no-build', '--filter', $Filter,": b"$arguments = @('test', $project, '--configuration', 'Release', '--no-build', '--disable-build-servers', '--filter', $Filter,",
              b"@('restore', (Join-Path $condition[1] $SolutionPath))": b"@('restore', (Join-Path $condition[1] $SolutionPath), '--disable-build-servers')",
              b"@('build', (Join-Path $condition[1] $SolutionPath), '--configuration', 'Release', '--no-restore')": b"@('build', (Join-Path $condition[1] $SolutionPath), '--configuration', 'Release', '--no-restore', '--disable-build-servers')",
          }
          for old, new in replacements.items():
              count = data.count(old)
              if count != 1:
                  raise SystemExit(f'expected one script replacement, found {count}: {old!r}')
              data = data.replace(old, new)
          script.write_bytes(data)

          contract = root / 'product/test-contracts/tests/api-host-reuse-measurement.test.mjs'
          data = contract.read_bytes()
          newline = b'\r\n' if b'\r\n' in data else b'\n'
          anchor = b"  assert.match(source, /Run mode always restores and builds/)" + newline
          insertion = newline.join([
              b"  assert.match(source, /Run mode always restores and builds/)",
              b"  assert.match(source, /Arguments @\\('restore', \\(Join-Path \\$condition\\[1\\] \\$SolutionPath\\), '--disable-build-servers'\\)/)",
              b"  assert.match(source, /Arguments @\\('build', \\(Join-Path \\$condition\\[1\\] \\$SolutionPath\\), '--configuration', 'Release', '--no-restore', '--disable-build-servers'\\)/)",
              b"  assert.match(source, /Arguments @\\('test', \\$project, '--configuration', 'Release', '--no-build', '--disable-build-servers', '--list-tests'\\)/)",
              b"  assert.match(source, /\\$arguments = @\\('test', \\$project, '--configuration', 'Release', '--no-build', '--disable-build-servers', '--filter'/)",
              b"",
          ])
          if data.count(anchor) != 1:
              raise SystemExit('contract assertion anchor was not unique')
          data = data.replace(anchor, insertion)
          old = b"spawnSync('dotnet', ['build', 'product/AeroLink.slnx', '--configuration', 'Release', '--nologo'], {"
          new = b"spawnSync('dotnet', ['build', 'product/AeroLink.slnx', '--configuration', 'Release', '--nologo', '--disable-build-servers'], {"
          if data.count(old) != 1:
              raise SystemExit('contract fixture build anchor was not unique')
          data = data.replace(old, new)
          contract.write_bytes(data)

          documentation = root / 'product/docs/API_HOST_REUSE_MEASUREMENT.md'
          data = documentation.read_bytes()
          newline = b'\r\n' if b'\r\n' in data else b'\n'
          old = newline.join([
              b"at distinct SHAs, rejects `-TestListPath`, rejects `-SkipBuild`, and refuses a non-empty output directory. It restores",
              b"and builds each exact clean SHA before live test discovery and partition generation, then saves `plan.json` and",
              b"`plan.md` before any measured shard starts; those files describe the freshly built execution that will follow.",
              b"",
          ])
          new = newline.join([
              b"at distinct SHAs, rejects `-TestListPath`, rejects `-SkipBuild`, and refuses a non-empty output directory. It restores",
              b"and builds each exact clean SHA before live test discovery and partition generation, then saves `plan.json` and",
              b"`plan.md` before any measured shard starts; those files describe the freshly built execution that will follow.",
              b"",
              b"Every benchmark-owned `dotnet restore`, `dotnet build`, and `dotnet test` invocation includes",
              b"`--disable-build-servers`. Persistent MSBuild or compiler servers must not outlive the Job Object root, create",
              b"false cleanup failures, or leak warm build-server state from one paired condition into the other.",
              b"",
          ])
          if data.count(old) != 1:
              raise SystemExit('documentation anchor was not unique')
          documentation.write_bytes(data.replace(old, new))
          '@ | python -

      - name: Run the Windows harness contracts
        shell: pwsh
        env:
          PWSH_EXE: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --check product/test-contracts/tests/api-host-reuse-measurement.test.mjs
          node --test product/test-contracts/tests/api-host-reuse-measurement.test.mjs

      - name: Commit only the focused correction
        shell: pwsh
        env:
          BRANCH: chatgpt/563-disable-persistent-build-servers
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -LiteralPath '.github/workflows/chatgpt-563-build-server-applicator.yml' -Force
          git diff --check
          $allowed = @(
            '.github/workflows/chatgpt-563-build-server-applicator.yml',
            'product/docs/API_HOST_REUSE_MEASUREMENT.md',
            'product/test-contracts/tests/api-host-reuse-measurement.test.mjs',
            'product/tools/measure-api-host-reuse.ps1'
          ) | Sort-Object
          $changed = @(git status --short | ForEach-Object { $_.Substring(3) } | Sort-Object)
          if (Compare-Object $allowed $changed) {
            throw "Unexpected final changed paths:`n$($changed -join "`n")"
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Disable persistent build servers in host-reuse measurements'
          git push origin "HEAD:$env:BRANCH"
