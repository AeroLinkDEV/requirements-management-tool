name: Product quality gate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      full_diagnostics:
        description: Run the complete three-shard diagnostic gate
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changed product areas
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      backend: ${{ steps.classify.outputs.backend }}
      client: ${{ steps.classify.outputs.client }}
      browser: ${{ steps.classify.outputs.browser }}
      postgresql: ${{ steps.classify.outputs.postgresql }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Classify paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" || "$EVENT_NAME" == "push" ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "client=true" >> "$GITHUB_OUTPUT"
            echo "browser=true" >> "$GITHUB_OUTPUT"
            echo "postgresql=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          echo "$files"
          product_files="$(printf '%s\n' "$files" | grep -Ev '(^|/)(docs?|design|showcase)/|\.md$' || true)"
          backend=false
          client=false
          browser=false
          postgresql=false
          docs_only=true
          [[ -n "$product_files" ]] && docs_only=false
          printf '%s\n' "$files" | grep -Eq '^product/(src|tests)/|^product/.*\.(cs|csproj|slnx|props|targets)$' && backend=true || true
          printf '%s\n' "$files" | grep -Eq '^product/client/' && client=true || true
          printf '%s\n' "$files" | grep -Eq '^product/(client|src/AeroLink.Api|src/AeroLink.Domain|src/AeroLink.Infrastructure)/|^\.github/workflows/ci\.yml$' && browser=true || true
          printf '%s\n' "$files" | grep -Eqi '^product/(src/AeroLink.Api|src/AeroLink.Infrastructure|tests)/.*(migration|database|identity|auth|bootstrap|postgres)|^product/src/AeroLink.Infrastructure/Migrations/|^\.github/workflows/ci\.yml$' && postgresql=true || true
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "client=$client" >> "$GITHUB_OUTPUT"
          echo "browser=$browser" >> "$GITHUB_OUTPUT"
          echo "postgresql=$postgresql" >> "$GITHUB_OUTPUT"

  validate:
    name: Build, test, and exercise product journeys
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install .NET 10
        if: needs.changes.outputs.backend == 'true'
        uses: actions/setup-dotnet@c2fa09f # v5.2.0
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        if: needs.changes.outputs.backend == 'true'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('product/**/*.csproj', 'product/**/*.props', 'product/**/*.targets') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore, build, and test backend
        if: needs.changes.outputs.backend == 'true'
        run: |
          dotnet restore product/AeroLink.slnx
          dotnet build product/AeroLink.slnx --configuration Release --no-restore
          dotnet test product/AeroLink.slnx --configuration Release --no-build --logger "console;verbosity=normal"
      - name: Install Node.js
        if: needs.changes.outputs.client == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: product/client/package-lock.json
      - name: Lint, type-check, and build client
        if: needs.changes.outputs.client == 'true'
        working-directory: product/client
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build

  browser-pr:
    name: Browser journeys (${{ matrix.shard }}/2)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.browser == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install .NET 10
        uses: actions/setup-dotnet@c2fa09f # v5.2.0
        with:
          dotnet-version: 10.0.x
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: product/client/package-lock.json
      - name: Cache NuGet packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/\.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('product/**/*.csproj', 'product/**/*.props', 'product/**/*.targets') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore and build browser API
        run: |
          dotnet restore product/src/AeroLink.Api/AeroLink.Api.csproj
          dotnet build product/src/AeroLink.Api/AeroLink.Api.csproj --configuration Release --no-restore
      - name: Install client and Chromium
        working-directory: product/client
        run: |
          npm ci
          npx playwright install chromium
      - name: Run browser journey shard
        working-directory: product/client
        env:
          AEROLINK_E2E_SKIP_BUILD: "true"
        run: npx playwright test --shard=${{ matrix.shard }}/2
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-diagnostics-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            product/client/playwright-report
            product/client/test-results
          if-no-files-found: ignore
          retention-days: 7

  browser-full:
    name: Full browser journeys (${{ matrix.shard }}/3)
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.browser == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install .NET 10
        uses: actions/setup-dotnet@c2fa09f # v5.2.0
        with:
          dotnet-version: 10.0.x
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: product/client/package-lock.json
      - name: Restore, build, and install browser dependencies
        working-directory: product/client
        run: |
          dotnet restore ../src/AeroLink.Api/AeroLink.Api.csproj
          dotnet build ../src/AeroLink.Api/AeroLink.Api.csproj --configuration Release --no-restore
          npm ci
          npx playwright install chromium
      - name: Run full browser shard
        working-directory: product/client
        env:
          AEROLINK_E2E_SKIP_BUILD: "true"
        run: npx playwright test --shard=${{ matrix.shard }}/3
      - name: Upload diagnostics and timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-full-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            product/client/playwright-report
            product/client/test-results/test-timings.json
          if-no-files-found: ignore
          retention-days: 14

  postgresql-smoke:
    name: PostgreSQL migrations and secure bootstrap
    needs: changes
    if: needs.changes.outputs.postgresql == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: aerolink_ci
          POSTGRES_USER: aerolink
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aerolink -d aerolink_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install .NET 10
        uses: actions/setup-dotnet@c2fa09f # v5.2.0
        with:
          dotnet-version: 10.0.x
      - name: Restore and build API
        run: |
          dotnet restore product/AeroLink.slnx
          dotnet build product/AeroLink.slnx --configuration Release --no-restore
      - name: Apply migrations and prove first-install identity path
        env:
          ASPNETCORE_ENVIRONMENT: Production
          Database__Provider: PostgreSql
          ConnectionStrings__AeroLink: Host=127.0.0.1;Port=5432;Database=aerolink_ci;Username=aerolink;Password=ci-only-password
          DemoData__Enabled: "false"
          Identity__SeedDemoAccounts: "false"
          Identity__CookieSecure: "false"
          Identity__BootstrapSecret: ci-only-bootstrap-secret-0123456789-abcdef
        run: |
          set -euo pipefail
          dotnet run --project product/src/AeroLink.Api --configuration Release --no-build --no-launch-profile --urls http://127.0.0.1:5080 > postgres-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:5080/health >/dev/null; then break; fi
            if ! kill -0 "$api_pid" 2>/dev/null; then cat postgres-api.log; exit 1; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5080/health | jq -e '.status == "healthy"'
          curl -fsS http://127.0.0.1:5080/api/setup/status | jq -e '.bootstrapRequired == true and .bootstrapEnabled == true'
          curl -fsS -X POST http://127.0.0.1:5080/api/setup/bootstrap \
            -H 'Content-Type: application/json' \
            -H 'X-AeroLink-Bootstrap-Secret: ci-only-bootstrap-secret-0123456789-abcdef' \
            -d '{"displayName":"CI Administrator","email":"ci-admin@example.invalid","password":"CiOnly!Administrator2026"}'
          curl -fsS http://127.0.0.1:5080/api/setup/status | jq -e '.bootstrapRequired == false and .bootstrapEnabled == false'
          curl -fsS -c cookies.txt -X POST http://127.0.0.1:5080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"userName":"admin","password":"CiOnly!Administrator2026"}' | jq -e '.userName == "admin" and .isAdministrator == true'
          curl -fsS -b cookies.txt http://127.0.0.1:5080/api/auth/me | jq -e '.userName == "admin" and .isAdministrator == true'
      - name: Upload PostgreSQL startup diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: postgresql-api-diagnostics-${{ github.run_attempt }}
          path: postgres-api.log
          if-no-files-found: ignore
          retention-days: 7
