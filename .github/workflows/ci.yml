name: Product quality gate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, not nightly. The nightly gate re-tested an unchanged tree every day and was the
    # single largest consumer of Actions minutes on this repository — more than every pull request
    # combined. Nothing drifts on a repo where each merge is already gated, so the schedule exists to
    # catch environment rot (a runner image change, a dependency yanked), which is a weekly concern.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      full_diagnostics:
        description: Run the complete three-shard diagnostic gate
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changed product areas
    runs-on: windows-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      backend: ${{ steps.classify.outputs.backend }}
      client: ${{ steps.classify.outputs.client }}
      browser: ${{ steps.classify.outputs.browser }}
      postgresql: ${{ steps.classify.outputs.postgresql }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" || "$EVENT_NAME" == "push" ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "client=true" >> "$GITHUB_OUTPUT"
            echo "browser=true" >> "$GITHUB_OUTPUT"
            echo "postgresql=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          echo "$files"
          product_files="$(printf '%s\n' "$files" | grep -Ev '(^|/)(docs?|design|showcase)/|\.md$' || true)"
          backend=false
          client=false
          browser=false
          postgresql=false
          docs_only=true
          [[ -n "$product_files" ]] && docs_only=false
          printf '%s\n' "$files" | grep -Eq '^product/(src|tests)/|^product/.*\.(cs|csproj|slnx|props|targets)$' && backend=true || true
          printf '%s\n' "$files" | grep -Eq '^product/client/' && client=true || true
          printf '%s\n' "$files" | grep -Eq '^product/(client|src/AeroLink.Api|src/AeroLink.Domain|src/AeroLink.Infrastructure)/|^\.github/workflows/ci\.yml$' && browser=true || true
          # Keyed on persistence as well as the migration/identity keywords. A change to an EF query needs
          # the real provider even when no schema moves: translation is not portable, and the SQLite path
          # every other gate runs on will happily accept an expression Npgsql cannot produce. The previous
          # pattern also pointed at AeroLink.Infrastructure/Migrations/, which does not exist — migrations
          # live under Persistence/Migrations/ — so that alternative had never matched a file.
          printf '%s\n' "$files" | grep -Eqi '^product/(src/AeroLink.Api|src/AeroLink.Infrastructure|tests)/.*(migration|database|identity|auth|bootstrap|postgres|persistence)|^product/src/AeroLink.Infrastructure/Persistence/Migrations/|^\.github/workflows/ci\.yml$' && postgresql=true || true
          # A change that is neither documentation nor recognised product code used to select nothing: the gate
          # ran, every step skipped on its condition, and the job reported success having executed no test at
          # all. A launcher script, a root configuration file or a new top-level directory all landed there.
          #
          # Anything unclassified now runs the full backend and client validation rather than nothing. Being
          # slower on a file nobody anticipated is the right trade against a green tick that means nothing, and
          # the guard in the validate job below makes the same rule machine-checkable rather than a convention.
          if [[ "$docs_only" == "false" && "$backend" == "false" && "$client" == "false" ]]; then
            echo "Unclassified product change; running full validation rather than reporting a skipped pass."
            backend=true
            client=true
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "client=$client" >> "$GITHUB_OUTPUT"
          echo "browser=$browser" >> "$GITHUB_OUTPUT"
          echo "postgresql=$postgresql" >> "$GITHUB_OUTPUT"

  # Warms the Chromium cache on main, and exists only because of how GitHub scopes caches.
  #
  # A cache written by a pull request is visible to that pull request and nothing else. A cache written on the
  # default branch is visible to every pull request. The browser jobs run only on pull requests, so without this
  # the entry they save is scoped to the branch that saved it, no run on main ever writes one, and every new
  # pull request misses forever — a cache that looks present, reports itself saved, and never once gets read.
  #
  # So one small job on main does nothing but download the browser under the shared key. It gates nothing and
  # blocks nothing; if it fails the browser jobs simply download Chromium as they did before.
  warm-chromium-cache:
    name: Warm the Chromium cache
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Chromium
        id: chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('product/client/package-lock.json') }}
      - name: Install Node.js
        if: steps.chromium.outputs.cache-hit != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: product/client/package-lock.json
      # Only the browser binary is cached. There is no dependency install on Windows — `--with-deps` installs
      # apt packages and has no Windows equivalent.
      - name: Download Chromium
        if: steps.chromium.outputs.cache-hit != 'true'
        working-directory: product/client
        run: |
          npm ci
          npx playwright install chromium

  # Every gate in this workflow runs on Windows, because Windows is the only platform this product is installed,
  # run, demonstrated and debugged on. A Linux gate proves something about a configuration nobody ships, and it
  # actively misleads: the connection-lifetime defect fixed in #173 was visible only as a locked SQLite file on
  # Windows, and the identical bug produced a green Linux suite. Windows refuses to delete or overwrite an open
  # file where Linux allows it, and the evidence store, backup, restore drill and integrity scan all walk the
  # file system. Path length, separators and case-insensitivity sit in the same category.
  #
  # Windows minutes bill at roughly twice Linux and the runners are slower to provision. That is the price of
  # testing what is actually shipped, and it is a better trade than paying less for evidence about a platform
  # that will never be used.
  validate:
    name: Build, test, and exercise product journeys
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install .NET 10
        if: needs.changes.outputs.backend == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v5.2.0
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        if: needs.changes.outputs.backend == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('product/**/*.csproj', 'product/**/*.props', 'product/**/*.targets') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore, build, and test backend
        if: needs.changes.outputs.backend == 'true'
        run: |
          dotnet restore product/AeroLink.slnx
          dotnet build product/AeroLink.slnx --configuration Release --no-restore
          dotnet test product/AeroLink.slnx --configuration Release --no-build --logger "console;verbosity=normal"
      - name: Install Node.js
        if: needs.changes.outputs.client == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: product/client/package-lock.json
      - name: Lint, type-check, and build client
        if: needs.changes.outputs.client == 'true'
        working-directory: product/client
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build

      - name: Validate the non-mutating backup schedule contract
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $preview = & ./product/scripts/Configure-AeroLinkBackupSchedule.ps1 -Action Preview -DailyAt 02:00 -RetentionDays 30
          if ($preview.Schedule -ne 'Daily' -or $preview.DailyAt -ne '02:00' -or $preview.RetentionDays -ne 30) {
            throw 'The default daily backup schedule contract changed unexpectedly.'
          }
          if (-not (Test-Path -LiteralPath $preview.Runner -PathType Leaf)) {
            throw 'The scheduled backup runner does not resolve to a file.'
          }
          if ($preview.Arguments -notlike '*Invoke-AeroLinkScheduledBackup.ps1*' -or $preview.Arguments -notlike '*-RetentionDays 30*') {
            throw 'The scheduled task no longer invokes the verified backup runner with retention.'
          }

      - name: Validate the migration-posture diagnostics contract
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ./product/scripts/AeroLinkMigrationPosture.Tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Migration-posture diagnostics regression failed.' }

      - name: Validate the remote-demo operator contract
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ./product/scripts/AeroLinkRemoteDemo.Tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Remote-demo operator regression failed.' }

      # This job is a required gate, so it must never pass without having proved something. Every step above is
      # conditional, and a combination of conditions that skipped all of them still reported success — a green
      # tick that had run no test, no build and no type-check. The classifier now avoids selecting nothing, and
      # this refuses to be the evidence for a change it did not examine even if that ever regresses.
      - name: Refuse a pass that validated nothing
        if: needs.changes.outputs.backend != 'true' && needs.changes.outputs.client != 'true'
        run: |
          echo "::error::This gate ran no backend tests and no client validation, so its result is not evidence."
          echo "Classify the changed paths in the changes job, or mark the change as documentation-only."
          exit 1

  browser-pr:
    name: Browser journeys (${{ matrix.shard }}/2)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.browser == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v5.2.0
        with:
          dotnet-version: 10.0.x
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: product/client/package-lock.json
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('product/**/*.csproj', 'product/**/*.props', 'product/**/*.targets') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore and build browser API
        run: |
          dotnet restore product/src/AeroLink.Api/AeroLink.Api.csproj
          dotnet build product/src/AeroLink.Api/AeroLink.Api.csproj --configuration Release --no-restore
      # Chromium was re-downloaded by every browser job on every run — three times per pull request, for a
      # binary that only changes when Playwright does. Keyed on the lockfile because that is what pins the
      # Playwright version; an unrelated dependency bump invalidates it needlessly, which costs one download
      # and is the safe direction. A stale browser cannot pass silently: Playwright refuses to start a browser
      # build its client library does not expect.
      - name: Cache Chromium
        id: chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('product/client/package-lock.json') }}
      - name: Install client and Chromium
        working-directory: product/client
        run: |
          npm ci
          # No dependency install: `--with-deps` and `install-deps` install apt packages and do not apply on
          # Windows. The cache holds the browser binary, which is the whole of what is needed here.
          npx playwright install chromium
      - name: Run browser journey shard
        working-directory: product/client
        env:
          AEROLINK_E2E_SKIP_BUILD: "true"
        run: npx playwright test --shard=${{ matrix.shard }}/2
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-diagnostics-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            product/client/playwright-report
            product/client/test-results
          if-no-files-found: ignore
          retention-days: 7

  # The journeys against the artifact a demonstration or a deployment actually serves: the built client, hosted
  # by the API on one origin. Every other gate serves the client with `vite dev`, which meant the production
  # bundle was compiled on every pull request and never once rendered in a browser. `vite dev` hands over
  # unbundled modules and injects each stylesheet when its module evaluates; a build chunks, extracts, hashes
  # and minifies. Its first run found two design-contract defects and one blocked webfont.
  #
  # On pull requests, because it is the environment the demonstration depends on and it costs one build. Not on
  # push: a squash merge of a green pull request puts an identical tree on main, which is the same reason
  # browser-full skips push.
  browser-production:
    name: Browser journeys on the production build
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.browser == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v5.2.0
        with:
          dotnet-version: 10.0.x
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: product/client/package-lock.json
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('product/**/*.csproj', 'product/**/*.props', 'product/**/*.targets') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore and build the API
        run: |
          dotnet restore product/src/AeroLink.Api/AeroLink.Api.csproj
          dotnet build product/src/AeroLink.Api/AeroLink.Api.csproj --configuration Release --no-restore
      # Shares the cache entry the pull request shards populate: same key, same runner, same browser.
      - name: Cache Chromium
        id: chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('product/client/package-lock.json') }}
      - name: Install client and Chromium
        working-directory: product/client
        run: |
          npm ci
          # `--with-deps` installs apt packages and does not apply on Windows; the cached browser binary is all
          # that is needed.
          npx playwright install chromium
      - name: Build the client and run the production journeys
        working-directory: product/client
        env:
          AEROLINK_E2E_SKIP_BUILD: "true"
        run: npm run test:production
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-production-${{ github.run_attempt }}
          path: |
            product/client/playwright-report-production
            product/client/test-results-production
          if-no-files-found: ignore
          retention-days: 7

  browser-full:
    name: Full browser journeys (${{ matrix.shard }}/3)
    needs: changes
    # Schedule and manual dispatch only. A squash merge of a green pull request puts a tree on main that
    # is identical to the one browser-pr tested minutes earlier, so re-running the journeys on push buys
    # no information. validate and postgresql-smoke still run on every push as the safety net.
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.browser == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v5.2.0
        with:
          dotnet-version: 10.0.x
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: product/client/package-lock.json
      # The weekly run reuses whatever the week's pull requests left behind. On a quiet week the entry has been
      # evicted and this pays the download once, which is the point of a weekly environment-rot check anyway.
      - name: Cache Chromium
        id: chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('product/client/package-lock.json') }}
      - name: Restore, build, and install browser dependencies
        working-directory: product/client
        run: |
          dotnet restore ../src/AeroLink.Api/AeroLink.Api.csproj
          dotnet build ../src/AeroLink.Api/AeroLink.Api.csproj --configuration Release --no-restore
          npm ci
          # `--with-deps` installs apt packages and does not apply on Windows; the cached browser binary is all
          # that is needed.
          npx playwright install chromium
      - name: Run full browser shard
        working-directory: product/client
        env:
          AEROLINK_E2E_SKIP_BUILD: "true"
        run: npx playwright test --shard=${{ matrix.shard }}/3
      - name: Upload diagnostics and timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-full-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            product/client/playwright-report
  postgresql-smoke:
    name: PostgreSQL migrations and secure bootstrap
    needs: changes
    if: needs.changes.outputs.postgresql == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: aerolink_ci
          POSTGRES_USER: aerolink
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aerolink -d aerolink_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v5.2.0
        with:
          dotnet-version: 10.0.x
      - name: Restore and build API
        run: |
          dotnet restore product/AeroLink.slnx
          dotnet build product/AeroLink.slnx --configuration Release --no-restore
      - name: Apply migrations and prove first-install and identity administration paths
        env:
          ASPNETCORE_ENVIRONMENT: Production
          Database__Provider: PostgreSql
          ConnectionStrings__AeroLink: Host=127.0.0.1;Port=5432;Database=aerolink_ci;Username=aerolink;Password=ci-only-password
          DemoData__Enabled: "false"
          Identity__SeedDemoAccounts: "false"
          Identity__CookieSecure: "false"
          Identity__BootstrapSecret: ci-only-bootstrap-secret-0123456789-abcdef
          PGPASSWORD: ci-only-password
        run: |
          set -euo pipefail
          dotnet run --project product/src/AeroLink.Api --configuration Release --no-build --no-launch-profile --urls http://127.0.0.1:5080 > postgres-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:5080/health >/dev/null; then break; fi
            if ! kill -0 "$api_pid" 2>/dev/null; then cat postgres-api.log; exit 1; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5080/health | jq -e '.status == "healthy"'
          curl -fsS http://127.0.0.1:5080/api/setup/status | jq -e '.bootstrapRequired == true and .bootstrapEnabled == true'
          curl -fsS -X POST http://127.0.0.1:5080/api/setup/bootstrap \
            -H 'Content-Type: application/json' \
            -H 'X-AeroLink-Bootstrap-Secret: ci-only-bootstrap-secret-0123456789-abcdef' \
            -d '{"displayName":"CI Administrator","email":"ci-admin@example.invalid","password":"CiOnly!Administrator2026"}'
          curl -fsS http://127.0.0.1:5080/api/setup/status | jq -e '.bootstrapRequired == false and .bootstrapEnabled == false'
          curl -fsS -c cookies.txt -X POST http://127.0.0.1:5080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"userName":"admin","password":"CiOnly!Administrator2026"}' | jq -e '.userName == "admin" and .isAdministrator == true'
          curl -fsS -b cookies.txt http://127.0.0.1:5080/api/auth/me | jq -e '.userName == "admin" and .isAdministrator == true'

          # A migration that Entity Framework never discovers still leaves a green boot and login, so the
          # tables each migration is responsible for creating are exercised through the API here.
          curl -fsS -b cookies.txt -X POST http://127.0.0.1:5080/api/admin/external-identity/providers \
            -H 'Content-Type: application/json' \
            -d '{"key":"ci-entra","displayName":"CI Entra","protocol":"OpenIdConnect","issuer":"https://Login.CI.Example/tenant/","subjectClaim":"sub","groupClaim":"groups"}' \
            > provider.json
          jq -e '.enabled == true and .issuer == "https://login.ci.example/tenant"' provider.json
          provider_id=$(jq -er '.id' provider.json)
          curl -fsS -b cookies.txt http://127.0.0.1:5080/api/admin/external-identity/providers | jq -e 'length == 1'
          # The same trust anchor in an equivalent form must be refused by the unique issuer index.
          conflict=$(curl -s -o /dev/null -w '%{http_code}' -b cookies.txt -X POST http://127.0.0.1:5080/api/admin/external-identity/providers \
            -H 'Content-Type: application/json' \
            -d '{"key":"ci-entra-two","displayName":"CI Duplicate","protocol":"OpenIdConnect","issuer":"HTTPS://LOGIN.CI.EXAMPLE:443/tenant","subjectClaim":"sub","groupClaim":"groups"}')
          test "$conflict" = "409" || { echo "expected 409 for a duplicate trust anchor, got $conflict"; exit 1; }
          # -q suppresses the "INSERT 0 1" command tag, which would otherwise be captured alongside the
          # returned identifier and produce a malformed request body. head -n1 keeps that true regardless
          # of psql client version.
          program_id=$(psql -h 127.0.0.1 -U aerolink -d aerolink_ci -qtAc \
            "insert into programs (\"Id\",\"Name\",\"Code\") values (gen_random_uuid(),'CI Program','CIP') returning \"Id\";" \
            | head -n1)
          curl -fsS -b cookies.txt -X POST http://127.0.0.1:5080/api/admin/external-identity/mappings \
            -H 'Content-Type: application/json' \
            -d "{\"providerId\":\"$provider_id\",\"externalGroup\":\"CI-Approvers\",\"programId\":\"$program_id\",\"role\":\"Approver\"}" \
            | jq -e '.externalGroup == "ci-approvers"'
          curl -fsS -b cookies.txt -X POST http://127.0.0.1:5080/api/admin/external-identity/resolve \
            -H 'Content-Type: application/json' \
            -d "{\"providerId\":\"$provider_id\",\"issuer\":\"https://login.ci.example/tenant\",\"externalGroups\":[\"CI-APPROVERS\"],\"programId\":\"$program_id\"}" \
            | jq -e '.roles == ["Approver"]'
          # Fail-closed: a look-alike issuer grants nothing.
          curl -fsS -b cookies.txt -X POST http://127.0.0.1:5080/api/admin/external-identity/resolve \
            -H 'Content-Type: application/json' \
            -d "{\"providerId\":\"$provider_id\",\"issuer\":\"https://login.ci.example.attacker.test/tenant\",\"externalGroups\":[\"CI-APPROVERS\"],\"programId\":\"$program_id\"}" \
            | jq -e '.roles == []'
          psql -h 127.0.0.1 -U aerolink -d aerolink_ci -qtAc \
            "select count(*) from security_audit_events where \"EventType\" like 'External%' and \"Outcome\" = 'Success';" \
            | { read -r count; test "$count" -ge 3 || { echo "expected identity audit evidence, found $count"; exit 1; }; }
      - name: Upload PostgreSQL startup diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgresql-api-diagnostics-${{ github.run_attempt }}
          path: postgres-api.log
          if-no-files-found: ignore
          retention-days: 7
  # What a green tick on this run actually means.
  #
  # Every job above is conditional, and a skipped job is not a failed one — so a run whose journeys never ran
  # reports success exactly like a run where they all passed. That is how a commit landed on main with every
  # browser journey skipped and a green tick beside it, and why "CI is green" could not be used as evidence
  # without opening the run and reading which jobs had actually executed.
  #
  # This job always runs, fails if anything it waited on failed, and writes down what was and was not
  # validated. It is the one check worth requiring for a merge: it cannot be skipped into a pass, and its
  # summary says in words what the tick is claiming.
  gate:
    name: Report what this run validated
    if: always()
    needs: [changes, validate, browser-pr, browser-production, postgresql-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarise and enforce
        env:
          VALIDATE: ${{ needs.validate.result }}
          BROWSER: ${{ needs.browser-pr.result }}
          PRODUCTION: ${{ needs.browser-production.result }}
          POSTGRESQL: ${{ needs.postgresql-smoke.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: |
          set -euo pipefail
          describe() {
            case "$2" in
              success) echo "- **$1**: ran and passed" ;;
              failure) echo "- **$1**: FAILED" ;;
              cancelled) echo "- **$1**: cancelled" ;;
              *) echo "- **$1**: did not run" ;;
            esac
          }
          {
            echo "## What this run validated"
            echo
            describe "Backend suites and client validation" "$VALIDATE"
            describe "Browser journeys" "$BROWSER"
            describe "Browser journeys on the production build" "$PRODUCTION"
            describe "PostgreSQL migrations and secure bootstrap" "$POSTGRESQL"
            echo
            if [ "$DOCS_ONLY" = "true" ]; then
              echo "Classified as a documentation-only change, so no product gate ran. This tick is not evidence about the product."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # A skipped job is deliberate and allowed; a failed one is not. Reading each result explicitly rather
          # than relying on this job's own dependency behaviour, which treats a skipped dependency as a reason
          # to skip and would take this reporter down with it.
          failed=""
          for pair in "validate:$VALIDATE" "browser-pr:$BROWSER" "browser-production:$PRODUCTION" "postgresql-smoke:$POSTGRESQL"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            case "$result" in
              failure|cancelled) failed="$failed $name" ;;
            esac
          done
          if [ -n "$failed" ]; then
            echo "::error::These gates did not pass:$failed"
            exit 1
          fi
