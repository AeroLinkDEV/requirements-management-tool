name: Product quality gate

on:
  # A merge queue validates each candidate against the exact tree it will land on, including whatever is
  # queued ahead of it. That is what strict branch protection reaches for and cannot deliver: "up to date at
  # some point" is not "tested against what it becomes". Without this trigger the queue enqueues, waits for
  # required checks that never start, and times out — so the trigger and the setting have to arrive together.
  merge_group:
  push:
    branches: [main]
  schedule:
    # Weekly, not nightly. The nightly gate re-tested an unchanged tree every day and was the
    # single largest consumer of Actions minutes on this repository — more than every pull request
    # combined. Nothing drifts on a repo where each merge is already gated, so the schedule exists to
    # catch environment rot (a runner image change, a dependency yanked), which is a weekly concern.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      full_diagnostics:
        description: Run the complete three-shard diagnostic gate
        required: false
        default: true
        type: boolean
      pull_request_number:
        description: Trusted ready-for-full-ci pull request number; leave blank for manual diagnostics
        required: false
        default: ''
        type: string
      pull_request_base_sha:
        description: Trusted ready-for-full-ci base SHA
        required: false
        default: ''
        type: string
      pull_request_head_sha:
        description: Trusted ready-for-full-ci exact head SHA
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

# A pull request groups by its number, so a new push cancels the run it supersedes. Everything else groups by
# ref — and a merge-queue entry's ref is its own `gh-readonly-queue/...` branch, unique per candidate. Queue
# entries therefore cannot cancel each other, and a pull request's own run cannot cancel its queue run. That
# matters more than it looks: a queue whose runs cancel one another does not fail, it deadlocks.
concurrency:
  group: quality-${{ inputs.pull_request_number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changed product areas
    runs-on: windows-latest
    env:
      METRICS_JOB_ID: changes
      METRICS_JOB_NAME: Classify changed product areas
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      backend: ${{ steps.classify.outputs.backend }}
      client: ${{ steps.classify.outputs.client }}
      browser: ${{ steps.classify.outputs.browser }}
      postgresql: ${{ steps.classify.outputs.postgresql }}
      launchers_only: ${{ steps.classify.outputs.launchers_only }}
      planner_version: ${{ steps.classify.outputs.planner_version }}
      planner_hash: ${{ steps.classify.outputs.planner_hash }}
      planner_unknown_paths: ${{ steps.classify.outputs.planner_unknown_paths }}
      planner_reason: ${{ steps.classify.outputs.planner_reason }}
      planner_selected_jobs: ${{ steps.classify.outputs.planner_selected_jobs }}
      planner_skipped_jobs: ${{ steps.classify.outputs.planner_skipped_jobs }}
      planner_decisions: ${{ steps.classify.outputs.planner_decisions }}
      post_merge_skip: ${{ steps.provenance.outputs.can_skip }}
      provenance_outcome: ${{ steps.provenance.outputs.outcome }}
    steps:
      - name: Capture job start
        continue-on-error: true
        shell: bash
        run: |
          echo "METRICS_TIMING_FILE=${{ runner.temp }}/ci-metrics/timing-changes.json" >> "$GITHUB_ENV"
          echo "METRICS_FRAGMENT_PATH=${{ runner.temp }}/ci-metrics/fragment-changes.json" >> "$GITHUB_ENV"
          mkdir -p "${{ runner.temp }}/ci-metrics"
          printf '{"name":"job-start","at":%s}\n' "$(date +%s%3N)" >> "${{ runner.temp }}/ci-metrics/timing-changes.json"
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve already-validated main tree
        id: provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          PROVENANCE_OUTPUT_DIR: ${{ runner.temp }}/provenance-preflight
          PROVENANCE_MODE: enforce
        run: node "${{ github.workspace }}/product/ci-metrics/bin/check-main-provenance.mjs"
      - name: Authenticate label-dispatched pull-request context
        if: github.event_name == 'workflow_dispatch' && inputs.pull_request_number != ''
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_PR_NUMBER: ${{ inputs.pull_request_number }}
          REQUESTED_BASE_SHA: ${{ inputs.pull_request_base_sha }}
          REQUESTED_HEAD_SHA: ${{ inputs.pull_request_head_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:REQUESTED_PR_NUMBER -notmatch '^[1-9][0-9]*$') { throw 'Invalid pull-request number.' }
          if ($env:REQUESTED_BASE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Invalid requested base SHA.' }
          if ($env:REQUESTED_HEAD_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Invalid requested head SHA.' }
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $pr = Invoke-RestMethod -Headers $headers -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/pulls/$env:REQUESTED_PR_NUMBER"
          if ($pr.state -ne 'open') { throw 'The requested pull request is not open.' }
          if ($pr.head.repo.full_name -ne $env:GITHUB_REPOSITORY) { throw 'Fork pull requests cannot request privileged Full validation.' }
          if ($pr.head.sha -ne $env:REQUESTED_HEAD_SHA -or $env:GITHUB_SHA -ne $env:REQUESTED_HEAD_SHA) { throw 'The requested Full run is not attached to the exact current PR head.' }
          if ($pr.base.sha -ne $env:REQUESTED_BASE_SHA) { throw 'The requested Full run does not match the current PR base.' }
          if ($env:GITHUB_REF -ne "refs/heads/$($pr.head.ref)") { throw 'Workflow dispatch ref does not match the PR head branch.' }
          if (-not @($pr.labels | ForEach-Object { $_.name }).Contains('ready-for-full-ci')) { throw 'ready-for-full-ci is no longer present on this pull request.' }
      - name: Mark setup complete
        continue-on-error: true
        run: node "${{ github.workspace }}/product/ci-metrics/bin/mark.mjs" setup-end
      - name: Classify paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ inputs.pull_request_number != '' && 'pull_request' || github.event_name }}
          BASE_SHA: ${{ inputs.pull_request_base_sha || github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ inputs.pull_request_head_sha || github.sha }}
        run: node "${{ github.workspace }}/product/test-planner/tools/classify-ci.mjs"
      - name: Mark test complete
        if: always()
        continue-on-error: true
        run: node "${{ github.workspace }}/product/ci-metrics/bin/mark.mjs" test-end
      - name: Write metrics fragment
        if: always()
        continue-on-error: true
        env:
          METRICS_JOB_RESULT: ${{ job.status }}
          METRICS_NEEDS: ""
          METRICS_CLASS_DOCS_ONLY: ${{ steps.classify.outputs.docs_only }}
          METRICS_CLASS_BACKEND: ${{ steps.classify.outputs.backend }}
          METRICS_CLASS_CLIENT: ${{ steps.classify.outputs.client }}
          METRICS_CLASS_BROWSER: ${{ steps.classify.outputs.browser }}
          METRICS_CLASS_POSTGRESQL: ${{ steps.classify.outputs.postgresql }}
        run: node "${{ github.workspace }}/product/ci-metrics/bin/write-fragment.mjs"
      - name: Upload metrics fragment
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-metrics-fragment-changes-${{ github.run_attempt }}
          path: ${{ env.METRICS_FRAGMENT_PATH }}
          if-no-files-found: ignore
          retention-days: 30

  # Warms the Chromium cache on main, and exists only because of how GitHub scopes caches.
  #
  # A cache written by a pull request is visible to that pull request and nothing else. A cache written on the
  # default branch is visible to every pull request. The browser jobs run only on pull requests, so without this
  # the entry they save is scoped to the branch that saved it, no run on main ever writes one, and every new
  # pull request misses forever — a cache that looks present, reports itself saved, and never once gets read.
  #
  # So one small job on main does nothing but download the browser under the shared key. It gates nothing and
  # blocks nothing; if it fails the browser jobs simply download Chromium as they did before.
  warm-chromium-cache:
    name: Warm the Chromium cache
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      METRICS_JOB_ID: warm-chromium-cache
      METRICS_JOB_NAME: Warm the Chromium cache
    steps:
      - name: Capture job start
        continue-on-error: true
        shell: bash
        run: |
          echo "METRICS_TIMING_FILE=${{ runner.temp }}/ci-metrics/timing-warm-chromium-cache.json" >> "$GITHUB_ENV"
          echo "METRICS_FRAGMENT_PATH=${{ runner.temp }}/ci-metrics/fragment-warm-chromium-cache.json" >> "$GITHUB_ENV"
          mkdir -p "${{ runner.temp }}/ci-metrics"
          printf '{"name":"job-start","at":%s}\n' "$(date +%s%3N)" >> "${{ runner.temp }}/ci-metrics/timing-warm-chromium-cache.json"
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Chromium
        id: chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('product/client/package-lock.json') }}
      - name: Install Node.js
        if: steps.chromium.outputs.cache-hit != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: product/client/package-lock.json
      # Only the browser binary is cached. There is no dependency install on Windows — `--with-deps` installs
      # apt packages and has no Windows equivalent.
      - name: Download Chromium
        if: steps.chromium.outputs.cache-hit != 'true'
        working-directory: product/client
        run: |
          npm ci
          npx playwright install chromium
      - name: Mark setup complete
        if: always()
        continue-on-error: true
        run: node "${{ github.workspace }}/product/ci-metrics/bin/mark.mjs" setup-end
      - name: Mark test complete
        if: always()
        continue-on-error: true
        run: node "${{ github.workspace }}/product/ci-metrics/bin/mark.mjs" test-end
      - name: Write metrics fragment
        if: always()
        continue-on-error: true
        env:
          METRICS_JOB_RESULT: ${{ job.status }}
          METRICS_NEEDS: ""
          METRICS_CACHE_CHROMIUM: ${{ steps.chromium.outputs.cache-hit }}
        run: node "${{ github.workspace }}/product/ci-metrics/bin/write-fragment.mjs"
      - name: Upload metrics fragment
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-metrics-fragment-warm-chromium-cache-${{ github.run_attempt }}
          path: ${{ env.METRICS_FRAGMENT_PATH }}
          if-no-files-found: ignore
          retention-days: 30

  # Every gate in this workflow runs on Windows, because Windows is the only platform this product is installed,
  # run, demonstrated and debugged on. A Linux gate proves something about a configuration nobody ships, and it
  # actively misleads: the connection-lifetime defect fixed in #173 was visible only as a locked SQLite file on
  # Windows, and the identical bug produced a green Linux suite. Windows refuses to delete or overwrite an open
  # file where Linux allows it, and the evidence store, backup, restore drill and integrity scan all walk the
  # file system. Path length, separators and case-insensitivity sit in the same category.
  #
  # Windows minutes bill at roughly twice Linux and the runners are slower to provision. That is the price of
  # testing what is actually shipped, and it is a better trade than paying less for evidence about a platform
  # that will never be used.
  # Four jobs where there was one. They used to run in series inside `validate`, so a pull request waited for
  # the sum of them: ~12 minutes of API tests, then ~3 of domain and infrastructure, then ~3 of client lint,
  # type-check and build, then the operator script contracts. Nothing about that order was necessary — no step
  # consumed a previous step's output — and the measured critical path for the whole gate was this job.
  #
  # Split, the gate waits for the slowest rather than the total. `AeroLink.Api.Tests` is ~12 minutes against
  # ~3 for the other two assemblies combined, so it gets a runner to itself and everything else finishes
  # underneath it. See BROWSER_AND_BACKEND_FEEDBACK_TIME.md for the measurements.
  #
  # Both backend jobs build the whole solution rather than only the projects under test. `dotnet test` builds
  # just the dependency graph it needs, which silently stops proving that the tools and product projects
  # outside that graph still compile — a green suite over code that no longer builds. The duplicated build is
  # the price of keeping "everything compiles" true in a world where the assemblies run apart.
  # Sharded across two runners because this one `dotnet test` is 89% of the critical path: 1328 of the job's
  # 1487 seconds, against 103 for the build and 49 for setup. Splitting `validate` did not touch it, and this
  # is the only remaining change with the arithmetic to matter.
  #
  # The runner has four cores and xunit parallelises to core count, so the suite runs at half the concurrency
  # it does on a developer machine — ~22 minutes on CI against ~12 locally. A second runner buys four more
  # cores, which is why this shortens the job where making the tests individually cheaper did not.
  backend-api:
    name: API test suite (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    if: needs.changes.outputs.post_merge_skip != 'true' && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.backend == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      METRICS_JOB_ID: backend-api
      METRICS_JOB_NAME: API test suite (${{ matrix.shard }}/${{ strategy.job-total }})
      METRICS_MATRIX: ${{ toJson(matrix) }}
    strategy:
      # Independently, for the same reason as the browser shards: a cancelled sibling reports nothing, and
      # buying that nothing costs a full gate to re-run.
      fail-fast: false
      matrix:
        # Three. Two took the suite from 1328s to 656/771s, at which point the browser journeys became the
        # critical path and a third shard here started paying for itself again. The count is read from
        # `strategy.job-total` everywhere below rather than written twice — a matrix that says three while a
        # divisor says two would silently run a third of the tests and pass.
        shard: [1, 2, 3]
    steps:
      - name: Capture job start
        continue-on-error: true
        shell: bash
        run: |
          echo "METRICS_TIMING_FILE=${{ runner.temp }}/ci-metrics/timing-backend-api-${{ matrix.shard }}.json" >> "$GITHUB_ENV"
          echo "METRICS_FRAGMENT_PATH=${{ runner.temp }}/ci-metrics/fragment-backend-api-${{ matrix.shard }}.json" >> "$GITHUB_ENV"
          mkdir -p "${{ runner.temp }}/ci-metrics"
          printf '{"name":"job-start","at":%s}\n' "$(date +%s%3N)" >> "${{ runner.temp }}/ci-metrics/timing-backend-api-${{ matrix.shard }}.json"
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v5.2.0
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        id: nuget
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('product/**/*.csproj', 'product/**/*.props', 'product/**/*.targets') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore and build the solution
        run: |
          dotnet restore product/AeroLink.slnx
          dotnet build product/AeroLink.slnx --configuration Release --no-restore
      - name: Mark setup complete
        continue-on-error: true
        run: node "${{ github.workspace }}/product/ci-metrics/bin/mark.mjs" setup-end
      # xunit has no sharding of its own, so the split is computed rather than configured. Both shards run the
      # identical deterministic partition over the same discovered class list, so their union is every class
      # and their intersection is empty *by construction* — there is no list to maintain and no way for a new
      # test class to land outside both halves.
      #
      # Heaviest-class-first onto the lighter shard, rather than alphabetically or round-robin: the classes are
      # very uneven (42 tests in the largest against 1 in the smallest), and at the time of writing this
      # balances 243 against 242. The tie-break on class name matters more than it looks — without it, two
      # equal-count classes could sort differently on the two runners, and the shards would silently overlap
      # on one class and skip another.
      - name: Run this shard of the API test suite
        shell: bash
        env:
          AEROLINK_API_TELEMETRY_JSONL: ${{ runner.temp }}/api-telemetry/shard-${{ matrix.shard }}.jsonl
        run: |
          set -euo pipefail
          project=product/tests/AeroLink.Api.Tests/AeroLink.Api.Tests.csproj

          dotnet test "$project" --configuration Release --no-build --list-tests > listed.txt
          grep -E '^    AeroLink' listed.txt \
            | sed 's/^ *//; s/(.*$//; s/\.[^.]*$//' \
            | sort | uniq -c | sed 's/^ *//' \
            | sort -k1,1rn -k2,2 > counts.txt

          awk -v shard="${{ matrix.shard }}" -v shards="${{ strategy.job-total }}" '
            { count[NR] = $1; class[NR] = $2 }
            END {
              for (s = 1; s <= shards; s++) load[s] = 0
              mine = 0; filter = ""
              for (i = 1; i <= NR; i++) {
                # Lightest shard takes the next heaviest class; ties go to the lowest index, which is what
                # keeps every runner computing the identical assignment.
                best = 1
                for (s = 2; s <= shards; s++) if (load[s] < load[best]) best = s
                load[best] += count[i]
                if (best == shard) {
                  mine += count[i]
                  filter = filter (filter == "" ? "" : "|") "FullyQualifiedName~" class[i] "."
                }
              }
              print mine
              print filter
            }' counts.txt > partition.txt

          expected="$(head -1 partition.txt)"
          filter="$(tail -1 partition.txt)"

          # An empty filter would run the whole assembly on both shards, which looks like a pass and doubles
          # the work it was meant to halve.
          if [ -z "$filter" ] || [ "$expected" = "0" ]; then
            echo "::error::Shard ${{ matrix.shard }} selected no test classes. Test discovery or the partition is broken."
            exit 1
          fi
          echo "Shard ${{ matrix.shard }} of ${{ strategy.job-total }}: $expected tests across $(grep -c . counts.txt) discovered classes."

          # The count is read from the TRX rather than the console summary. Piping this command through `tee`
          # to capture its text produced an empty file and an empty job log on the Windows runner — the tests
          # ran for eight minutes and exited clean, and the guard read zero from nothing. A structured result
          # file has a schema; console output is a presentation detail that differs by SDK, verbosity and
          # whether anything is attached to stdout.
          # A wedged test costs nothing while every test completes; when one genuinely hangs, --blame-hang
          # writes evidence into TestResults and fails the run instead of silently burning the job timeout.
          # 15m is far above a shard's normal step time and well under the job's 30-minute ceiling, so the
          # dump lands while there is still runner time to upload it.
          dotnet test "$project" --configuration Release --no-build \
            --filter "$filter" --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=shard.trx" --results-directory TestResults \
            --blame-hang-timeout 15m

          # `~` is a substring match, so a class whose name is a prefix of another would quietly pull in tests
          # from both, and a malformed filter would quietly run fewer. Neither fails on its own. Comparing what
          # ran against what this shard claimed turns both into a failure instead of a smaller green suite.
          trx=TestResults/shard.trx
          if [ ! -f "$trx" ]; then
            echo "::error::No test results file at $trx, so this shard cannot prove what it ran."
            exit 1
          fi
          actual="$(grep -oE '<Counters[^>]*\btotal="[0-9]+"' "$trx" | grep -oE '[0-9]+' | head -1)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Shard ${{ matrix.shard }} claimed $expected tests but ran ${actual:-no}. The filter does not match the partition."
            exit 1
          fi
          echo "Shard ${{ matrix.shard }} ran exactly the $expected tests it selected."
      # The raw TRX is the failure-evidence authority: full per-test identities, messages and stacks. The
      # aggregated telemetry above is a summary and must never be the only surviving record (#756). Uploaded
      # on failure (and on cancellation after the test step), named per shard and run attempt so parallel
      # shards and reruns cannot overwrite one another. The suites' credentials are synthetic test values;
      # artifacts live only in this repository's private CI store with bounded retention.
      - name: Upload API test diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-test-diagnostics-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/TestResults/
          if-no-files-found: ignore
          retention-days: 30
      - name: Mark test complete
        if: always()
        continue-on-error: true
        run: node "${{ github.workspace }}/product/ci-metrics/bin/mark.mjs" test-end
      - name: Aggregate API startup telemetry
        if: always()
        continue-on-error: true
        shell: bash
        env:
          AEROLINK_API_TELEMETRY_JSONL: ${{ runner.temp }}/api-telemetry/shard-${{ matrix.shard }}.jsonl
          AEROLINK_API_TRX_PATH: ${{ github.workspace }}/TestResults/shard.trx
          AEROLINK_API_TELEMETRY_OUT: ${{ runner.temp }}/api-telemetry/out
        run: |
          jsonl="${AEROLINK_API_TELEMETRY_JSONL//\\//}"
          trx="${AEROLINK_API_TRX_PATH//\\//}"
          out="${AEROLINK_API_TELEMETRY_OUT//\\//}"
          if [ -f "$jsonl" ] && [ -f "$trx" ]; then
            node "${{ github.workspace }}/product/ci-metrics/bin/aggregate-api-telemetry.mjs" \
              "$jsonl" "$trx" "$out"
            cat "$out/api-telemetry.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "API telemetry or TRX file missing (jsonl=$([ -f "$jsonl" ] && echo yes || echo no), trx=$([ -f "$trx" ] && echo yes || echo no))."
          fi
      - name: Upload API startup telemetry
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-telemetry-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/api-telemetry
          if-no-files-found: ignore
          retention-days: 30
      - name: Write metrics fragment
        if: always()
        continue-on-error: true
        env:
          METRICS_JOB_RESULT: ${{ job.status }}
          METRICS_NEEDS: changes
          METRICS_COUNTS_SOURCE: trx
          METRICS_TRX_PATH: ${{ github.workspace }}/TestResults/shard.trx
          METRICS_CLASS_DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          METRICS_CLASS_BACKEND: ${{ needs.changes.outputs.backend }}
          METRICS_CLASS_CLIENT: ${{ needs.changes.outputs.client }}
          METRICS_CLASS_BROWSER: ${{ needs.changes.outputs.browser }}
          METRICS_CLASS_POSTGRESQL: ${{ needs.changes.outputs.postgresql }}
          METRICS_CACHE_NUGET: ${{ steps.nuget.outputs.cache-hit }}
        run: node "${{ github.workspace }}/product/ci-metrics/bin/write-fragment.mjs"
      - name: Upload metrics fragment
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-metrics-fragment-backend-api-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ env.METRICS_FRAGMENT_PATH }}
          if-no-files-found: ignore
          retention-days: 30

  backend-core:
    name: Domain and infrastructure test suites
    needs: changes
    if: needs.changes.outputs.post_merge_skip != 'true' && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.backend == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      METRICS_JOB_ID: backend-core
      METRICS_JOB_NAME: Domain and infrastructure test suites
    steps:
      - name: Capture job start
        continue-on-error: true
        shell: bash
        run: |
          echo "METRICS_TIMING_FILE=${{ runner.temp }}/ci-metrics/timing-backend-core.json" >> "$GITHUB_ENV"
          echo "METRICS_FRAGMENT_PATH=${{ runner.temp }}/ci-metrics/fragment-backend-core.json" >> "$GITHUB_ENV"
          mkdir -p "${{ runner.temp }}/ci-metrics"
          printf '{"name":"job-start","at":%s}\n' "$(date +%s%3N)" >> "${{ runner.temp }}/ci-metrics/timing-backend-core.json"
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v5.2.0
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        id: nuget
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('product/**/*.csproj', 'product/**/*.props', 'product/**/*.targets') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore and build the solution
        run: |
          dotnet restore product/AeroLink.slnx
          dotnet build product/AeroLink.slnx --configuration Release --no-restore
      - name: Mark setup complete
        continue-on-error: true
        run: node "${{ github.workspace }}/product/ci-metrics/bin/mark.mjs" setup-end
      # Naming the assemblies individually is what makes them splittable, and it introduces the one failure
      # mode the old `dotnet test <solution>` could not have: a new test project that no job runs. It would
      # still build, so nothing would fail — the suite would simply be invisible, which is the most expensive
      # kind of green. This refuses to pass in that state rather than leaving it to be noticed.
      # Static analysis of the endpoint sources, so it needs no API host — and it belongs in a job the gate
      # can actually fail on. `metrics-tooling` is deliberately excluded from the gate's failure list so a
      # reporting bug cannot redden a correct product gate, which makes it the wrong home for a contract that
      # must block: a guard that only reports is the silent-green pattern it exists to prevent. `backend-core`
      # is in that list and runs precisely when backend sources change.
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Keep this as a directory-driven invocation. A new hosted contract must not be silently omitted
      # because this job still names the first contract file that happened to exist.
      - name: Run every hosted boundary contract
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = @(Get-ChildItem -LiteralPath product/test-contracts/tests -Filter '*.test.mjs' -File | Sort-Object FullName | ForEach-Object { $_.FullName })
          if ($tests.Count -eq 0) { throw 'No hosted test-contracts test files were found.' }
          & node --test $tests
          if ($LASTEXITCODE -ne 0) { throw 'A hosted test-contracts suite failed.' }
      # Here for the same reason as the route contract above, and more urgently: this suite guards the
      # classifier that decides which gates run at all. Two silent-green failures came from that code, and
      # a guard on it that cannot fail the gate would be worth nothing.
      - name: Verify the changed-area classifier and its workflow contract
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = @(Get-ChildItem -LiteralPath product/test-planner/tests -Filter '*.test.mjs' -File | Sort-Object FullName | ForEach-Object { $_.FullName })
          if ($tests.Count -eq 0) { throw 'No planner tests were found.' }
          & node --test $tests
          if ($LASTEXITCODE -ne 0) { throw 'A planner test suite failed.' }
      - name: Refuse a test project that no job runs
        shell: bash
        run: |
          set -euo pipefail
          known="AeroLink.Api.Tests AeroLink.Domain.Tests AeroLink.Infrastructure.Tests"
          unrun=""
          for path in product/tests/*/; do
            name="$(basename "$path")"
            case " $known " in
              *" $name "*) ;;
              *) unrun="$unrun $name" ;;
            esac
          done
          if [ -n "$unrun" ]; then
            echo "::error::These test projects are not run by any CI job:$unrun"
            echo "Add each to a backend job in .github/workflows/ci.yml and to the list in this guard."
            exit 1
          fi
          echo "All test projects under product/tests are claimed by a job."
      - name: Run the domain and infrastructure test suites
        run: |
          dotnet test product/tests/AeroLink.Domain.Tests/AeroLink.Domain.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal" --logger "trx;LogFileName=domain.trx" --results-directory TestResults --blame-hang-timeout 15m
          dotnet test product/tests/AeroLink.Infrastructure.Tests/AeroLink.Infrastructure.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal" --logger "trx;LogFileName=infrastructure.trx" --results-directory TestResults --blame-hang-timeout 15m
      # Same failure-evidence contract as the API shards (#756): the raw TRX files are the authority for
      # which tests failed and why, retained on failure under a run-unique artifact name.
      - name: Upload core test diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-test-diagnostics-${{ github.run_attempt }}
          path: ${{ github.workspace }}/TestResults/
          if-no-files-found: ignore
          retention-days: 30
      - name: Mark test complete
        if: always()
        continue-on-error: true
        run: node "${{ github.workspace }}/product/ci-metrics/bin/mark.mjs" test-end
      - name: Write metrics fragment
        if: always()
        continue-on-error: true
        env:
          METRICS_JOB_RESULT: ${{ job.status }}
          METRICS_NEEDS: changes
          METRICS_COUNTS_SOURCE: trx
          METRICS_TRX_PATH: ${{ github.workspace }}/TestResults/domain.trx,${{ github.workspace }}/TestResults/infrastructure.trx
          METRICS_CLASS_DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          METRICS_CLASS_BACKEND: ${{ needs.changes.outputs.backend }}
          METRICS_CLASS_CLIENT: ${{ needs.changes.outputs.client }}
          METRICS_CLASS_BROWSER: ${{ needs.changes.outputs.browser }}
          METRICS_CLASS_POSTGRESQL: ${{ needs.changes.outputs.postgresql }}
          METRICS_CACHE_NUGET: ${{ steps.nuget.outputs.cache-hit }}
        run: node "${{ github.workspace }}/product/ci-metrics/bin/write-fragment.mjs"
      - name: Upload metrics fragment
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-metrics-fragment-backend-core-${{ github.run_attempt }}
          path: ${{ env.METRICS_FRAGMENT_PATH }}
          if-no-files-found: ignore
          retention-days: 30

  client:
    name: Client lint, type-check, and build
    needs: changes
    if: needs.changes.outputs.post_merge_skip != 'true' && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.client == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      METRICS_JOB_ID: client
      METRICS_JOB_NAME: Client lint, type-check, and build
    steps:
      - name: Capture job start
        continue-on-error: true
        shell: bash
        run: |
          echo "METRICS_TIMING_FILE=${{ runner.temp }}/ci-metrics/timing-client.json" >> "$GITHUB_ENV"
          echo "METRICS_FRAGMENT_PATH=${{ runner.temp }}/ci-metrics/fragment-client.json" >> "$GITHUB_ENV"
          mkdir -p "${{ runner.temp }}/ci-metrics"
          printf '{"name":"job-start","at":%s}\n' "$(date +%s%3N)" >> "${{ runner.temp }}/ci-metrics/timing-client.json"
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: product/client/package-lock.json
      - name: Mark setup complete
        continue-on-error: true
        run: node "${{ github.workspace }}/product/ci-metrics/bin/mark.mjs" setup-end
      - name: Lint, type-check, and build client
        working-directory: product/client
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build
      - name: Mark test complete
        if: always()
        continue-on-error: true
        run: node "${{ github.workspace }}/product/ci-metrics/bin/mark.mjs" test-end
      - name: Write metrics fragment
        if: always()
        continue-on-error: true
        env:
          METRICS_JOB_RESULT: ${{ job.status }}
          METRICS_NEEDS: changes
          METRICS_CLASS_DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          METRICS_CLASS_BACKEND: ${{ needs.changes.outputs.backend }}
          METRICS_CLASS_CLIENT: ${{ needs.changes.outputs.client }}
          METRICS_CLASS_BROWSER: ${{ needs.changes.outputs.browser }}
          METRICS_CLASS_POSTGRESQL: ${{ needs.changes.outputs.postgresql }}
        run: node "${{ github.workspace }}/product/ci-metrics/bin/write-fragment.mjs"
      - name: Upload metrics fragment
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-metrics-fragment-client-${{ github.run_attempt }}
          path: ${{ env.METRICS_FRAGMENT_PATH }}
          if-no-files-found: ignore
          retention-days: 30

  # The operator scripts are PowerShell and reference no compiled output, so this job needs neither .NET nor
  # Node — a checkout is the whole environment. It stayed on the critical path for years only because it
  # happened to live in the same job as the things that do need a toolchain.
  #
  # Gated on the change not being documentation-only rather than on `backend`, which preserves exactly when
  # these ran before: a client-only change still proves the backup, evidence, restore, migration-posture and
  # remote-demo contracts, because those scripts are not client code and their coverage should not depend on
  # how a diff happened to be classified.
  script-contracts:
    name: Operator and recovery script contracts
    needs: changes
    if: needs.changes.outputs.post_merge_skip != 'true' && needs.changes.outputs.docs_only != 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      METRICS_JOB_ID: script-contracts
      METRICS_JOB_NAME: Operator and recovery script contracts
    steps:
      - name: Capture job start
        continue-on-error: true
        shell: bash
        run: |
          echo "METRICS_TIMING_FILE=${{ runner.temp }}/ci-metrics/timing-script-contracts.json" >> "$GITHUB_ENV"
          echo "METRICS_FRAGMENT_PATH=${{ runner.temp }}/ci-metrics/fragment-script-contracts.json" >> "$GITHUB_ENV"
          mkdir -p "${{ runner.temp }}/ci-metrics"
          printf '{"name":"job-start","at":%s}\n' "$(date +%s%3N)" >> "${{ runner.temp }}/ci-metrics/timing-script-contracts.json"
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Mark setup complete
        continue-on-error: true
        run: node "${{ github.workspace }}/product/ci-metrics/bin/mark.mjs" setup-end

      - name: Validate the non-mutating backup schedule contract
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $preview = & ./product/scripts/Configure-AeroLinkBackupSchedule.ps1 -Action Preview -DailyAt 02:00 -RetentionDays 30
          if ($preview.Schedule -ne 'Daily' -or $preview.DailyAt -ne '02:00' -or $preview.RetentionDays -ne 30) {
            throw 'The default daily backup schedule contract changed unexpectedly.'
          }
          if (-not (Test-Path -LiteralPath $preview.Runner -PathType Leaf)) {
            throw 'The scheduled backup runner does not resolve to a file.'
          }
          if ($preview.Arguments -notlike '*Invoke-AeroLinkScheduledBackup.ps1*' -or $preview.Arguments -notlike '*-RetentionDays 30*') {
            throw 'The scheduled task no longer invokes the verified backup runner with retention.'
          }

      - name: Validate configured evidence backup contracts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ./product/scripts/AeroLinkEvidenceStore.Tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Configured evidence backup regression failed.' }
          & ./product/scripts/AeroLinkBackupVerification.Tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Portable backup verification regression failed.' }
          & ./product/scripts/AeroLinkRestoreContract.Tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Restore activation contract regression failed.' }

      - name: Validate the migration-posture diagnostics contract
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ./product/scripts/AeroLinkMigrationPosture.Tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Migration-posture diagnostics regression failed.' }

      - name: Validate the remote-demo operator contract
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ./product/scripts/AeroLinkRemoteDemo.Tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Remote-demo operator regression failed.' }

      - name: Validate the remote-demo recovery contract
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ./product/scripts/AeroLinkRemoteDemoRecovery.Tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Remote-demo recovery regression failed.' }
      # The double-clickable launchers are the only part of AeroLink some people run directly, and the part
      # with no compiler behind it. Both defects that shipped in them -- a launcher that could not find its
      # own modules, and three that reported success after failing -- were invisible to every suite that
      # compiles or executes product code.
      - name: Validate the root launcher contract
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ./product/scripts/AeroLinkLauncherContract.Tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Root launcher contract failed.' }
      - name: Validate the changed-test planner Windows contract
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ./product/scripts/Get-AeroLinkTestPlan.Tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows test planner contract failed.' }
      - name: Mark test complete
        if: always()
        continue-on-error: true
        run: node "${{ github.workspace }}/product/ci-metrics/bin/mark.mjs" test-end
      - name: Write metrics fragment
        if: always()
        continue-on-error: true
        env:
          METRICS_JOB_RESULT: ${{ job.status }}
          METRICS_NEEDS: changes
          METRICS_CLASS_DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          METRICS_CLASS_BACKEND: ${{ needs.changes.outputs.backend }}
          METRICS_CLASS_CLIENT: ${{ needs.changes.outputs.client }}
          METRICS_CLASS_BROWSER: ${{ needs.changes.outputs.browser }}
          METRICS_CLASS_POSTGRESQL: ${{ needs.changes.outputs.postgresql }}
        run: node "${{ github.workspace }}/product/ci-metrics/bin/write-fragment.mjs"
      - name: Upload metrics fragment
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-metrics-fragment-script-contracts-${{ github.run_attempt }}
          path: ${{ env.METRICS_FRAGMENT_PATH }}
          if-no-files-found: ignore
          retention-days: 30

  # Four shards now, and the reasoning that held them at two is what changed rather than anyone's opinion.
  # Twice the answer was "the journeys are not the critical path, so splitting them shortens a job nobody is
  # waiting for". Sharding `backend-api` removed the job they were being compared against, and the journeys
  # became the critical path at 997s — so the same test now points the other way.
  #
  # Measured on the run that made this true: 603s and 807s of journeys against ~175s of setup per shard.
  # Four splits 1410 seconds of journeys about four ways while paying setup once more, which is worth it while
  # the journeys are still the longest thing in the gate. It stops being worth it when a shard's setup is a
  # large fraction of its run — at four, setup is roughly a third, which is the point to stop.
  #
  # Playwright shards by test file, not by duration, so the halves were 25% apart. More shards makes each
  # imbalance smaller in absolute terms, which is a second reason four beats three here.
  #
  # `fail-fast: false` is the change. The opposite cancelled the sibling shard the moment one failed, so a
  # single flake cost a rerun purely to discover whether anything else had also failed. A cancelled shard
  # reports nothing, which is the most expensive kind of nothing — it buys runner minutes with information
  # and then spends twenty-five minutes buying the information back.
  browser-pr:
    name: Browser journeys (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    # Merge-group runs as well as pull requests. Gated on `pull_request` alone, these shards skip inside a
    # merge queue — and a skipped job is not a failed one, so the queue would merge on a green tick having run
    # no browser journey at all. That is a quieter gate at the exact moment the commit lands, which is the
    # opposite of what the queue is for.
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && inputs.pull_request_number != '')) && needs.changes.outputs.browser == 'true'
    runs-on: windows-latest
    # Thirty, because twenty is now inside the noise. A shard is roughly four minutes of setup — checkout,
    # .NET, Node, NuGet restore, the Release API build, Chromium — plus its half of the journeys, and that
    # half has grown steadily: 14m48s, 15m21s, 17m04s, 17m46s, and then a run that reported `105 passed
    # (16.3m)` and was cancelled at 20m08s while uploading. Every test had passed.
    #
    # A timeout that fires after a green suite is the worst possible signal: it reports failure, names no
    # test, and costs a full gate to re-run something that already worked. The ceiling exists to stop a hung
    # browser running for an hour, and thirty still does that.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      METRICS_JOB_ID: browser-pr
      METRICS_JOB_NAME: Browser journeys (${{ matrix.shard }}/${{ strategy.job-total }})
      METRICS_MATRIX: ${{ toJson(matrix) }}
    steps:
      - name: Capture job start
        continue-on-error: true
        shell: bash
        run: |
          echo "METRICS_TIMING_FILE=${{ runner.temp }}/ci-metrics/timing-browser-pr-${{ matrix.shard }}.json" >> "$GITHUB_ENV"
          echo "METRICS_FRAGMENT_PATH=${{ runner.temp }}/ci-metrics/fragment-browser-pr-${{ matrix.shard }}.json" >> "$GITHUB_ENV"
          mkdir -p "${{ runner.temp }}/ci-metrics"
          printf '{"name":"job-start","at":%s}\n' "$(date +%s%3N)" >> "${{ runner.temp }}/ci-metrics/timing-browser-pr-${{ matrix.shard }}.json"
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v5.2.0
        with:
          dotnet-version: 10.0.x
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: product/client/package-lock.json
      - name: Cache NuGet packages
        id: nuget
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('product/**/*.csproj', 'product/**/*.props', 'product/**/*.targets') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore and build browser API
        run: |
          dotnet restore product/src/AeroLink.Api/AeroLink.Api.csproj
          dotnet build product/src/AeroLink.Api/AeroLink.Api.csproj --configuration Release --no-restore
      # Chromium was re-downloaded by every browser job on every run — three times per pull request, for a
      # binary that only changes when Playwright does. Keyed on the lockfile because that is what pins the
      # Playwright version; an unrelated dependency bump invalidates it needlessly, which costs one download
      # and is the safe direction. A stale browser cannot pass silently: Playwright refuses to start a browser
      # build its client library does not expect.
      - name: Cache Chromium
        id: chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('product/client/package-lock.json') }}
      - name: Install client and Chromium
        working-directory: product/client
        run: |
          npm ci
          # No dependency install: `--with-deps` and `install-deps` install apt packages and do not apply on
          # Windows. The cache holds the browser binary, which is the whole of what is needed here.
          npx playwright install chromium
      - name: Mark setup complete
        continue-on-error: true
        run: node "${{ github.workspace }}/product/ci-metrics/bin/mark.mjs" setup-end
      # Packed by recorded duration rather than by `--shard`. Playwright's own sharding balances test *count*
      # and does it well — 58/57/54/56 across four — but those shards took 360s, 328s, 233s and 662s, because
      # what varies is duration per test. One file, zzz-post-414-picker-integrity.spec.ts, is 220 of the
      # suite's 1182 seconds by itself, and no count-based split can see that.
      #
      # Adding runners was the only other lever and it is now capped by something other than money: at 14 jobs
      # a run, two concurrent pull requests already exceed the account's job limit, and this repository
      # routinely has several agents working at once. So the fix is to pack the runners that already exist.
      #
      # `journey-durations.json` is an optimisation, never a correctness input: an unknown or stale file is
      # weighted at the median, and a missing file degenerates the whole thing to a count-based split. It is
      # refreshed from the artifacts these jobs upload. The `json` reporter stays for that, and `list` stays so
      # the console output remains readable.
      - name: Run browser journey shard
        working-directory: product/client
        shell: bash
        env:
          AEROLINK_E2E_SKIP_BUILD: "true"
          PLAYWRIGHT_JSON_OUTPUT_NAME: journey-durations-${{ matrix.shard }}.json
        run: |
          set -euo pipefail
          npx playwright test --list > listed.txt
          node scripts/plan-journey-shard.mjs listed.txt ${{ matrix.shard }} ${{ strategy.job-total }} > plan.txt

          readarray -t planned < plan.txt
          expected="${planned[0]}"
          files=("${planned[@]:1}")

          # A plan of nothing would run the entire suite on every shard: green, and four times the work it was
          # meant to divide.
          if [ "${#files[@]}" -eq 0 ] || [ "$expected" = "0" ]; then
            echo "::error::Shard ${{ matrix.shard }} planned no spec files. Discovery or the packing is broken."
            exit 1
          fi
          echo "Shard ${{ matrix.shard }} of ${{ strategy.job-total }}: $expected tests across ${#files[@]} spec files."

          npx playwright test "${files[@]}" --reporter=list,json

          # The plan anchors each name so a spec contained in a longer one cannot be pulled into a shard it was
          # not given. This stays as the backstop: an anchor that stopped working, or a mistyped plan running
          # fewer, fails silently otherwise. The report's own stats are compared against what the plan claimed.
          actual="$(node -e "const s=require('./journey-durations-${{ matrix.shard }}.json').stats; console.log(s.expected + s.unexpected + s.flaky + s.skipped)")"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Shard ${{ matrix.shard }} planned $expected tests but ran $actual. The file list does not match the plan."
            exit 1
          fi
          echo "Shard ${{ matrix.shard }} ran exactly the $expected tests it planned."
      - name: Mark test complete
        if: always()
        continue-on-error: true
        run: node "${{ github.workspace }}/product/ci-metrics/bin/mark.mjs" test-end
      - name: Upload journey durations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: journey-durations-${{ matrix.shard }}-${{ github.run_attempt }}
          path: product/client/journey-durations-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-diagnostics-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            product/client/playwright-report
            product/client/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Write metrics fragment
        if: always()
        continue-on-error: true
        env:
          METRICS_JOB_RESULT: ${{ job.status }}
          METRICS_NEEDS: changes
          METRICS_COUNTS_SOURCE: playwright-json
          METRICS_PLAYWRIGHT_JSON_PATH: ${{ github.workspace }}/product/client/journey-durations-${{ matrix.shard }}.json
          METRICS_CLASS_DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          METRICS_CLASS_BACKEND: ${{ needs.changes.outputs.backend }}
          METRICS_CLASS_CLIENT: ${{ needs.changes.outputs.client }}
          METRICS_CLASS_BROWSER: ${{ needs.changes.outputs.browser }}
          METRICS_CLASS_POSTGRESQL: ${{ needs.changes.outputs.postgresql }}
          METRICS_CACHE_NUGET: ${{ steps.nuget.outputs.cache-hit }}
          METRICS_CACHE_CHROMIUM: ${{ steps.chromium.outputs.cache-hit }}
        run: node "${{ github.workspace }}/product/ci-metrics/bin/write-fragment.mjs"
      - name: Upload metrics fragment
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-metrics-fragment-browser-pr-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ env.METRICS_FRAGMENT_PATH }}
          if-no-files-found: ignore
          retention-days: 30

  # The journeys against the artifact a demonstration or a deployment actually serves: the built client, hosted
  # by the API on one origin. Every other gate serves the client with `vite dev`, which meant the production
  # bundle was compiled on every pull request and never once rendered in a browser. `vite dev` hands over
  # unbundled modules and injects each stylesheet when its module evaluates; a build chunks, extracts, hashes
  # and minifies. Its first run found two design-contract defects and one blocked webfont.
  #
  # On pull requests, because it is the environment the demonstration depends on and it costs one build. Not on
  # push: a squash merge of a green pull request puts an identical tree on main, which is the same reason
  # browser-full skips push.
  browser-production:
    name: Browser journeys on the production build
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.browser == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      METRICS_JOB_ID: browser-production
      METRICS_JOB_NAME: Browser journeys on the production build
    steps:
      - name: Capture job start
        continue-on-error: true
        shell: bash
        run: |
          echo "METRICS_TIMING_FILE=${{ runner.temp }}/ci-metrics/timing-browser-production.json" >> "$GITHUB_ENV"
          echo "METRICS_FRAGMENT_PATH=${{ runner.temp }}/ci-metrics/fragment-browser-production.json" >> "$GITHUB_ENV"
          mkdir -p "${{ runner.temp }}/ci-metrics"
          printf '{"name":"job-start","at":%s}\n' "$(date +%s%3N)" >> "${{ runner.temp }}/ci-metrics/timing-browser-production.json"
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v5.2.0
        with:
          dotnet-version: 10.0.x
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: product/client/package-lock.json
      - name: Cache NuGet packages
        id: nuget
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('product/**/*.csproj', 'product/**/*.props', 'product/**/*.targets') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore and build the API
        run: |
          dotnet restore product/src/AeroLink.Api/AeroLink.Api.csproj
          dotnet build product/src/AeroLink.Api/AeroLink.Api.csproj --configuration Release --no-restore
      # Shares the cache entry the pull request shards populate: same key, same runner, same browser.
      - name: Cache Chromium
        id: chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('product/client/package-lock.json') }}
      - name: Install client and Chromium
        working-directory: product/client
        run: |
          npm ci
          # `--with-deps` installs apt packages and does not apply on Windows; the cached browser binary is all
          # that is needed.
          npx playwright install chromium
      - name: Mark setup complete
        continue-on-error: true
        run: node "${{ github.workspace }}/product/ci-metrics/bin/mark.mjs" setup-end
      - name: Build the client and run the production journeys
        working-directory: product/client
        env:
          AEROLINK_E2E_SKIP_BUILD: "true"
          PLAYWRIGHT_JSON_OUTPUT_NAME: journey-durations-production.json
        run: npm run test:production -- --reporter=list,json
      - name: Mark test complete
        if: always()
        continue-on-error: true
        run: node "${{ github.workspace }}/product/ci-metrics/bin/mark.mjs" test-end
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-production-${{ github.run_attempt }}
          path: |
            product/client/playwright-report-production
            product/client/test-results-production
          if-no-files-found: ignore
          retention-days: 7
      - name: Write metrics fragment
        if: always()
        continue-on-error: true
        env:
          METRICS_JOB_RESULT: ${{ job.status }}
          METRICS_NEEDS: changes
          METRICS_COUNTS_SOURCE: playwright-json
          METRICS_PLAYWRIGHT_JSON_PATH: ${{ github.workspace }}/product/client/journey-durations-production.json
          METRICS_CLASS_DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          METRICS_CLASS_BACKEND: ${{ needs.changes.outputs.backend }}
          METRICS_CLASS_CLIENT: ${{ needs.changes.outputs.client }}
          METRICS_CLASS_BROWSER: ${{ needs.changes.outputs.browser }}
          METRICS_CLASS_POSTGRESQL: ${{ needs.changes.outputs.postgresql }}
          METRICS_CACHE_NUGET: ${{ steps.nuget.outputs.cache-hit }}
          METRICS_CACHE_CHROMIUM: ${{ steps.chromium.outputs.cache-hit }}
        run: node "${{ github.workspace }}/product/ci-metrics/bin/write-fragment.mjs"
      - name: Upload metrics fragment
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-metrics-fragment-browser-production-${{ github.run_attempt }}
          path: ${{ env.METRICS_FRAGMENT_PATH }}
          if-no-files-found: ignore
          retention-days: 30

  browser-full:
    name: Full browser journeys (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    # Schedule and manual dispatch only. A squash merge of a green pull request puts a tree on main that
    # is identical to the one browser-pr tested minutes earlier, so re-running the journeys on push buys
    # no information. validate and postgresql-smoke still run on every push as the safety net.
    if: (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.pull_request_number == '' && inputs.full_diagnostics == true)) && needs.changes.outputs.browser == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      METRICS_JOB_ID: browser-full
      METRICS_JOB_NAME: Full browser journeys (${{ matrix.shard }}/${{ strategy.job-total }})
      METRICS_MATRIX: ${{ toJson(matrix) }}
    steps:
      - name: Capture job start
        continue-on-error: true
        shell: bash
        run: |
          echo "METRICS_TIMING_FILE=${{ runner.temp }}/ci-metrics/timing-browser-full-${{ matrix.shard }}.json" >> "$GITHUB_ENV"
          echo "METRICS_FRAGMENT_PATH=${{ runner.temp }}/ci-metrics/fragment-browser-full-${{ matrix.shard }}.json" >> "$GITHUB_ENV"
          mkdir -p "${{ runner.temp }}/ci-metrics"
          printf '{"name":"job-start","at":%s}\n' "$(date +%s%3N)" >> "${{ runner.temp }}/ci-metrics/timing-browser-full-${{ matrix.shard }}.json"
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v5.2.0
        with:
          dotnet-version: 10.0.x
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: product/client/package-lock.json
      # The weekly run reuses whatever the week's pull requests left behind. On a quiet week the entry has been
      # evicted and this pays the download once, which is the point of a weekly environment-rot check anyway.
      - name: Cache Chromium
        id: chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('product/client/package-lock.json') }}
      - name: Restore, build, and install browser dependencies
        working-directory: product/client
        run: |
          dotnet restore ../src/AeroLink.Api/AeroLink.Api.csproj
          dotnet build ../src/AeroLink.Api/AeroLink.Api.csproj --configuration Release --no-restore
          npm ci
          # `--with-deps` installs apt packages and does not apply on Windows; the cached browser binary is all
          # that is needed.
          npx playwright install chromium
      - name: Mark setup complete
        continue-on-error: true
        run: node "${{ github.workspace }}/product/ci-metrics/bin/mark.mjs" setup-end
      - name: Run full browser shard
        working-directory: product/client
        env:
          AEROLINK_E2E_SKIP_BUILD: "true"
          PLAYWRIGHT_JSON_OUTPUT_NAME: journey-durations-full-${{ matrix.shard }}.json
        run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=list,json
      - name: Mark test complete
        if: always()
        continue-on-error: true
        run: node "${{ github.workspace }}/product/ci-metrics/bin/mark.mjs" test-end
      - name: Upload diagnostics and timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-full-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            product/client/playwright-report
      - name: Write metrics fragment
        if: always()
        continue-on-error: true
        env:
          METRICS_JOB_RESULT: ${{ job.status }}
          METRICS_NEEDS: changes
          METRICS_COUNTS_SOURCE: playwright-json
          METRICS_PLAYWRIGHT_JSON_PATH: ${{ github.workspace }}/product/client/journey-durations-full-${{ matrix.shard }}.json
          METRICS_CLASS_DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          METRICS_CLASS_BACKEND: ${{ needs.changes.outputs.backend }}
          METRICS_CLASS_CLIENT: ${{ needs.changes.outputs.client }}
          METRICS_CLASS_BROWSER: ${{ needs.changes.outputs.browser }}
          METRICS_CLASS_POSTGRESQL: ${{ needs.changes.outputs.postgresql }}
          METRICS_CACHE_CHROMIUM: ${{ steps.chromium.outputs.cache-hit }}
        run: node "${{ github.workspace }}/product/ci-metrics/bin/write-fragment.mjs"
      - name: Upload metrics fragment
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-metrics-fragment-browser-full-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ env.METRICS_FRAGMENT_PATH }}
          if-no-files-found: ignore
          retention-days: 30
  postgresql-smoke:
    name: PostgreSQL migrations and secure bootstrap
    needs: changes
    if: needs.changes.outputs.post_merge_skip != 'true' && needs.changes.outputs.postgresql == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      METRICS_JOB_ID: postgresql-smoke
      METRICS_JOB_NAME: PostgreSQL migrations and secure bootstrap
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: aerolink_ci
          POSTGRES_USER: aerolink
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aerolink -d aerolink_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Capture job start
        continue-on-error: true
        shell: bash
        run: |
          echo "METRICS_TIMING_FILE=${{ runner.temp }}/ci-metrics/timing-postgresql-smoke.json" >> "$GITHUB_ENV"
          echo "METRICS_FRAGMENT_PATH=${{ runner.temp }}/ci-metrics/fragment-postgresql-smoke.json" >> "$GITHUB_ENV"
          mkdir -p "${{ runner.temp }}/ci-metrics"
          printf '{"name":"job-start","at":%s}\n' "$(date +%s%3N)" >> "${{ runner.temp }}/ci-metrics/timing-postgresql-smoke.json"
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v5.2.0
        with:
          dotnet-version: 10.0.x
      - name: Restore and build API
        run: |
          dotnet restore product/AeroLink.slnx
          dotnet build product/AeroLink.slnx --configuration Release --no-restore
      - name: Mark setup complete
        continue-on-error: true
        run: node "${{ github.workspace }}/product/ci-metrics/bin/mark.mjs" setup-end
      - name: Apply migrations and prove first-install and identity administration paths
        env:
          ASPNETCORE_ENVIRONMENT: Production
          Database__Provider: PostgreSql
          ConnectionStrings__AeroLink: Host=127.0.0.1;Port=5432;Database=aerolink_ci;Username=aerolink;Password=ci-only-password
          DemoData__Enabled: "false"
          Identity__SeedDemoAccounts: "false"
          Identity__CookieSecure: "false"
          Identity__BootstrapSecret: ci-only-bootstrap-secret-0123456789-abcdef
          PGPASSWORD: ci-only-password
        run: |
          set -euo pipefail
          dotnet run --project product/src/AeroLink.Api --configuration Release --no-build --no-launch-profile --urls http://127.0.0.1:5080 > postgres-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:5080/health >/dev/null; then break; fi
            if ! kill -0 "$api_pid" 2>/dev/null; then cat postgres-api.log; exit 1; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5080/health | jq -e '.status == "healthy"'
          curl -fsS http://127.0.0.1:5080/api/setup/status | jq -e '.bootstrapRequired == true and .bootstrapEnabled == true'
          curl -fsS -X POST http://127.0.0.1:5080/api/setup/bootstrap \
            -H 'Content-Type: application/json' \
            -H 'X-AeroLink-Bootstrap-Secret: ci-only-bootstrap-secret-0123456789-abcdef' \
            -d '{"displayName":"CI Administrator","email":"ci-admin@example.invalid","password":"CiOnly!Administrator2026"}'
          curl -fsS http://127.0.0.1:5080/api/setup/status | jq -e '.bootstrapRequired == false and .bootstrapEnabled == false'
          curl -fsS -c cookies.txt -X POST http://127.0.0.1:5080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"userName":"admin","password":"CiOnly!Administrator2026"}' | jq -e '.userName == "admin" and .isAdministrator == true'
          curl -fsS -b cookies.txt http://127.0.0.1:5080/api/auth/me | jq -e '.userName == "admin" and .isAdministrator == true'

          # A migration that Entity Framework never discovers still leaves a green boot and login, so the
          # tables each migration is responsible for creating are exercised through the API here.
          curl -fsS -b cookies.txt -X POST http://127.0.0.1:5080/api/admin/external-identity/providers \
            -H 'Content-Type: application/json' \
            -d '{"key":"ci-entra","displayName":"CI Entra","protocol":"OpenIdConnect","issuer":"https://Login.CI.Example/tenant/","subjectClaim":"sub","groupClaim":"groups"}' \
            > provider.json
          jq -e '.enabled == true and .issuer == "https://login.ci.example/tenant"' provider.json
          provider_id=$(jq -er '.id' provider.json)
          curl -fsS -b cookies.txt http://127.0.0.1:5080/api/admin/external-identity/providers | jq -e 'length == 1'
          # The same trust anchor in an equivalent form must be refused by the unique issuer index.
          conflict=$(curl -s -o /dev/null -w '%{http_code}' -b cookies.txt -X POST http://127.0.0.1:5080/api/admin/external-identity/providers \
            -H 'Content-Type: application/json' \
            -d '{"key":"ci-entra-two","displayName":"CI Duplicate","protocol":"OpenIdConnect","issuer":"HTTPS://LOGIN.CI.EXAMPLE:443/tenant","subjectClaim":"sub","groupClaim":"groups"}')
          test "$conflict" = "409" || { echo "expected 409 for a duplicate trust anchor, got $conflict"; exit 1; }
          # -q suppresses the "INSERT 0 1" command tag, which would otherwise be captured alongside the
          # returned identifier and produce a malformed request body. head -n1 keeps that true regardless
          # of psql client version.
          program_id=$(psql -h 127.0.0.1 -U aerolink -d aerolink_ci -qtAc \
            "insert into programs (\"Id\",\"Name\",\"Code\") values (gen_random_uuid(),'CI Program','CIP') returning \"Id\";" \
            | head -n1)
          curl -fsS -b cookies.txt -X POST http://127.0.0.1:5080/api/admin/external-identity/mappings \
            -H 'Content-Type: application/json' \
            -d "{\"providerId\":\"$provider_id\",\"externalGroup\":\"CI-Approvers\",\"programId\":\"$program_id\",\"role\":\"Approver\"}" \
            | jq -e '.externalGroup == "ci-approvers"'
          curl -fsS -b cookies.txt -X POST http://127.0.0.1:5080/api/admin/external-identity/resolve \
            -H 'Content-Type: application/json' \
            -d "{\"providerId\":\"$provider_id\",\"issuer\":\"https://login.ci.example/tenant\",\"externalGroups\":[\"CI-APPROVERS\"],\"programId\":\"$program_id\"}" \
            | jq -e '.roles == ["Approver"]'
          # Fail-closed: a look-alike issuer grants nothing.
          curl -fsS -b cookies.txt -X POST http://127.0.0.1:5080/api/admin/external-identity/resolve \
            -H 'Content-Type: application/json' \
            -d "{\"providerId\":\"$provider_id\",\"issuer\":\"https://login.ci.example.attacker.test/tenant\",\"externalGroups\":[\"CI-APPROVERS\"],\"programId\":\"$program_id\"}" \
            | jq -e '.roles == []'
          psql -h 127.0.0.1 -U aerolink -d aerolink_ci -qtAc \
            "select count(*) from security_audit_events where \"EventType\" like 'External%' and \"Outcome\" = 'Success';" \
            | { read -r count; test "$count" -ge 3 || { echo "expected identity audit evidence, found $count"; exit 1; }; }
      - name: Mark test complete
        if: always()
        continue-on-error: true
        run: node "${{ github.workspace }}/product/ci-metrics/bin/mark.mjs" test-end
      - name: Upload PostgreSQL startup diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgresql-api-diagnostics-${{ github.run_attempt }}
          path: postgres-api.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Write metrics fragment
        if: always()
        continue-on-error: true
        env:
          METRICS_JOB_RESULT: ${{ job.status }}
          METRICS_NEEDS: changes
          METRICS_CLASS_DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          METRICS_CLASS_BACKEND: ${{ needs.changes.outputs.backend }}
          METRICS_CLASS_CLIENT: ${{ needs.changes.outputs.client }}
          METRICS_CLASS_BROWSER: ${{ needs.changes.outputs.browser }}
          METRICS_CLASS_POSTGRESQL: ${{ needs.changes.outputs.postgresql }}
        run: node "${{ github.workspace }}/product/ci-metrics/bin/write-fragment.mjs"
      - name: Upload metrics fragment
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-metrics-fragment-postgresql-smoke-${{ github.run_attempt }}
          path: ${{ env.METRICS_FRAGMENT_PATH }}
          if-no-files-found: ignore
          retention-days: 30
  # What a green tick on this run actually means.
  #
  # Every job above is conditional, and a skipped job is not a failed one — so a run whose journeys never ran
  # reports success exactly like a run where they all passed. That is how a commit landed on main with every
  # browser journey skipped and a green tick beside it, and why "CI is green" could not be used as evidence
  # without opening the run and reading which jobs had actually executed.
  #
  # This job always runs, fails if anything it waited on failed, and writes down what was and was not
  # validated. It is the one check worth requiring for a merge: it cannot be skipped into a pass, and its
  # summary says in words what the tick is claiming.
  gate:
    name: Full Product evidence aggregate
    if: always()
    needs: [changes, backend-api, backend-core, client, script-contracts, browser-pr, browser-production, postgresql-smoke, metrics-tooling]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      METRICS_JOB_ID: gate
      METRICS_JOB_NAME: Full Product evidence aggregate
    steps:
      - name: Capture job start
        continue-on-error: true
        shell: bash
        run: |
          echo "METRICS_TIMING_FILE=${{ runner.temp }}/ci-metrics/timing-gate.json" >> "$GITHUB_ENV"
          echo "METRICS_FRAGMENT_PATH=${{ runner.temp }}/ci-metrics/fragment-gate.json" >> "$GITHUB_ENV"
          mkdir -p "${{ runner.temp }}/ci-metrics"
          printf '{"name":"job-start","at":%s}\n' "$(date +%s%3N)" >> "${{ runner.temp }}/ci-metrics/timing-gate.json"
      - name: Summarise and enforce
        env:
          BACKEND_API: ${{ needs.backend-api.result }}
          BACKEND_CORE: ${{ needs.backend-core.result }}
          CLIENT: ${{ needs.client.result }}
          CONTRACTS: ${{ needs.script-contracts.result }}
          BROWSER: ${{ needs.browser-pr.result }}
          PRODUCTION: ${{ needs.browser-production.result }}
          POSTGRESQL: ${{ needs.postgresql-smoke.result }}
          METRICS_TOOLING: ${{ needs.metrics-tooling.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          LAUNCHERS_ONLY: ${{ needs.changes.outputs.launchers_only }}
          EVENT_NAME: ${{ inputs.pull_request_number != '' && 'pull_request' || github.event_name }}
          PLANNER_VERSION: ${{ needs.changes.outputs.planner_version }}
          PLANNER_HASH: ${{ needs.changes.outputs.planner_hash }}
          PLANNER_UNKNOWN_PATHS: ${{ needs.changes.outputs.planner_unknown_paths }}
          PLANNER_REASON: ${{ needs.changes.outputs.planner_reason }}
          PLANNER_SELECTED_JOBS: ${{ needs.changes.outputs.planner_selected_jobs }}
          PLANNER_SKIPPED_JOBS: ${{ needs.changes.outputs.planner_skipped_jobs }}
          PLANNER_DECISIONS: ${{ needs.changes.outputs.planner_decisions }}
          POST_MERGE_SKIP: ${{ needs.changes.outputs.post_merge_skip }}
          PROVENANCE_OUTCOME: ${{ needs.changes.outputs.provenance_outcome }}
        run: |
          set -euo pipefail
          describe() {
            case "$2" in
              success) echo "- **$1**: ran and passed" ;;
              failure) echo "- **$1**: FAILED" ;;
              cancelled) echo "- **$1**: cancelled" ;;
              *) echo "- **$1**: did not run" ;;
            esac
          }
          {
            echo "## What this run validated"
            echo
            echo "Planner: $PLANNER_VERSION ($PLANNER_HASH)"
            echo "Event: $EVENT_NAME"
            echo "Post-merge provenance: ${PROVENANCE_OUTCOME:-not-applicable}"
            echo "Planner reason: ${PLANNER_REASON:-none}"
            echo "Unknown product paths forcing fallback: ${PLANNER_UNKNOWN_PATHS:-none}"
            echo "Selected jobs: ${PLANNER_SELECTED_JOBS:-none}"
            echo "Skipped jobs: ${PLANNER_SKIPPED_JOBS:-none}"
            echo "Planner job decisions and reasons:"
            if [ -n "${PLANNER_DECISIONS:-}" ]; then
              printf '%s\n' "$PLANNER_DECISIONS"
            else
              echo "{}"
            fi
            echo
            describe "API test suite" "$BACKEND_API"
            describe "Domain and infrastructure test suites" "$BACKEND_CORE"
            describe "Client lint, type-check, and build" "$CLIENT"
            describe "Operator and recovery script contracts" "$CONTRACTS"
            describe "Browser journeys" "$BROWSER"
            describe "Browser journeys on the production build" "$PRODUCTION"
            describe "PostgreSQL migrations and secure bootstrap" "$POSTGRESQL"
            describe "CI metrics tooling tests" "$METRICS_TOOLING"
            echo
            if [ "$POST_MERGE_SKIP" = "true" ]; then
              echo "Trusted tested-tree provenance matched this exact main tree; the redundant post-merge product retest was skipped. Cache warming and the weekly/manual validation paths remain."
            elif [ "$DOCS_ONLY" = "true" ]; then
              echo "Classified as a documentation-only change, so no product gate ran. This tick is not evidence about the product."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # A skipped job is deliberate and allowed; a failed one is not. Reading each result explicitly rather
          # than relying on this job's own dependency behaviour, which treats a skipped dependency as a reason
          # to skip and would take this reporter down with it.
          failed=""
          for pair in "backend-api:$BACKEND_API" "backend-core:$BACKEND_CORE" "client:$CLIENT" "script-contracts:$CONTRACTS" "browser-pr:$BROWSER" "browser-production:$PRODUCTION" "postgresql-smoke:$POSTGRESQL"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            case "$result" in
              failure|cancelled) failed="$failed $name" ;;
            esac
          done
          if [ -n "$failed" ]; then
            echo "::error::These gates did not pass:$failed"
            exit 1
          fi

          # The guard that used to live inside `validate`, moved here because the thing it protects against is
          # now spread over four jobs and no single one of them can see it. A change that is not documentation
          # must have had its backend tested or its client validated; if neither ran, this tick is not evidence
          # about the product and must not be usable as one. The classifier already avoids selecting nothing —
          # this stays machine-checkable in case that ever regresses.
          #
          # A launcher-only change is the one case where neither is the right evidence. No product suite can
          # observe a cmd shim, so running them would prove nothing about the change; the launcher contract in
          # script-contracts reads every launcher and is what actually vouches for it. That job is required to
          # have passed, so this is a different evidence requirement rather than an exemption from one.
          if [ "$LAUNCHERS_ONLY" = "true" ]; then
            if [ "$CONTRACTS" != "success" ]; then
              echo "::error::A launcher-only change must be validated by the operator and recovery script contracts, and they did not pass."
              exit 1
            fi
          elif [ "$POST_MERGE_SKIP" != "true" ] && [ "$DOCS_ONLY" != "true" ] && [ "$BACKEND_API" != "success" ] && [ "$CLIENT" != "success" ]; then
            echo "::error::This run tested no backend and validated no client, so its result is not evidence."
            echo "Classify the changed paths in the changes job, or mark the change as documentation-only."
            exit 1
          fi

          # A merge-group run is the last thing between a commit and main, so "skipped" is not an acceptable
          # answer from the gates that decide whether the product works. On a pull request a skip is a
          # deliberate classification; here it means the queue is about to merge on evidence nobody produced.
          #
          # This is the same principle as the guard in `validate`, applied to the moment it matters most: the
          # check cannot be skipped into a pass. It exists because the conditions above are easy to get wrong
          # in a way that is invisible — a job gated on `pull_request` silently disappears in a queue.
          if [ "$EVENT_NAME" = "merge_group" ] && [ "$DOCS_ONLY" != "true" ]; then
            missing=""
            for pair in "backend-api:$BACKEND_API" "backend-core:$BACKEND_CORE" "client:$CLIENT" "script-contracts:$CONTRACTS" "browser-pr:$BROWSER" "browser-production:$PRODUCTION"; do
              name="${pair%%:*}"
              result="${pair#*:}"
              [ "$result" = "success" ] || missing="$missing $name"
            done
            if [ -n "$missing" ]; then
              echo "::error::A merge-queue run must actually execute the product gates. These did not run:$missing"
              exit 1
            fi
          fi
      # Product enforcement is complete before any telemetry prerequisite. This checkout exists only so the
      # later metric scripts can run; it is isolated and cannot affect the authoritative enforcement result.
      - name: Check out repository
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Mark setup complete
        continue-on-error: true
        run: node "${{ github.workspace }}/product/ci-metrics/bin/mark.mjs" setup-end
      - name: Mark test complete
        if: always()
        continue-on-error: true
        run: node "${{ github.workspace }}/product/ci-metrics/bin/mark.mjs" test-end
      - name: Compute metrics gate dependencies
        continue-on-error: true
        shell: bash
        run: |
          needs="changes,metrics-tooling"
          if [ "${{ needs.changes.outputs.post_merge_skip }}" != "true" ]; then
            if [ "${{ needs.changes.outputs.backend }}" = "true" ]; then needs="$needs,backend-api,backend-core"; fi
            if [ "${{ needs.changes.outputs.client }}" = "true" ]; then needs="$needs,client"; fi
            if [ "${{ needs.changes.outputs.docs_only }}" != "true" ]; then needs="$needs,script-contracts"; fi
          fi
          effective_event="${{ inputs.pull_request_number != '' && 'pull_request' || github.event_name }}"
          if [ "${{ needs.changes.outputs.browser }}" = "true" ]; then
            if [ "$effective_event" = "pull_request" ] || [ "$effective_event" = "merge_group" ]; then
              needs="$needs,browser-pr"
            fi
            if [ "${{ github.event_name }}" != "push" ]; then needs="$needs,browser-production"; fi
          fi
          if [ "${{ needs.changes.outputs.post_merge_skip }}" != "true" ] && [ "${{ needs.changes.outputs.postgresql }}" = "true" ]; then needs="$needs,postgresql-smoke"; fi
          echo "METRICS_NEEDS=$needs" >> "$GITHUB_ENV"
      - name: Write metrics fragment
        if: always()
        continue-on-error: true
        env:
          METRICS_JOB_RESULT: ${{ job.status }}
          METRICS_NEEDS: ${{ env.METRICS_NEEDS }}
          METRICS_CLASS_DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          METRICS_CLASS_BACKEND: ${{ needs.changes.outputs.backend }}
          METRICS_CLASS_CLIENT: ${{ needs.changes.outputs.client }}
          METRICS_CLASS_BROWSER: ${{ needs.changes.outputs.browser }}
          METRICS_CLASS_POSTGRESQL: ${{ needs.changes.outputs.postgresql }}
        run: node "${{ github.workspace }}/product/ci-metrics/bin/write-fragment.mjs"
      - name: Upload metrics fragment
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-metrics-fragment-gate-${{ github.run_attempt }}
          path: ${{ env.METRICS_FRAGMENT_PATH }}
          if-no-files-found: ignore
          retention-days: 30

  # The metrics tooling is CI-only and never merge authority: its job is deliberately NOT part of the
  # failure list above, so a metrics bug cannot turn a correct product gate red. It is still visible in the
  # authoritative summary, which is the point: the tooling that will observe CI must itself be observed.
  metrics-tooling:
    name: CI metrics tooling tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      METRICS_JOB_ID: metrics-tooling
      METRICS_JOB_NAME: CI metrics tooling tests
    steps:
      - name: Capture job start
        continue-on-error: true
        shell: bash
        run: |
          echo "METRICS_TIMING_FILE=${{ runner.temp }}/ci-metrics/timing-metrics-tooling.json" >> "$GITHUB_ENV"
          echo "METRICS_FRAGMENT_PATH=${{ runner.temp }}/ci-metrics/fragment-metrics-tooling.json" >> "$GITHUB_ENV"
          mkdir -p "${{ runner.temp }}/ci-metrics"
          printf '{"name":"job-start","at":%s}\n' "$(date +%s%3N)" >> "${{ runner.temp }}/ci-metrics/timing-metrics-tooling.json"
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Mark setup complete
        continue-on-error: true
        run: node "${{ github.workspace }}/product/ci-metrics/bin/mark.mjs" setup-end
      - name: Run metrics tooling tests from a clean checkout
        run: node --test --test-reporter=spec --test-reporter=junit --test-reporter-destination=stdout --test-reporter-destination=metrics-tooling.xml product/ci-metrics/tests/trx.test.mjs product/ci-metrics/tests/playwright.test.mjs product/ci-metrics/tests/fragment.test.mjs product/ci-metrics/tests/aggregate.test.mjs product/ci-metrics/tests/build-run-meta.test.mjs product/ci-metrics/tests/junit.test.mjs product/ci-metrics/tests/ci-workflow-contract.test.mjs product/ci-metrics/tests/zip.test.mjs product/ci-metrics/tests/rolling.test.mjs product/ci-metrics/tests/provenance.test.mjs product/ci-metrics/tests/api-telemetry.test.mjs
      - name: Mark test complete
        if: always()
        continue-on-error: true
        run: node "${{ github.workspace }}/product/ci-metrics/bin/mark.mjs" test-end
      - name: Write metrics fragment
        if: always()
        continue-on-error: true
        env:
          METRICS_JOB_RESULT: ${{ job.status }}
          METRICS_NEEDS: ""
          METRICS_COUNTS_SOURCE: node-junit
          METRICS_JUNIT_PATH: ${{ github.workspace }}/metrics-tooling.xml
        run: node "${{ github.workspace }}/product/ci-metrics/bin/write-fragment.mjs"
      - name: Upload metrics fragment
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-metrics-fragment-metrics-tooling-${{ github.run_attempt }}
          path: ${{ env.METRICS_FRAGMENT_PATH }}
          if-no-files-found: ignore
          retention-days: 30

  # Non-authoritative: runs after the required gate and after every independently selected producer,
  # aggregates the current run's fragment artifacts (all attempts; latest fragment per instance wins,
  # earlier attempts are superseded, and earlier-attempt-only evidence is flagged as fallback) against the
  # expected topology, and publishes bounded JSON + Markdown artifacts. A metrics failure cannot fail the
  # product gate because this job is not in the gate's needs or failure list. On pull_request/merge_group
  # runs the output is explicitly labelled shadow because the same-workflow checkout is PR-controlled;
  # trusted validation is phase B.
  metrics-report:
    name: Aggregate CI metrics
    if: always()
    needs: [gate, changes, warm-chromium-cache, browser-full]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build run metadata
        continue-on-error: true
        shell: bash
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CLASS_DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          CLASS_BACKEND: ${{ needs.changes.outputs.backend }}
          CLASS_CLIENT: ${{ needs.changes.outputs.client }}
          CLASS_BROWSER: ${{ needs.changes.outputs.browser }}
          CLASS_POSTGRESQL: ${{ needs.changes.outputs.postgresql }}
          METRICS_RUN_META_PATH: ${{ runner.temp }}/metrics/run-meta.json
        run: |
          tree="$(git rev-parse HEAD^{tree})"
          METRICS_TREE_SHA="$tree" node "${{ github.workspace }}/product/ci-metrics/bin/build-run-meta.mjs"
      - name: Download fragments
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # All attempts of this run: a partial rerun leaves non-rerun jobs on their earlier attempt, and
          # the aggregator selects the latest fragment per instance (earlier ones are recorded as
          # superseded). Artifact names are attempt-scoped so each downloads into its own subdirectory,
          # and ci-metrics-run-* merged reports are excluded by this prefix.
          pattern: ci-metrics-fragment-*
          path: ${{ runner.temp }}/fragments
      - name: Aggregate and publish summary
        if: always()
        continue-on-error: true
        run: |
          node "${{ github.workspace }}/product/ci-metrics/bin/aggregate.mjs" \
            "${{ runner.temp }}/fragments" \
            "${{ runner.temp }}/metrics/out" \
            "${{ runner.temp }}/metrics/run-meta.json"
          cat "${{ runner.temp }}/metrics/out/run-metrics.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Write validated-tree manifest
        if: always()
        continue-on-error: true
        env:
          VALIDATED_RUN_METRICS_PATH: ${{ runner.temp }}/metrics/out/run-metrics.json
          VALIDATED_TREE_OUTPUT_PATH: ${{ runner.temp }}/metrics/out/validated-tree.json
        run: node "${{ github.workspace }}/product/ci-metrics/bin/write-validated-tree.mjs"
      - name: Upload validated-tree manifest
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-tree-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/metrics/out/validated-tree.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload merged metrics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-metrics-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/metrics/out
          if-no-files-found: ignore
          retention-days: 30
