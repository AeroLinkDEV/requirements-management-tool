name: Agent 365 direct successor fix

on:
  push:
    branches:
      - agent/365-tcr-supersession-browser

permissions:
  contents: write

jobs:
  patch:
    if: ${{ contains(github.event.head_commit.message, '[agent-365-direct-fix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Apply exact successor navigation corrections
        shell: bash
        run: |
          python -c "import base64;exec(base64.b64decode(''))"
          git diff --check
          git config user.name "seanmccarthyns"
          git config user.email "seanmccarthyns@gmail.com"
          git add product/client/src/TestChangeRequestWorkspace.tsx product/client/src/TestingCoverageWorkspace.tsx product/client/src/testChangeReviewPresentation.ts product/client/tests/test-change-request-supersession-presentation.spec.ts
          git commit -m "Preserve exact successor navigation for all superseded reviews"
          git push origin "HEAD:${GITHUB_REF_NAME}"
