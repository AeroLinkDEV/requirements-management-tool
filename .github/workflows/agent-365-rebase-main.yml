name: Agent 365 refresh onto current main

on:
  push:
    branches:
      - agent/365-tcr-supersession-browser

permissions:
  contents: write

jobs:
  rebase:
    if: ${{ contains(github.event.head_commit.message, '[agent-365-rebase-run]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out full branch history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Rebase onto exact current main and publish safely
        shell: bash
        run: |
          git config user.name "seanmccarthyns"
          git config user.email "seanmccarthyns@gmail.com"
          git fetch origin main
          git rebase origin/main
          git commit --amend -m "[agent-365-rebased] Refresh issue 365 onto merged title/provenance main"
          git push --force-with-lease origin "HEAD:${GITHUB_REF_NAME}"
