name: Temporary OwnedProcess terminate-job determinism

on:
  push:
    branches:
      - chatgpt/568-ownedprocess-terminatejob-determinism

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Apply deterministic terminate-job fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          program = Path('product/test-planner/tools/OwnedProcess/Program.cs')
          s = program.read_text(encoding='utf-8')
          old = '''            var exit = RunOwned(CreateOptions(shell, status, output, error, env, new[] { "/d", "/c", "echo", "fault" }));
            var statusText = File.Exists(status) ? File.ReadAllText(status) : string.Empty;
          '''
          new = '''            // The terminate-job fault must reach TerminateJobAndDrain deterministically. A one-shot
            // `echo` root can disappear before the job count is sampled, making the injected failure timing-
            // dependent. For this one fault, launch a child that remains in the Job Object after cmd exits;
            // DrainJobAfterRootExit must then attempt TerminateJobObject and exercise the injected failure.
            var commandArgs = string.Equals(fault, "terminate-job", StringComparison.Ordinal)
                ? new[] { "/d", "/c", "start", "/b", "ping", "-n", "31", "127.0.0.1", ">", "nul" }
                : new[] { "/d", "/c", "echo", "fault" };
            var exit = RunOwned(CreateOptions(shell, status, output, error, env, commandArgs));
            var statusText = File.Exists(status) ? File.ReadAllText(status) : string.Empty;
          '''
          if s.count(old) != 1:
              raise SystemExit(f'FaultSelfTest anchor mismatch: {s.count(old)}')
          program.write_text(s.replace(old, new, 1), encoding='utf-8')

          test = Path('product/test-planner/tests/execution-contract.test.mjs')
          t = test.read_text(encoding='utf-8')
          marker = '''  for (const fault of ['create-job', 'set-job', 'close-job-create', 'create-pipe', 'set-handle', 'close-child-write', 'assign', 'resume', 'terminate-process', 'wait', 'exit-code', 'process-times', 'process-id', 'terminate-job', 'query-job', 'close-child-read-final', 'close-thread', 'close-process', 'close-job', 'capture-timeout', 'cancel-capture']) {
    execFileSync('dotnet', ['run', '--project', ownedProcessProject, '--configuration', 'Release', '--no-build', '--no-restore', '--', '--self-test-fault', fault], { cwd: repoRoot, stdio: 'ignore' })
  }
          '''
          replacement = marker + '''  // The terminate-job case used to be timing-sensitive because its root process could disappear before
  // job-drain sampled the job. Exercise it repeatedly so that regression cannot hide behind one lucky pass.
  for (let attempt = 0; attempt < 10; attempt += 1) {
    execFileSync('dotnet', ['run', '--project', ownedProcessProject, '--configuration', 'Release', '--no-build', '--no-restore', '--', '--self-test-fault', 'terminate-job'], { cwd: repoRoot, stdio: 'ignore' })
  }
'''
          if t.count(marker) != 1:
              raise SystemExit(f'execution contract anchor mismatch: {t.count(marker)}')
          test.write_text(t.replace(marker, replacement, 1), encoding='utf-8')
          '@ | python -
      - name: Validate targeted OwnedProcess fault contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --test --test-name-pattern='owned process boundary kills late descendants' product/test-planner/tests/execution-contract.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'OwnedProcess fault-path contract failed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }
      - name: Commit validated two-file repair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'seanmccarthyns'
          git config user.email 'seanmccarthyns@gmail.com'
          git add product/test-planner/tools/OwnedProcess/Program.cs product/test-planner/tests/execution-contract.test.mjs
          $paths = @(git diff --cached --name-only)
          if ($paths.Count -ne 2) { throw "Expected two staged product files, got $($paths.Count)." }
          git commit -m 'Make OwnedProcess terminate-job fault test deterministic'
          git push origin HEAD:chatgpt/568-ownedprocess-terminatejob-determinism
