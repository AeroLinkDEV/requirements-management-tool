name: Temporary OwnedProcess terminate-job determinism v2

on:
  push:
    branches:
      - chatgpt/568-ownedprocess-terminatejob-determinism

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Patch deterministic terminate-job fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $programPath = 'product/test-planner/tools/OwnedProcess/Program.cs'
          $program = Get-Content -Raw -LiteralPath $programPath
          $old = '            var exit = RunOwned(CreateOptions(shell, status, output, error, env, new[] { "/d", "/c", "echo", "fault" }));'
          if (($program.Split($old).Count - 1) -ne 1) { throw 'FaultSelfTest anchor mismatch.' }
          $replacement = '            var commandArgs = string.Equals(fault, "terminate-job", StringComparison.Ordinal)' + "`n" + '                ? new[] { "/d", "/c", "start", "/b", "ping", "-n", "31", "127.0.0.1", ">", "nul" }' + "`n" + '                : new[] { "/d", "/c", "echo", "fault" };' + "`n" + '            var exit = RunOwned(CreateOptions(shell, status, output, error, env, commandArgs));'
          [IO.File]::WriteAllText((Resolve-Path $programPath), $program.Replace($old, $replacement), $utf8)
          $testPath = 'product/test-planner/tests/execution-contract.test.mjs'
          $tests = Get-Content -Raw -LiteralPath $testPath
          $marker = '  assert.match(ownedProcessSource, /CLEANUP\|handles=failed/)'
          if (($tests.Split($marker).Count - 1) -ne 1) { throw 'Execution contract anchor mismatch.' }
          $extra = $marker + "`n" + '  assert.match(ownedProcessSource, /string\.Equals\(fault, "terminate-job", StringComparison\.Ordinal\)/)' + "`n" + '  assert.match(ownedProcessSource, /"start", "\/b", "ping", "-n", "31"/)'
          [IO.File]::WriteAllText((Resolve-Path $testPath), $tests.Replace($marker, $extra), $utf8)
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Patch failed git diff --check.' }
      - name: Stress injected terminate-job failure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = 'product/test-planner/tools/OwnedProcess/OwnedProcess.csproj'
          dotnet build $project --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'OwnedProcess build failed.' }
          foreach ($attempt in 1..12) {
            dotnet run --project $project --configuration Release --no-build --no-restore -- --self-test-fault terminate-job
            if ($LASTEXITCODE -ne 0) { throw "terminate-job fault self-test failed on iteration $attempt." }
          }
      - name: Run targeted planner contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --test --test-name-pattern='owned process boundary kills late descendants' product/test-planner/tests/execution-contract.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Targeted OwnedProcess contract failed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Final git diff --check failed.' }
      - name: Commit validated repair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'seanmccarthyns'
          git config user.email 'seanmccarthyns@gmail.com'
          git add product/test-planner/tools/OwnedProcess/Program.cs product/test-planner/tests/execution-contract.test.mjs
          $paths = @(git diff --cached --name-only)
          if ($paths.Count -ne 2) { throw "Expected two staged product files, got $($paths.Count)." }
          git commit -m 'Make OwnedProcess terminate-job fault test deterministic'
          git push origin HEAD:chatgpt/568-ownedprocess-terminatejob-determinism
