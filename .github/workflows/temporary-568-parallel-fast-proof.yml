name: Temporary #568 exact warmed Fast proof v2

on:
  push:
    branches:
      - chatgpt/568-parallel-fast-proof

permissions:
  contents: read

jobs:
  proof:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out proof orchestrator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: orchestrator
          fetch-depth: 1
      - name: Check out exact clean PR 616 head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 6abaa473e676c0fcd59655b22df9dd8034beb134
          path: target
          fetch-depth: 1
      - name: Install .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v5.2.0
        with:
          dotnet-version: 10.0.x
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Prepare normal warmed developer state
        shell: pwsh
        working-directory: target
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore product/AeroLink.slnx
          if ($LASTEXITCODE -ne 0) { throw 'Solution restore failed.' }
          dotnet build product/AeroLink.slnx --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Initial Release build failed.' }
          Push-Location product/client
          try {
            npm ci
            if ($LASTEXITCODE -ne 0) { throw 'Client dependency install failed.' }
            npx playwright install chromium
            if ($LASTEXITCODE -ne 0) { throw 'Chromium preparation failed.' }
          } finally { Pop-Location }
      - name: Measure exact warmed Fast wrapper
        shell: pwsh
        working-directory: target
        run: |
          $ErrorActionPreference = 'Stop'
          $transcript = Join-Path $env:RUNNER_TEMP 'aerolink-568-parallel-fast-proof.txt'
          $resultPath = Join-Path $env:RUNNER_TEMP 'aerolink-568-parallel-fast-result.json'
          & ./product/scripts/Get-AeroLinkTestPlan.ps1 -Paths 'product/src/AeroLink.Domain/Requirements/Requirement.cs' -Mode Fast -Explain *>&1 | Tee-Object -FilePath $transcript | ForEach-Object { Write-Host $_ }
          $nativeExit = $LASTEXITCODE
          $line = Get-Content -LiteralPath $transcript | Where-Object { $_ -like 'AEROLINK_TEST_PLAN_RESULT=*' } | Select-Object -Last 1
          if (-not $line) { throw "Fast wrapper emitted no bounded result; native exit was $nativeExit." }
          $json = $line.Substring('AEROLINK_TEST_PLAN_RESULT='.Length) | ConvertFrom-Json -Depth 30
          $json | ConvertTo-Json -Depth 30 | Out-File -LiteralPath $resultPath -Encoding utf8
          if ($nativeExit -ne 0 -or $json.execution.status -ne 'passed') { throw "Fast wrapper failed; status=$($json.execution.status)." }
          if ($json.execution.authoritative -ne $false) { throw 'Fast proof incorrectly claimed merge authority.' }
          if ($json.execution.resources.persistentPostgreSqlTouched -ne $false -or $json.execution.resources.persistentEvidenceRootTouched -ne $false) { throw 'Fast proof touched a persistent resource.' }
          $totalMs = [int64]$json.execution.timing.totalMs
          if ($totalMs -gt 240000) { throw "Exact warmed Fast proof exceeded four minutes: $totalMs ms." }
          $stepText = @($json.execution.timing.steps | ForEach-Object { "$($_.label)=$($_.elapsedMs)ms" }) -join '; '
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '## 568 exact PR 616 warmed Fast proof'
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ''
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value 'Status: passed'
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Exact target: 6abaa473e676c0fcd59655b22df9dd8034beb134"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Measured wrapper time: $totalMs ms"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value 'Target: <= 240000 ms'
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Steps: $stepText"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value 'Persistent PostgreSQL/evidence: untouched'
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value 'Result is non-authoritative local feedback; protected GitHub PR gate remains merge authority.'
      - name: Upload bounded timing proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aerolink-568-exact-warmed-fast-v2-${{ github.run_id }}
          path: |
            ${{ runner.temp }}\aerolink-568-parallel-fast-proof.txt
            ${{ runner.temp }}\aerolink-568-parallel-fast-result.json
          if-no-files-found: warn
          retention-days: 14
