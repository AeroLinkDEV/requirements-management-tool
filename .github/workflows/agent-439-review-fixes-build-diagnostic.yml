name: PR 439 review fixes build diagnostic

on:
  push:
    branches:
      - agent/421-424-exact-procedure-history

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ contains(github.event.head_commit.message, '[agent-439-build-diagnostic]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply structurally anchored corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/agent-439-review-fixes-final.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(workflow) if line.strip() == "python - <<'PY'")
          end = next(i for i in range(start + 1, len(workflow)) if workflow[i].strip() == 'PY')
          source = textwrap.dedent('\n'.join(workflow[start + 1:end]))
          exec(compile(source, 'agent-439-final-patch.py', 'exec'))
          PY

      - name: Install .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Restore and compile complete solution
        shell: bash
        run: |
          dotnet restore product/AeroLink.slnx
          dotnet build product/AeroLink.slnx --configuration Release --no-restore --verbosity normal
