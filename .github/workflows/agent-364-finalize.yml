name: Agent 364 final product completion

on:
  push:
    branches:
      - agent/364-legacy-procedure-manifest-bootstrap

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ contains(github.event.head_commit.message, '[agent-364-finalize]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Complete explicit Configuration Manager workflow and qualification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one match, found {count}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'product/client/src/routing.ts',
              '  if (path === "release-planning" || path === "baselines") return { ...base, view: "notFound", discipline: "system" };',
              '  if (path === "release-planning") return { ...base, view: "notFound", discipline: "system" };\n'
              '  if (path === "baselines") return { ...base, view: "baselines", discipline: "system" };')

          replace_once(
              'product/client/src/App.tsx',
              '  const releaseView = ["release","releaseImpact","releaseDecision","releaseOperations","enterprise"].includes(view);',
              '  const releaseView = ["release","releaseImpact","releaseDecision","releaseOperations","enterprise","baselines"].includes(view);')
          replace_once(
              'product/client/src/App.tsx',
              '        <details className="navGroup" open={releaseView}><summary>RELEASE</summary>{item("Lifecycle Decision Room","release","◆","system","Lifecycle Decision Room / Release Readiness")}</details>',
              '        <details className="navGroup" open={releaseView}><summary>RELEASE</summary>{item("Lifecycle Decision Room","release","◆","system","Lifecycle Decision Room / Release Readiness")}{item("Configuration Baselines","baselines","▦","system","Configuration Baselines / Legacy Procedure Bootstrap")}</details>')

          replace_once(
              'product/client/src/BaselineCenter.tsx',
              "import { stateLabel } from './presentation'\n",
              "import { stateLabel } from './presentation'\nimport LegacyProcedureBootstrapPanel from './LegacyProcedureBootstrapPanel'\n")
          replace_once(
              'product/client/src/BaselineCenter.tsx',
              '''                </div>
                {detail.state === "Frozen" && (''',
              '''                </div>
                {detail.requirementsMaterializedAt && (
                  <LegacyProcedureBootstrapPanel
                    api={api}
                    baselineId={detail.id}
                    onCompleted={async () => {
                      await loadList();
                      await loadDetail();
                    }}
                  />
                )}
                {detail.state === "Frozen" && (''')

          Path('product/client/src/LegacyProcedureBootstrapPanel.tsx').write_text(textwrap.dedent(r'''
              import { useCallback, useEffect, useState } from 'react'
              import { PersonName } from './People'

              type Preview = {
                baselineId: string
                baselineDisplayNumber: string
                proceduresHash: string
                activeProcedureCount: number
                retiredProcedureCount: number
                draftRevisionCount: number
                selectionRule: string
                alreadyBootstrapped: boolean
                recordedAt?: string
                recordedBy?: string
              }

              type Props = {
                api: string
                baselineId: string
                onCompleted: () => void | Promise<void>
              }

              export default function LegacyProcedureBootstrapPanel({ api, baselineId, onCompleted }: Props) {
                const [preview, setPreview] = useState<Preview>()
                const [hidden, setHidden] = useState(false)
                const [confirmed, setConfirmed] = useState(false)
                const [busy, setBusy] = useState(false)
                const [error, setError] = useState('')

                const load = useCallback(async () => {
                  setError('')
                  const response = await fetch(`${api}/api/baselines/${baselineId}/legacy-procedure-manifest-bootstrap`)
                  if ([400, 403, 404].includes(response.status)) {
                    setHidden(true)
                    setPreview(undefined)
                    return
                  }
                  if (!response.ok) {
                    setError('The legacy procedure snapshot preview could not be loaded.')
                    return
                  }
                  setHidden(false)
                  setPreview(await response.json())
                }, [api, baselineId])

                useEffect(() => {
                  setPreview(undefined)
                  setHidden(false)
                  setConfirmed(false)
                  void load()
                }, [load])

                const establish = async () => {
                  if (!preview || !confirmed || busy) return
                  setBusy(true)
                  setError('')
                  const response = await fetch(
                    `${api}/api/baselines/${baselineId}/legacy-procedure-manifest-bootstrap`,
                    {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({
                        expectedHash: preview.proceduresHash,
                        confirmLegacySnapshot: true,
                      }),
                    },
                  )
                  const body = await response.json().catch(() => ({})) as Preview & { error?: string }
                  if (!response.ok) {
                    setError(body.error || 'The legacy procedure snapshot could not be established.')
                    setBusy(false)
                    return
                  }
                  setPreview(body)
                  setConfirmed(false)
                  setBusy(false)
                  await onCompleted()
                }

                if (hidden || !preview) return error ? <div className="workspaceError">{error}</div> : null

                return (
                  <section className="baselineCard" aria-label="Legacy procedure manifest bootstrap">
                    <div className="baselineCardTitle">
                      <div>
                        <p className="eyebrow">LEGACY CONFIGURATION MIGRATION</p>
                        <h3>Legacy procedure manifest</h3>
                        <p>
                          Exact procedure membership for {preview.baselineDisplayNumber}, established from the
                          controlled inventory that exists now.
                        </p>
                      </div>
                      {preview.alreadyBootstrapped && <div className="frozenMark">✓ Snapshot established</div>}
                    </div>
                    <div className="hashPanel">
                      <span>PROCEDURE MANIFEST SHA-256</span>
                      <code>{preview.proceduresHash}</code>
                      <p>{preview.selectionRule}</p>
                    </div>
                    <div className="manifestStats">
                      <div><b>{preview.activeProcedureCount}</b><span>active revisions included</span></div>
                      <div><b>{preview.retiredProcedureCount}</b><span>retired identities suppressed</span></div>
                      <div><b>{preview.draftRevisionCount}</b><span>draft revisions excluded</span></div>
                    </div>
                    {preview.alreadyBootstrapped ? (
                      <p>
                        Recorded {preview.recordedAt ? new Date(preview.recordedAt).toLocaleString() : 'at the controlled event time'}
                        {preview.recordedBy && <> by <PersonName userName={preview.recordedBy} /></>}.
                        This is an immutable legacy bootstrap snapshot, not reconstructed historical release evidence.
                      </p>
                    ) : (
                      <>
                        <div className="workspaceWarning" role="note">
                          This operation records a migration snapshot of the current legacy controlled inventory.
                          It does not claim that this exact membership was recorded when the historical build was released.
                        </div>
                        <label>
                          <input
                            type="checkbox"
                            checked={confirmed}
                            onChange={event => setConfirmed(event.target.checked)}
                          />{' '}
                          I confirm the displayed hash and understand the historical-evidence limitation.
                        </label>
                        {error && <div className="workspaceError">{error}</div>}
                        <div className="baselineActions">
                          <button type="button" disabled={!confirmed || busy} onClick={establish}>
                            {busy ? 'Establishing…' : 'Establish legacy procedure snapshot'}
                          </button>
                        </div>
                      </>
                    )}
                  </section>
                )
              }
          ''').lstrip(), encoding='utf-8')

          Path('product/tests/AeroLink.Api.Tests/LegacyProcedureManifestBootstrapApiTests.cs').write_text(textwrap.dedent(r'''
              using System.Net;
              using System.Net.Http.Json;
              using System.Text.Json;
              using AeroLink.Domain.Baselines;
              using AeroLink.Domain.ChangeControl;
              using AeroLink.Domain.Identity;
              using AeroLink.Domain.Programs;
              using AeroLink.Domain.Requirements;
              using AeroLink.Domain.Verification;
              using AeroLink.Infrastructure.Persistence;
              using Microsoft.EntityFrameworkCore;
              using Microsoft.Extensions.DependencyInjection;

              namespace AeroLink.Api.Tests;

              public sealed class LegacyProcedureManifestBootstrapApiTests
              {
                  private sealed record Fixture(Guid BaselineId, Guid ProcedureId, Guid RevisionId);

                  private static async Task<Fixture> SeedAsync(AeroLinkApiFactory factory)
                  {
                      using var scope = factory.Services.CreateScope();
                      var db = scope.ServiceProvider.GetRequiredService<AeroLinkDbContext>();
                      var now = DateTimeOffset.UtcNow;
                      var program = new ProgramRecord("Legacy Bootstrap API", "LBAPI");
                      var project = new ProjectRecord(program.Id, "Legacy Product", "Legacy Software");
                      var release = new SoftwareRelease(project.Id, "1.5", true);
                      var request = new SystemChangeRequest("SRCR-09600", 0, project.Id, release.Id,
                          "Legacy inventory", "Problem", "Analysis", "Solution", "author", now);
                      request.AddRequirementChange("author", "SYSR-09600000", 0, RequirementLevel.System,
                          RequirementChangeKind.Introduce, "The product shall preserve controlled verification evidence.",
                          "Migration integrity.", "Test", now);
                      request.SubmitForReview("author", [new ApproverSelection("reviewer", "Reviewer")], now);
                      request.ApproveActiveStage("reviewer", now.AddMinutes(1));
                      var baseline = new CandidateBaseline("SW-96.00", 0, project.Id, release.Id, null,
                          "Released legacy baseline", "cm", now);
                      baseline.Select(request, "cm", now);
                      baseline.Freeze("cm", now.AddMinutes(1));
                      baseline.MarkRequirementsMaterialized("cm", new string('a', 64), 1, now.AddMinutes(2));
                      baseline.MarkReleased("cm", now.AddMinutes(3));
                      var procedure = new TestProcedure(project.Id, "SYSTP-096001", "Legacy smoke procedure",
                          "legacy.author", now, TestProcedureLevel.System);
                      var revision = new TestProcedureRevision(procedure.Id, 0, "Verify legacy smoke behavior.",
                          "Configured product.", "1. Exercise the behavior.", "Behavior is correct.",
                          TestProcedureState.Approved, "legacy.author", now);
                      db.AddRange(program, project, release, request, baseline, procedure, revision);
                      foreach (var (name, role) in new[]
                               {
                                   ("legacy.cm", ProgramRole.ConfigurationManager),
                                   ("legacy.reader", ProgramRole.Engineer),
                               })
                      {
                          var account = new UserAccount(name, name, $"{name}@example.test",
                              IdentityService.HashPassword(AeroLinkApiFactory.MemberPassword), now);
                          db.Add(account);
                          db.Add(new ProgramMembership(account.Id, program.Id, role, "test.setup", now));
                      }
                      await db.SaveChangesAsync();
                      return new Fixture(baseline.Id, procedure.Id, revision.Id);
                  }

                  private static async Task LoginAsync(HttpClient client, string userName)
                  {
                      using var response = await client.PostAsJsonAsync("/api/auth/login",
                          new { userName, password = AeroLinkApiFactory.MemberPassword });
                      Assert.Equal(HttpStatusCode.OK, response.StatusCode);
                      await SecurityBoundaryTests.AuthorizeMutationsAsync(client);
                  }

                  [Fact]
                  public async Task Preview_confirmation_authority_and_idempotency_are_enforced_by_the_API()
                  {
                      using var factory = new AeroLinkApiFactory();
                      var fixture = await SeedAsync(factory);

                      using var reader = factory.CreateClient();
                      await LoginAsync(reader, "legacy.reader");
                      using var deniedPreview = await reader.GetAsync(
                          $"/api/baselines/{fixture.BaselineId}/legacy-procedure-manifest-bootstrap");
                      Assert.Equal(HttpStatusCode.Forbidden, deniedPreview.StatusCode);
                      using var deniedMutation = await reader.PostAsJsonAsync(
                          $"/api/baselines/{fixture.BaselineId}/legacy-procedure-manifest-bootstrap",
                          new { expectedHash = new string('0', 64), confirmLegacySnapshot = true });
                      Assert.Equal(HttpStatusCode.Forbidden, deniedMutation.StatusCode);

                      using var cm = factory.CreateClient();
                      await LoginAsync(cm, "legacy.cm");
                      using var previewResponse = await cm.GetAsync(
                          $"/api/baselines/{fixture.BaselineId}/legacy-procedure-manifest-bootstrap");
                      var previewBody = await previewResponse.Content.ReadAsStringAsync();
                      Assert.True(previewResponse.StatusCode == HttpStatusCode.OK, previewBody);
                      var preview = JsonSerializer.Deserialize<JsonElement>(previewBody);
                      Assert.False(preview.GetProperty("alreadyBootstrapped").GetBoolean());
                      Assert.Equal(1, preview.GetProperty("activeProcedureCount").GetInt32());
                      Assert.Equal(64, preview.GetProperty("proceduresHash").GetString()!.Length);
                      var hash = preview.GetProperty("proceduresHash").GetString()!;

                      using var unconfirmed = await cm.PostAsJsonAsync(
                          $"/api/baselines/{fixture.BaselineId}/legacy-procedure-manifest-bootstrap",
                          new { expectedHash = hash, confirmLegacySnapshot = false });
                      Assert.Equal(HttpStatusCode.BadRequest, unconfirmed.StatusCode);

                      using var applied = await cm.PostAsJsonAsync(
                          $"/api/baselines/{fixture.BaselineId}/legacy-procedure-manifest-bootstrap",
                          new { expectedHash = hash, confirmLegacySnapshot = true });
                      var appliedBody = await applied.Content.ReadAsStringAsync();
                      Assert.True(applied.StatusCode == HttpStatusCode.OK, appliedBody);
                      Assert.True(JsonSerializer.Deserialize<JsonElement>(appliedBody)
                          .GetProperty("alreadyBootstrapped").GetBoolean());

                      using var retried = await cm.PostAsJsonAsync(
                          $"/api/baselines/{fixture.BaselineId}/legacy-procedure-manifest-bootstrap",
                          new { expectedHash = hash, confirmLegacySnapshot = true });
                      Assert.Equal(HttpStatusCode.OK, retried.StatusCode);

                      using var verifyScope = factory.Services.CreateScope();
                      var db = verifyScope.ServiceProvider.GetRequiredService<AeroLinkDbContext>();
                      var member = await db.BaselineTestProcedures.SingleAsync(x => x.BaselineId == fixture.BaselineId);
                      Assert.Equal(fixture.ProcedureId, member.ProcedureId);
                      Assert.Equal(fixture.RevisionId, member.RevisionId);
                      var recorded = await db.BaselineEvents.Where(x => x.BaselineId == fixture.BaselineId
                          && x.EventType == "LegacyProcedureManifestBootstrapped").ToListAsync();
                      Assert.Single(recorded);
                      Assert.Equal("legacy.cm", recorded.Single().ActorId);
                  }
              }
          ''').lstrip(), encoding='utf-8')

          Path('product/tests/AeroLink.Infrastructure.Tests/LegacyProcedureManifestBootstrapLifecycleTests.cs').write_text(textwrap.dedent(r'''
              using AeroLink.Domain.Baselines;
              using AeroLink.Domain.ChangeControl;
              using AeroLink.Domain.Programs;
              using AeroLink.Domain.Requirements;
              using AeroLink.Domain.Verification;
              using AeroLink.Infrastructure.Persistence;
              using Microsoft.EntityFrameworkCore;

              namespace AeroLink.Infrastructure.Tests;

              public sealed class LegacyProcedureManifestBootstrapLifecycleTests
              {
                  [Fact]
                  public async Task Bootstrapped_membership_carries_forward_then_normal_modify_retire_and_introduce_apply()
                  {
                      var path = Path.Combine(Path.GetTempPath(), $"aerolink-legacy-lifecycle-{Guid.NewGuid():N}.db");
                      var options = new DbContextOptionsBuilder<AeroLinkDbContext>()
                          .UseSqlite($"Data Source={path};Pooling=False").Options;
                      try
                      {
                          await using var db = new AeroLinkDbContext(options);
                          await db.Database.EnsureCreatedAsync();
                          var now = DateTimeOffset.UtcNow;
                          var program = new ProgramRecord("Legacy Lifecycle", "LBLIFE");
                          var project = new ProjectRecord(program.Id, "Flight Management", "Legacy FMS");
                          var release15 = new SoftwareRelease(project.Id, "1.5", true);
                          var source15 = ApprovedRequest(project.Id, release15.Id, "SRCR-09500", now);
                          var baseline15 = FrozenBaseline(project.Id, release15.Id, source15, "SW-95.00", now);
                          var first = new TestProcedure(project.Id, "SYSTP-095001", "First legacy procedure",
                              "legacy.author", now, TestProcedureLevel.System);
                          var first00 = Revision(first.Id, 0, TestProcedureState.Approved, now);
                          var second = new TestProcedure(project.Id, "SYSTP-095002", "Second legacy procedure",
                              "legacy.author", now, TestProcedureLevel.System);
                          var second00 = Revision(second.Id, 0, TestProcedureState.Approved, now);
                          db.AddRange(program, project, release15, source15, baseline15, first, first00, second, second00);
                          await db.SaveChangesAsync();

                          var bootstrap = new LegacyProcedureManifestBootstrapper(db);
                          var preview = (await bootstrap.PreviewAsync(baseline15.Id, CancellationToken.None))!;
                          await bootstrap.BootstrapAsync(baseline15.Id, "migration.cm", preview.ProceduresHash,
                              now.AddHours(1), CancellationToken.None);

                          var release16 = new SoftwareRelease(project.Id, "1.6", false, release15.Id);
                          var source16 = ApprovedRequest(project.Id, release16.Id, "SRCR-09501", now);
                          var baseline16 = FrozenBaseline(project.Id, release16.Id, source16, "SW-95.10",
                              now.AddHours(2), baseline15.Id);
                          db.AddRange(release16, source16, baseline16);
                          await db.SaveChangesAsync();
                          await new TestProcedureBaselineMaterializer(db).MaterializeAsync(
                              baseline16.Id, "cm", now.AddHours(3), CancellationToken.None);
                          var carried = await db.BaselineTestProcedures.AsNoTracking()
                              .Where(x => x.BaselineId == baseline16.Id).Select(x => x.RevisionId).ToListAsync();
                          Assert.Equal(2, carried.Count);
                          Assert.Contains(first00.Id, carried);
                          Assert.Contains(second00.Id, carried);

                          var release17 = new SoftwareRelease(project.Id, "1.7", false, release16.Id);
                          var source17 = ApprovedRequest(project.Id, release17.Id, "SRCR-09502", now);
                          var baseline17 = FrozenBaseline(project.Id, release17.Id, source17, "SW-95.20",
                              now.AddHours(4), baseline16.Id);
                          var tcr = new TestChangeReview(project.Id, release17.Id, source17.Id,
                              TestChangeReviewDiscipline.System, source17.DisplayNumber, now.AddHours(4));
                          tcr.RecordTestChangeRequired("verification.engineer", now.AddHours(4));
                          tcr.WriteCase("verification.engineer", "Legacy successor procedure work", "Problem",
                              "Analysis", "Solution", now.AddHours(4));
                          tcr.AssignControlledNumber("SYSTCR-09502", now.AddHours(4));
                          tcr.AddProcedureChange("verification.engineer", Change("SYSTP-095001", 1,
                              TestProcedureChangeKind.Modify, "First procedure revised"), now.AddHours(4));
                          tcr.AddProcedureChange("verification.engineer", Change("SYSTP-095002", 1,
                              TestProcedureChangeKind.Retire, ""), now.AddHours(4));
                          tcr.AddProcedureChange("verification.engineer", Change("SYSTP-095003", 0,
                              TestProcedureChangeKind.Introduce, "New successor procedure"), now.AddHours(4));
                          tcr.Submit("verification.engineer", "test.lead", true, now.AddHours(4).AddMinutes(1));
                          tcr.Approve("test.lead", "Reviewed.", now.AddHours(4).AddMinutes(2));
                          db.AddRange(release17, source17, baseline17, tcr);
                          await db.SaveChangesAsync();
                          baseline17.SelectTestChangeRequest(tcr, "verification.lead", now.AddHours(4).AddMinutes(3));
                          await db.SaveChangesAsync();

                          await new TestProcedureBaselineMaterializer(db).MaterializeAsync(
                              baseline17.Id, "cm", now.AddHours(5), CancellationToken.None);

                          var predecessorStillExact = await db.BaselineTestProcedures.AsNoTracking()
                              .Where(x => x.BaselineId == baseline16.Id).Select(x => x.RevisionId).ToListAsync();
                          Assert.Contains(first00.Id, predecessorStillExact);
                          Assert.Contains(second00.Id, predecessorStillExact);

                          var finalMembers = await (from member in db.BaselineTestProcedures.AsNoTracking()
                                                  join procedure in db.TestProcedures.AsNoTracking()
                                                      on member.ProcedureId equals procedure.Id
                                                  join revision in db.TestProcedureRevisions.AsNoTracking()
                                                      on member.RevisionId equals revision.Id
                                                  where member.BaselineId == baseline17.Id
                                                  orderby procedure.BaseNumber
                                                  select new { procedure.BaseNumber, revision.Revision, revision.SourceTestChangeRequestId })
                              .ToListAsync();
                          Assert.Equal(2, finalMembers.Count);
                          Assert.Contains(finalMembers, x => x.BaseNumber == "SYSTP-095001" && x.Revision == 1
                              && x.SourceTestChangeRequestId == tcr.Id);
                          Assert.Contains(finalMembers, x => x.BaseNumber == "SYSTP-095003" && x.Revision == 0
                              && x.SourceTestChangeRequestId == tcr.Id);
                          Assert.DoesNotContain(finalMembers, x => x.BaseNumber == "SYSTP-095002");
                          var retired = await db.TestProcedureRevisions.AsNoTracking()
                              .SingleAsync(x => x.ProcedureId == second.Id && x.Revision == 1);
                          Assert.Equal(TestProcedureState.Retired, retired.State);
                      }
                      finally { File.Delete(path); }
                  }

                  private static TestProcedureChangeDraft Change(string number, int revision,
                      TestProcedureChangeKind kind, string title) => new(number, revision,
                      TestProcedureLevel.System, kind, title,
                      kind == TestProcedureChangeKind.Retire ? "" : "Verify the successor behavior.",
                      "Configured product.", kind == TestProcedureChangeKind.Retire ? "" : "1. Exercise the behavior.",
                      kind == TestProcedureChangeKind.Retire ? "" : "Behavior is correct.",
                      "Approved successor procedure disposition.");

                  private static TestProcedureRevision Revision(Guid procedureId, int revision,
                      TestProcedureState state, DateTimeOffset now) => new(procedureId, revision,
                      "Verify the legacy behavior.", "Configured product.", "1. Exercise the behavior.",
                      "Behavior is correct.", state, "legacy.author", now);

                  private static CandidateBaseline FrozenBaseline(Guid projectId, Guid releaseId,
                      SystemChangeRequest source, string number, DateTimeOffset now, Guid? predecessorId = null)
                  {
                      var baseline = new CandidateBaseline(number, 0, projectId, releaseId, predecessorId,
                          "Controlled baseline", "cm", now);
                      baseline.Select(source, "cm", now);
                      baseline.Freeze("cm", now.AddMinutes(1));
                      baseline.MarkRequirementsMaterialized("cm", new string('a', 64), 1, now.AddMinutes(2));
                      return baseline;
                  }

                  private static SystemChangeRequest ApprovedRequest(Guid projectId, Guid releaseId,
                      string number, DateTimeOffset now)
                  {
                      var request = new SystemChangeRequest(number, 0, projectId, releaseId,
                          "Controlled source", "Problem", "Analysis", "Solution", "author", now);
                      request.AddRequirementChange("author", number.Replace("SRCR", "SYSR") + "00", 0,
                          RequirementLevel.System, RequirementChangeKind.Introduce,
                          "The product shall preserve controlled verification evidence.",
                          "Configuration integrity.", "Test", now);
                      request.SubmitForReview("author", [new ApproverSelection("reviewer", "Reviewer")], now);
                      request.ApproveActiveStage("reviewer", now.AddMinutes(1));
                      return request;
                  }
              }
          ''').lstrip(), encoding='utf-8')

          Path('product/client/tests/legacy-procedure-bootstrap.spec.ts').write_text(textwrap.dedent(r'''
              import { expect, test } from '@playwright/test'
              import { login, openNavigationGroup, showcaseSeed } from './auth'

              test('a Configuration Manager previews, confirms, and revisits the exact legacy procedure snapshot', async ({ page, request }) => {
                const showcase = await showcaseSeed(request)
                const hash = '7'.repeat(64)
                let completed = false
                let submitted: { expectedHash?: string; confirmLegacySnapshot?: boolean } | undefined

                await page.route(
                  `**/api/baselines/${showcase.releasedBaselineId}/legacy-procedure-manifest-bootstrap`,
                  async route => {
                    if (route.request().method() === 'GET') {
                      await route.fulfill({
                        status: 200,
                        contentType: 'application/json',
                        body: JSON.stringify({
                          baselineId: showcase.releasedBaselineId,
                          baselineDisplayNumber: 'SW-01.50.00',
                          proceduresHash: hash,
                          activeProcedureCount: 17,
                          retiredProcedureCount: 2,
                          draftRevisionCount: 3,
                          selectionRule: 'Latest non-Draft controlled revision for each procedure in the same project; a latest Retired revision suppresses that procedure.',
                          alreadyBootstrapped: completed,
                          recordedAt: completed ? '2026-08-10T18:00:00Z' : null,
                          recordedBy: completed ? 'admin' : null,
                        }),
                      })
                      return
                    }
                    submitted = route.request().postDataJSON()
                    completed = true
                    await route.fulfill({
                      status: 200,
                      contentType: 'application/json',
                      body: JSON.stringify({
                        baselineId: showcase.releasedBaselineId,
                        baselineDisplayNumber: 'SW-01.50.00',
                        proceduresHash: hash,
                        activeProcedureCount: 17,
                        retiredProcedureCount: 2,
                        draftRevisionCount: 3,
                        selectionRule: 'Latest non-Draft controlled revision for each procedure in the same project; a latest Retired revision suppresses that procedure.',
                        alreadyBootstrapped: true,
                        recordedAt: '2026-08-10T18:00:00Z',
                        recordedBy: 'admin',
                      }),
                    })
                  },
                )

                await login(page, 'admin', { openProject: false })
                await page.getByRole('link', { name: 'Open FMS Product Development' }).click()
                await page.getByRole('button', { name: 'Open build 1.5' }).click()
                await openNavigationGroup(page, 'RELEASE & CONFIGURATION')
                await page.getByRole('link', { name: 'Configuration Baselines / Legacy Procedure Bootstrap' }).click()

                await expect(page).toHaveURL(/\/baselines$/)
                await expect(page.getByRole('heading', { name: 'Candidate Baselines' })).toBeVisible()
                const panel = page.getByRole('region', { name: 'Legacy procedure manifest bootstrap' })
                await expect(panel).toContainText('migration snapshot of the current legacy controlled inventory')
                await expect(panel).toContainText('17')
                await expect(panel).toContainText('2')
                await expect(panel).toContainText('3')
                await expect(panel).toContainText(hash)

                const establish = panel.getByRole('button', { name: 'Establish legacy procedure snapshot' })
                await expect(establish).toBeDisabled()
                await panel.getByRole('checkbox').check()
                await expect(establish).toBeEnabled()
                await establish.click()

                expect(submitted).toEqual({ expectedHash: hash, confirmLegacySnapshot: true })
                await expect(panel.getByText('Snapshot established')).toBeVisible()
                await expect(panel).toContainText('not reconstructed historical release evidence')

                const stableUrl = page.url()
                await page.reload()
                await expect(page).toHaveURL(stableUrl)
                await expect(page.getByRole('region', { name: 'Legacy procedure manifest bootstrap' }))
                  .toContainText('Snapshot established')
              })
          ''').lstrip(), encoding='utf-8')
          PY

