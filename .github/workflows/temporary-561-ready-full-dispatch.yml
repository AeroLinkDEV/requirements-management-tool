name: Temporary #561 ready-full dispatcher validation

on:
  push:
    branches:
      - chatgpt/561-ready-full-dispatch
    paths:
      - .github/workflows/temporary-561-ready-full-dispatch.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: windows-latest
    steps:
      - name: Check out stacked task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Apply bounded dispatcher slice
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = @'
          from pathlib import Path

          ci = Path('.github/workflows/ci.yml')
          text = ci.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              text = text.replace(old, new)

          replace_once('''  workflow_dispatch:
              inputs:
                full_diagnostics:
                  description: Run the complete three-shard diagnostic gate
                  required: false
                  default: true
                  type: boolean
          ''', '''  workflow_dispatch:
              inputs:
                full_diagnostics:
                  description: Run the complete three-shard diagnostic gate
                  required: false
                  default: true
                  type: boolean
                pull_request_number:
                  description: Trusted ready-for-full-ci pull request number; leave blank for manual diagnostics
                  required: false
                  default: ''
                  type: string
                pull_request_base_sha:
                  description: Trusted ready-for-full-ci base SHA
                  required: false
                  default: ''
                  type: string
                pull_request_head_sha:
                  description: Trusted ready-for-full-ci exact head SHA
                  required: false
                  default: ''
                  type: string
          ''', 'workflow-dispatch inputs')

          replace_once('''permissions:
              actions: read
              contents: read
          ''', '''permissions:
              actions: read
              contents: read
              pull-requests: read
          ''', 'permissions')

          replace_once('''  group: quality-${{ github.event.pull_request.number || github.ref }}
          ''', '''  group: quality-${{ inputs.pull_request_number || github.event.pull_request.number || github.ref }}
          ''', 'full concurrency')

          replace_once('''        run: node "${{ github.workspace }}/product/ci-metrics/bin/check-main-provenance.mjs"
              - name: Mark setup complete
          ''', '''        run: node "${{ github.workspace }}/product/ci-metrics/bin/check-main-provenance.mjs"
              - name: Authenticate label-dispatched pull-request context
                if: github.event_name == 'workflow_dispatch' && inputs.pull_request_number != ''
                shell: pwsh
                env:
                  GITHUB_TOKEN: ${{ github.token }}
                  REQUESTED_PR_NUMBER: ${{ inputs.pull_request_number }}
                  REQUESTED_BASE_SHA: ${{ inputs.pull_request_base_sha }}
                  REQUESTED_HEAD_SHA: ${{ inputs.pull_request_head_sha }}
                run: |
                  $ErrorActionPreference = 'Stop'
                  if ($env:REQUESTED_PR_NUMBER -notmatch '^[1-9][0-9]*$') { throw 'Invalid pull-request number.' }
                  if ($env:REQUESTED_BASE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Invalid requested base SHA.' }
                  if ($env:REQUESTED_HEAD_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Invalid requested head SHA.' }
                  $headers = @{
                    Authorization = "Bearer $env:GITHUB_TOKEN"
                    Accept = 'application/vnd.github+json'
                    'X-GitHub-Api-Version' = '2022-11-28'
                  }
                  $pr = Invoke-RestMethod -Headers $headers -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/pulls/$env:REQUESTED_PR_NUMBER"
                  if ($pr.state -ne 'open') { throw 'The requested pull request is not open.' }
                  if ($pr.head.repo.full_name -ne $env:GITHUB_REPOSITORY) { throw 'Fork pull requests cannot request privileged Full validation.' }
                  if ($pr.head.sha -ne $env:REQUESTED_HEAD_SHA -or $env:GITHUB_SHA -ne $env:REQUESTED_HEAD_SHA) { throw 'The requested Full run is not attached to the exact current PR head.' }
                  if ($pr.base.sha -ne $env:REQUESTED_BASE_SHA) { throw 'The requested Full run does not match the current PR base.' }
                  if ($env:GITHUB_REF -ne "refs/heads/$($pr.head.ref)") { throw 'Workflow dispatch ref does not match the PR head branch.' }
                  if (-not @($pr.labels | ForEach-Object { $_.name }).Contains('ready-for-full-ci')) { throw 'ready-for-full-ci is no longer present on this pull request.' }
              - name: Mark setup complete
          ''', 'authenticated dispatch guard')

          replace_once('''        env:
                  EVENT_NAME: ${{ github.event_name }}
                  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
                  HEAD_SHA: ${{ github.sha }}
          ''', '''        env:
                  EVENT_NAME: ${{ inputs.pull_request_number != '' && 'pull_request' || github.event_name }}
                  BASE_SHA: ${{ inputs.pull_request_base_sha || github.event.pull_request.base.sha || github.event.before }}
                  HEAD_SHA: ${{ inputs.pull_request_head_sha || github.sha }}
          ''', 'classifier dispatch context')

          ci.write_text(text, encoding='utf-8', newline='')

          requester = Path('.github/workflows/request-full-ci.yml')
          requester.write_text('''name: Request full merge validation

          on:
            pull_request_target:
              types: [labeled]

          permissions:
            actions: write
            contents: read

          jobs:
            dispatch:
              name: Dispatch exact ready-for-full-ci head
              if: github.event.label.name == 'ready-for-full-ci' && github.event.pull_request.head.repo.full_name == github.repository
              runs-on: ubuntu-latest
              steps:
                - name: Dispatch Product quality gate for exact PR head
                  shell: bash
                  env:
                    GITHUB_TOKEN: ${{ github.token }}
                    HEAD_REF: ${{ github.event.pull_request.head.ref }}
                    HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                    BASE_SHA: ${{ github.event.pull_request.base.sha }}
                    PR_NUMBER: ${{ github.event.pull_request.number }}
                  run: |
                    python - <<'PY' > "$RUNNER_TEMP/full-ci-dispatch.json"
                    import json, os
                    print(json.dumps({
                        "ref": os.environ["HEAD_REF"],
                        "inputs": {
                            "pull_request_number": os.environ["PR_NUMBER"],
                            "pull_request_base_sha": os.environ["BASE_SHA"],
                            "pull_request_head_sha": os.environ["HEAD_SHA"],
                            "full_diagnostics": "false",
                        },
                    }))
                    PY
                    curl --fail-with-body --silent --show-error \
                      --request POST \
                      --header "Authorization: Bearer $GITHUB_TOKEN" \
                      --header "Accept: application/vnd.github+json" \
                      --header "X-GitHub-Api-Version: 2022-11-28" \
                      --header "Content-Type: application/json" \
                      --data-binary "@$RUNNER_TEMP/full-ci-dispatch.json" \
                      "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches"
          ''', encoding='utf-8', newline='')

          contract = Path('product/test-planner/tests/full-ci-readiness-dispatch.test.mjs')
          contract.write_text('''import { test } from 'node:test'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          import { fileURLToPath } from 'node:url'

          const repoRoot = fileURLToPath(new URL('../../../', import.meta.url))
          const read = (relative) => readFileSync(new URL(`../../../${relative}`, import.meta.url), 'utf8')
          const requester = read('.github/workflows/request-full-ci.yml')
          const full = read('.github/workflows/ci.yml')

          test('ready label requester is trusted-base, exact-label, same-repository, and dispatch-only', () => {
            assert.match(requester, /pull_request_target:\s*\n\s+types: \[labeled\]/)
            assert.match(requester, /actions: write/)
            assert.match(requester, /contents: read/)
            assert.doesNotMatch(requester, /actions\/checkout|git checkout|git clone/)
            assert.match(requester, /github\.event\.label\.name == 'ready-for-full-ci'/)
            assert.match(requester, /github\.event\.pull_request\.head\.repo\.full_name == github\.repository/)
            assert.match(requester, /pull_request_number.*PR_NUMBER/s)
            assert.match(requester, /pull_request_base_sha.*BASE_SHA/s)
            assert.match(requester, /pull_request_head_sha.*HEAD_SHA/s)
            assert.match(requester, /"ref": os\.environ\["HEAD_REF"\]/)
            assert.match(requester, /actions\/workflows\/ci\.yml\/dispatches/)
          })

          test('full workflow authenticates exact ready PR state before trusting dispatch inputs', () => {
            assert.match(full, /pull_request:\s*\n/)
            for (const input of ['pull_request_number', 'pull_request_base_sha', 'pull_request_head_sha']) {
              assert.match(full, new RegExp(`${input}:`))
            }
            assert.match(full, /pull-requests: read/)
            assert.match(full, /Authenticate label-dispatched pull-request context/)
            assert.match(full, /repos\/\$env:GITHUB_REPOSITORY\/pulls\/\$env:REQUESTED_PR_NUMBER/)
            assert.match(full, /\$pr\.head\.sha -ne \$env:REQUESTED_HEAD_SHA -or \$env:GITHUB_SHA -ne \$env:REQUESTED_HEAD_SHA/)
            assert.match(full, /\$pr\.base\.sha -ne \$env:REQUESTED_BASE_SHA/)
            assert.match(full, /refs\/heads\/\$\(\$pr\.head\.ref\)/)
            assert.match(full, /Contains\('ready-for-full-ci'\)/)
          })

          test('label-dispatched Full reuses PR classification and has independent Full concurrency identity', () => {
            assert.match(full, /quality-\$\{\{ inputs\.pull_request_number \|\| github\.event\.pull_request\.number \|\| github\.ref \}\}/)
            assert.match(full, /EVENT_NAME: \$\{\{ inputs\.pull_request_number != '' && 'pull_request' \|\| github\.event_name \}\}/)
            assert.match(full, /BASE_SHA: \$\{\{ inputs\.pull_request_base_sha \|\| github\.event\.pull_request\.base\.sha \|\| github\.event\.before \}\}/)
            assert.match(full, /HEAD_SHA: \$\{\{ inputs\.pull_request_head_sha \|\| github\.sha \}\}/)
          })
          ''', encoding='utf-8', newline='')
          '@
          $script | python -
          if ($LASTEXITCODE -ne 0) { throw 'Bounded #561 source transformation failed.' }

      - name: Validate planner and dispatcher contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = @(Get-ChildItem -LiteralPath product/test-planner/tests -Filter '*.test.mjs' -File | Sort-Object FullName | ForEach-Object { $_.FullName })
          & node --test $tests
          if ($LASTEXITCODE -ne 0) { throw 'Planner/dispatcher contract suite failed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }

      - name: Commit only production slice and remove temporary orchestrator
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml .github/workflows/request-full-ci.yml product/test-planner/tests/full-ci-readiness-dispatch.test.mjs
          git rm .github/workflows/temporary-561-ready-full-dispatch.yml
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Staged diff check failed.' }
          git diff --cached --stat
          git commit -m 'Add trusted ready-for-full-ci dispatcher'
          git push origin HEAD:chatgpt/561-ready-full-dispatch
