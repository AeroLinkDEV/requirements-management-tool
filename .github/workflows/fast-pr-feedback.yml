name: Fast PR feedback (advisory)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: fast-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  backend-fast:
    name: Fast backend smoke
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      elapsed_ms: ${{ steps.run.outputs.elapsed_ms }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5.0.4
        with:
          path: ~/.nuget/packages
          key: fast-nuget-${{ runner.os }}-${{ hashFiles('product/**/*.csproj', 'product/**/*.props', 'product/**/*.targets', 'product/global.json') }}
          restore-keys: |
            fast-nuget-${{ runner.os }}-
            nuget-${{ runner.os }}-

      - name: Build and run explicit Fast backend manifest
        id: run
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content -Raw -LiteralPath product/test-planner/fast-ci-manifest.json | ConvertFrom-Json -Depth 20
          if ($manifest.authoritative -ne $false -or $manifest.targetMs -ne 240000) { throw 'Fast manifest authority or target changed unexpectedly.' }
          if ($manifest.safety.persistentPostgreSql -ne 'forbidden' -or $manifest.safety.persistentEvidenceRoot -ne 'forbidden') { throw 'Fast manifest persistent-resource safety changed unexpectedly.' }

          $clock = [Diagnostics.Stopwatch]::StartNew()
          try {
            dotnet restore $manifest.backend.build
            if ($LASTEXITCODE -ne 0) { throw 'Fast solution restore failed.' }
            dotnet build $manifest.backend.build --configuration Release --no-restore
            if ($LASTEXITCODE -ne 0) { throw 'Fast solution build failed.' }

            dotnet test $manifest.backend.domainProject --configuration Release --no-build --logger 'console;verbosity=minimal'
            if ($LASTEXITCODE -ne 0) { throw 'Fast domain suite failed.' }

            $infraFilter = @($manifest.backend.infrastructureClasses | ForEach-Object { "FullyQualifiedName~AeroLink.Infrastructure.Tests.$_" }) -join '|'
            dotnet test $manifest.backend.infrastructureProject --configuration Release --no-build --filter $infraFilter --logger 'console;verbosity=minimal'
            if ($LASTEXITCODE -ne 0) { throw 'Fast Infrastructure smoke failed.' }

            $apiFilter = @($manifest.backend.apiClasses | ForEach-Object { "FullyQualifiedName~AeroLink.Api.Tests.$_" }) -join '|'
            dotnet test $manifest.backend.apiProject --configuration Release --no-build --filter $apiFilter --logger 'console;verbosity=minimal'
            if ($LASTEXITCODE -ne 0) { throw 'Fast API smoke failed.' }
          }
          finally {
            $clock.Stop()
            "elapsed_ms=$([int64]$clock.ElapsedMilliseconds)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: State advisory resource boundary
        if: always()
        shell: pwsh
        run: |
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value 'Fast feedback is advisory. Persistent PostgreSQL and product/.local are forbidden; the existing Product quality gate remains merge authority.'

  # The client checks run as parts, and the test parts as Playwright test-level shards (#1313, #1456, #1232). Three
  # unsharded parts still missed: the logic suite alone took 7.9 minutes and its job was cancelled at 10 minutes in 25
  # of 40 runs (2026-10-02..05), and the rendered parts took up to 9.4 and 6.8 minutes against the four-minute target.
  # Static checks run once; logic and the three rendered parts (playwright.rendered.config.ts) are sharded, sized from
  # hosted test durations so no shard's tests take much over two minutes. The matrix must list every shard of every
  # manifest part exactly once (fast-ci-workflow.test.mjs). Each leg keeps one rendered worker, on its own runner.
  client-fast:
    name: Fast client ${{ matrix.part }} (${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: static, shard: 1, shards: 1 }
          - { part: logic, shard: 1, shards: 3 }
          - { part: logic, shard: 2, shards: 3 }
          - { part: logic, shard: 3, shards: 3 }
          - { part: rendered-standard, shard: 1, shards: 2 }
          - { part: rendered-standard, shard: 2, shards: 2 }
          - { part: rendered-cdu, shard: 1, shards: 3 }
          - { part: rendered-cdu, shard: 2, shards: 3 }
          - { part: rendered-cdu, shard: 3, shards: 3 }
          - { part: rendered-3d, shard: 1, shards: 3 }
          - { part: rendered-3d, shard: 2, shards: 3 }
          - { part: rendered-3d, shard: 3, shards: 3 }
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: product/client/package-lock.json

      - name: Run explicit Fast client manifest
        id: run
        shell: pwsh
        env:
          FAST_PART: ${{ matrix.part }}
          FAST_SHARD: ${{ matrix.shard }}
          FAST_SHARDS: ${{ matrix.shards }}
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content -Raw -LiteralPath product/test-planner/fast-ci-manifest.json | ConvertFrom-Json -Depth 20
          $clock = [Diagnostics.Stopwatch]::StartNew()
          Push-Location $manifest.client.workingDirectory
          try {
            $part = $manifest.client.parts.$($env:FAST_PART)
            if (-not $part) { throw "Unreviewed Fast client part: $env:FAST_PART" }
            if ([int]$part.shards -ne [int]$env:FAST_SHARDS) { throw "Fast client part $env:FAST_PART has $($part.shards) shards in the manifest, not $env:FAST_SHARDS." }
            if ($part.renderedPart) { $env:AEROLINK_FAST_RENDERED_PART = $part.renderedPart }
            # The logic and rendered Playwright configs read the shard (fast-shard.ts); other commands run in one-shard parts.
            if ([int]$env:FAST_SHARDS -gt 1) { $env:AEROLINK_FAST_SHARD = "$env:FAST_SHARD/$env:FAST_SHARDS" }
            foreach ($command in @($part.commands)) {
              switch ($command) {
                'npm ci' { npm ci }
                'npm run lint' { npm run lint }
                'npm run typecheck' { npm run typecheck }
                'npm run test:fast:routes' { npm run test:fast:routes }
                'npm run test:fast:logic' { npm run test:fast:logic }
                'npx playwright install chromium' { npx playwright install chromium }
                'npm run test:fast:isolation' { npm run test:fast:isolation }
                'npm run test:fast:rendered' { npm run test:fast:rendered }
                default { throw "Unreviewed Fast client command: $command" }
              }
              if ($LASTEXITCODE -ne 0) { throw "Fast client command failed: $command" }
            }
          }
          finally {
            Pop-Location
            $clock.Stop()
            New-Item -ItemType Directory -Force -Path fast-timing | Out-Null
            @{ part = $env:FAST_PART; shard = [int]$env:FAST_SHARD; shards = [int]$env:FAST_SHARDS; elapsedMs = [int64]$clock.ElapsedMilliseconds } |
              ConvertTo-Json -Compress | Out-File -FilePath "fast-timing/$env:FAST_PART-$env:FAST_SHARD.json" -Encoding utf8
          }

      # A matrix job has one set of outputs, so each leg's command time travels as its own artifact.
      - name: Retain Fast client command time
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fast-timing-${{ matrix.part }}-${{ matrix.shard }}
          path: fast-timing
          retention-days: 7

      - name: Retain Fast client discovery and failure diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fast-client-${{ matrix.part }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            product/client/test-results/fast
            product/client/playwright-report/fast
          retention-days: 7

      - name: State advisory resource boundary
        if: always()
        shell: pwsh
        run: |
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value 'Fast feedback is advisory. Heavy browser/PostgreSQL evidence remains in the unchanged Product quality gate.'

  # The Node contract suites that Full runs inside its Domain job, after a whole-solution build they do not
  # use. In the 2026-09-11..25 window the hosted boundary contracts were the only failing step in ten Full
  # runs, each found about 25 minutes in; here they need a checkout and Node only (#1152 B1). Windows, like
  # the Full owner, because the planner suites exercise the Windows launcher and path behaviour. Full keeps
  # running both suites; this job adds earlier feedback and removes nothing.
  contracts-fast:
    name: Fast repository contracts
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      elapsed_ms: ${{ steps.run.outputs.elapsed_ms }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Run explicit Fast contract manifest
        id: run
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content -Raw -LiteralPath product/test-planner/fast-ci-manifest.json | ConvertFrom-Json
          $clock = [Diagnostics.Stopwatch]::StartNew()
          try {
            foreach ($suite in @($manifest.contracts.suites)) {
              switch ($suite) {
                'product/test-contracts/tests' { }
                'product/test-planner/tests' { }
                default { throw "Unreviewed Fast contract suite: $suite" }
              }
              # Directory-driven, as in Full: a new contract file must not be silently omitted.
              $tests = @(Get-ChildItem -LiteralPath $suite -Filter '*.test.mjs' -File | Sort-Object FullName | ForEach-Object { $_.FullName })
              if ($tests.Count -eq 0) { throw "No contract tests were found under $suite." }
              & node --test $tests
              if ($LASTEXITCODE -ne 0) { throw "Fast contract suite failed: $suite" }
            }
          }
          finally {
            $clock.Stop()
            "elapsed_ms=$([int64]$clock.ElapsedMilliseconds)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

  fast-feedback:
    name: Fast feedback aggregate (advisory)
    if: always()
    needs: [backend-fast, client-fast, contracts-fast]
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Check out the Fast manifest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: product/test-planner/fast-ci-manifest.json
          sparse-checkout-cone-mode: false

      - name: Collect client command times
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fast-timing-*
          path: fast-timing
          merge-multiple: true

      - name: Summarize Fast feedback
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $backend = '${{ needs.backend-fast.result }}'
          $client = '${{ needs.client-fast.result }}'
          $contracts = '${{ needs.contracts-fast.result }}'
          $backendMs = [int64]('0${{ needs.backend-fast.outputs.elapsed_ms }}')
          $contractsMs = [int64]('0${{ needs.contracts-fast.outputs.elapsed_ms }}')
          $manifest = Get-Content -Raw -LiteralPath product/test-planner/fast-ci-manifest.json | ConvertFrom-Json -Depth 20
          # Every shard of every part must report a time; a missing one is an incomplete run, never a fast one.
          $expected = @(foreach ($name in $manifest.client.parts.PSObject.Properties.Name) { foreach ($i in 1..[int]$manifest.client.parts.$name.shards) { "$name-$i" } })
          $legs = @{}
          foreach ($file in @(Get-ChildItem -LiteralPath fast-timing -Filter '*.json' -File -ErrorAction SilentlyContinue)) {
            $leg = Get-Content -Raw -LiteralPath $file.FullName | ConvertFrom-Json
            $legs["$($leg.part)-$($leg.shard)"] = [int64]$leg.elapsedMs
          }
          $missing = @($expected | Where-Object { -not $legs.ContainsKey($_) })
          $clientMs = if ($legs.Count -gt 0) { ($legs.Values | Measure-Object -Maximum).Maximum } else { 0 }
          # The parallel jobs' longest command time; every client shard runs side by side.
          $commandCriticalPathMs = ($backendMs, $clientMs, $contractsMs | Measure-Object -Maximum).Maximum
          $lines = @(
            '## Advisory Fast PR feedback',
            '',
            "- backend-fast: $backend ($backendMs ms command time)",
            "- client-fast: $client (longest shard $clientMs ms command time)"
          )
          foreach ($name in $expected) { $lines += "  - ${name}: $(if ($legs.ContainsKey($name)) { "$($legs[$name]) ms" } else { 'no time reported' })" }
          $lines += @(
            "- contracts-fast: $contracts ($contractsMs ms command time)",
            "- command critical path: $commandCriticalPathMs ms",
            '- target: 240000 ms',
            '- API-independent client logic and rendered fixtures: additive Fast proof; all identities remain in Full',
            '- integrated browsers/PostgreSQL/full matrices: Full proof',
            '- merge authority: unchanged Product quality gate',
            '- workflow start-to-aggregate timing must be measured from Actions job timestamps before phase 2'
          )
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          if ($backend -ne 'success' -or $client -ne 'success' -or $contracts -ne 'success') { throw 'Advisory Fast feedback failed.' }
          if ($missing.Count -gt 0) { throw "Advisory Fast client shards reported no command time: $($missing -join ', ')." }
          if ($commandCriticalPathMs -gt 240000) { throw "Advisory Fast command critical path exceeded 240000 ms: $commandCriticalPathMs ms." }
