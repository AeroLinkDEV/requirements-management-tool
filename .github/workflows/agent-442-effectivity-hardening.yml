name: Issue 442 release-effectivity hardening

on:
  push:
    branches:
      - agent/442-retirement-title-search

permissions:
  contents: write

jobs:
  patch:
    if: ${{ contains(github.event.head_commit.message, '[agent-442-effectivity-hardening]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Keep procedure and execution title search within selected-release effectivity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('product/src/AeroLink.Api/WorkspaceEndpoints.cs')
          text = path.read_text(encoding='utf-8')
          old_procedures = '''            var procedureSearchRevisionIds=effectiveProcedureRevisionIds??await(from revision in db.TestProcedureRevisions.AsNoTracking() join procedure in db.TestProcedures.AsNoTracking().Where(x=>x.ProjectId==projectId) on revision.ProcedureId equals procedure.Id where revision.Revision==db.TestProcedureRevisions.Where(other=>other.ProcedureId==procedure.Id).Max(other=>other.Revision) select revision.Id).ToListAsync(ct);
    var matchingProcedureTitleRevisionIds=await TestProcedureRevisionTitleProjection.MatchingRevisionIdsAsync(db,procedureSearchRevisionIds,q,ct);
            var procedureCandidates=await(from revision in db.TestProcedureRevisions.AsNoTracking() join procedure in db.TestProcedures.AsNoTracking().Where(x=>x.ProjectId==projectId) on revision.ProcedureId equals procedure.Id where (effectiveProcedureRevisionIds==null?revision.Revision==db.TestProcedureRevisions.Where(other=>other.ProcedureId==procedure.Id).Max(other=>other.Revision):effectiveProcedureRevisionIds.Contains(revision.Id))&&(procedure.BaseNumber.ToLower().Contains(identifierQ)||matchingProcedureTitleRevisionIds.Contains(revision.Id)) select new{procedure.Id,procedure.BaseNumber,procedure.Level,revisionId=revision.Id,revision.Revision,revision.State,revision.CreatedAt}).Take(take).ToListAsync(ct);'''
          new_procedures = '''            var procedureSearchRevisionIds=releaseId is null
                ? await(from revision in db.TestProcedureRevisions.AsNoTracking()
                        join procedure in db.TestProcedures.AsNoTracking().Where(x=>x.ProjectId==projectId)
                            on revision.ProcedureId equals procedure.Id
                        where revision.Revision==db.TestProcedureRevisions
                            .Where(other=>other.ProcedureId==procedure.Id).Max(other=>other.Revision)
                        select revision.Id).ToListAsync(ct)
                : effectiveProcedureRevisionIds??[];
            var matchingProcedureTitleRevisionIds=await TestProcedureRevisionTitleProjection.MatchingRevisionIdsAsync(
                db,procedureSearchRevisionIds,q,ct);
            var procedureCandidates=await(from revision in db.TestProcedureRevisions.AsNoTracking()
                join procedure in db.TestProcedures.AsNoTracking().Where(x=>x.ProjectId==projectId)
                    on revision.ProcedureId equals procedure.Id
                where (releaseId==null
                    ? revision.Revision==db.TestProcedureRevisions
                        .Where(other=>other.ProcedureId==procedure.Id).Max(other=>other.Revision)
                    : effectiveProcedureRevisionIds!=null&&effectiveProcedureRevisionIds.Contains(revision.Id))
                    &&(procedure.BaseNumber.ToLower().Contains(identifierQ)
                        ||matchingProcedureTitleRevisionIds.Contains(revision.Id))
                select new{procedure.Id,procedure.BaseNumber,procedure.Level,revisionId=revision.Id,
                    revision.Revision,revision.State,revision.CreatedAt}).Take(take).ToListAsync(ct);'''
          if text.count(old_procedures) != 1:
              raise RuntimeError(f'procedure search block count: {text.count(old_procedures)}')
          text = text.replace(old_procedures, new_procedures)

          old_executions = '''            var executionSearchRevisionIds=await(from revision in db.TestProcedureRevisions.AsNoTracking() join procedure in db.TestProcedures.AsNoTracking().Where(x=>x.ProjectId==projectId) on revision.ProcedureId equals procedure.Id select revision.Id).ToListAsync(ct);
    var matchingExecutionTitleRevisionIds=await TestProcedureRevisionTitleProjection.MatchingRevisionIdsAsync(db,executionSearchRevisionIds,q,ct);
            var executionRows=await(from execution in db.TestExecutions.AsNoTracking().Where(x=>x.ProjectId==projectId) join revision in db.TestProcedureRevisions.AsNoTracking() on execution.ProcedureRevisionId equals revision.Id join procedure in db.TestProcedures.AsNoTracking() on revision.ProcedureId equals procedure.Id where procedure.BaseNumber.ToLower().Contains(identifierQ)||matchingExecutionTitleRevisionIds.Contains(revision.Id)||execution.Determination.ToLower().Contains(q)||execution.EvidenceReference.ToLower().Contains(q) select new{execution.Id,revisionId=revision.Id,identifier=procedure.BaseNumber+"."+(revision.Revision<10?"0":"")+revision.Revision,procedure.BaseNumber,execution.Determination,execution.EvidenceReference,execution.Outcome,execution.RecordedAt,procedure.Level}).Take(take).ToListAsync(ct);'''
          new_executions = '''            var executionSearchRevisionIds=releaseId is null
                ? await(from revision in db.TestProcedureRevisions.AsNoTracking()
                        join procedure in db.TestProcedures.AsNoTracking().Where(x=>x.ProjectId==projectId)
                            on revision.ProcedureId equals procedure.Id
                        select revision.Id).ToListAsync(ct)
                : effectiveProcedureRevisionIds??[];
            var matchingExecutionTitleRevisionIds=await TestProcedureRevisionTitleProjection.MatchingRevisionIdsAsync(
                db,executionSearchRevisionIds,q,ct);
            var executionRows=await(from execution in db.TestExecutions.AsNoTracking().Where(x=>x.ProjectId==projectId)
                join revision in db.TestProcedureRevisions.AsNoTracking()
                    on execution.ProcedureRevisionId equals revision.Id
                join procedure in db.TestProcedures.AsNoTracking()
                    on revision.ProcedureId equals procedure.Id
                where (releaseId==null
                    ||(effectiveProcedureRevisionIds!=null&&effectiveProcedureRevisionIds.Contains(revision.Id)))
                    &&(procedure.BaseNumber.ToLower().Contains(identifierQ)
                        ||matchingExecutionTitleRevisionIds.Contains(revision.Id)
                        ||execution.Determination.ToLower().Contains(q)
                        ||execution.EvidenceReference.ToLower().Contains(q))
                select new{execution.Id,revisionId=revision.Id,
                    identifier=procedure.BaseNumber+"."+(revision.Revision<10?"0":"")+revision.Revision,
                    procedure.BaseNumber,execution.Determination,execution.EvidenceReference,
                    execution.Outcome,execution.RecordedAt,procedure.Level}).Take(take).ToListAsync(ct);'''
          if text.count(old_executions) != 1:
              raise RuntimeError(f'execution search block count: {text.count(old_executions)}')
          path.write_text(text.replace(old_executions, new_executions), encoding='utf-8')

          test = Path('product/tests/AeroLink.Api.Tests/TestProcedureRevisionHistoryApiTests.cs')
          text = test.read_text(encoding='utf-8')
          marker = '''        var retiredSearch = await JsonAsync(client,
            $"/api/search?projectId={fixture.ProjectId}&query=route%20sequencing%20and%20discontinuities");'''
          insertion = '''        var predecessorReleaseSearch = await JsonAsync(client,
            $"/api/search?projectId={fixture.ProjectId}&releaseId={fixture.Release15Id}" +
            "&query=route%20sequencing%20and%20discontinuities");
        Assert.DoesNotContain(predecessorReleaseSearch.GetProperty("items").EnumerateArray(),
            x => x.GetProperty("kind").GetString() is "test-procedure" or "test-execution");

''' + marker
          if text.count(marker) != 1:
              raise RuntimeError(f'predecessor-release test marker count: {text.count(marker)}')
          test.write_text(text.replace(marker, insertion), encoding='utf-8')
          PY

      - name: Install .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Validate release-scoped universal search
        shell: bash
        run: |
          dotnet restore product/AeroLink.slnx
          dotnet build product/AeroLink.slnx --configuration Release --no-restore --verbosity minimal
          dotnet test product/tests/AeroLink.Api.Tests/AeroLink.Api.Tests.csproj \
            --configuration Release --no-build \
            --filter "FullyQualifiedName~TestProcedureRevisionHistoryApiTests" \
            --logger "console;verbosity=normal"

      - name: Publish effectivity hardening
        shell: bash
        run: |
          git diff --check
          git config user.name "seanmccarthyns"
          git config user.email "seanmccarthyns@gmail.com"
          git add product/src/AeroLink.Api/WorkspaceEndpoints.cs \
            product/tests/AeroLink.Api.Tests/TestProcedureRevisionHistoryApiTests.cs
          git commit -m "Keep authoritative title search inside release effectivity (#442)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
